<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tutorial · The Adventure of the White Square</title>
<link rel="stylesheet" href="css/tutorial.css">
</head>
<body>
<div class="bg"></div>
<div class="bg-grid"></div>

<div class="tutorial-shell">
    <header class="tutorial-head">
        <div class="brand">
            <span class="brand-title">WHITE SQUARE</span>
            <span class="brand-sub">Tutorial</span>
        </div>
        <div class="head-actions">
            <a class="back-home" id="backHome" href="../主页/index.html" style="display:none">← Back to Home</a>
            <button class="skip-btn" id="skipBtn">Skip Tutorial →</button>
        </div>
    </header>

    <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <main class="tutorial-main">
        <div class="stage">
            <canvas id="demoCanvas" width="420" height="280"></canvas>
            <div class="stage-caption" id="stageCaption">Demo</div>
        </div>

        <section class="panel">
            <div class="chapter-tag" id="chapterTag">Chapter 1 · The Basics</div>
            <div class="step-index" id="stepIndex">01 / 13</div>
            <h1 class="step-title" id="stepTitle">Loading</h1>
            <p class="step-desc" id="stepDesc"></p>

            <div class="key-row" id="keyRow"></div>

            <ul class="point-list" id="pointList"></ul>

            <div class="nav-row">
                <button class="nav-btn ghost" id="prevBtn">Previous</button>
                <button class="nav-btn primary" id="nextBtn">Next</button>
            </div>
            <div class="hint-line">← → switch　·　Enter continue　·　Esc skip</div>
        </section>
    </main>

    <div class="dots" id="dots"></div>
    <footer class="tutorial-foot">By @ bean soil　·　After the tutorial you enter the beginner stage</footer>
</div>

<script src="js/tutorial.js"></script>
</body>
</html>
