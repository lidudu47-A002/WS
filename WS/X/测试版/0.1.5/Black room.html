<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>黑屋 · 从左到右（增强版）</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body { background:#000; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif; }
        .game-wrapper { position:relative; margin-top:0; }
        canvas { display:block; width:min(95vw,800px); height:auto; aspect-ratio:800/400; background:#000; border:1px solid #333; cursor:crosshair; }
        .status-panel { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:300px; background:rgba(20,20,20,0.96); border:2px solid #aaa; border-radius:16px; color:#fff; padding:1.5rem; backdrop-filter:blur(4px); box-shadow:0 0 30px rgba(255,215,0,0.3); z-index:30; display:none; font-size:1.1rem; }
        .status-panel h2 { text-align:center; color:gold; margin-bottom:1rem; border-bottom:1px solid #555; padding-bottom:0.5rem; }
        .status-row { display:flex; justify-content:space-between; margin:0.5rem 0; padding:0.2rem 0; border-bottom:1px dashed #333; }
        .status-label { color:#ccc; }
        .status-value { font-weight:bold; color:#ffd700; }
        .close-hint { text-align:center; margin-top:1rem; color:#888; font-size:0.9rem; border-top:1px solid #444; padding-top:0.5rem; }
        .victory-message { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:gold; font-size:4rem; font-weight:bold; text-shadow:0 0 20px orange; z-index:20; pointer-events:none; display:none; }
        #nextMapBtn { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); padding:20px 40px; background:#222; color:gold; border:3px solid gold; border-radius:12px; font-size:28px; cursor:pointer; display:none; z-index:100; font-weight:bold; box-shadow:0 0 20px rgba(255,215,0,0.5); }
        .save-message, .respawn-message { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:gold; font-size:1.5rem; padding:0.5rem 1rem; border-radius:8px; border:2px solid gold; white-space:nowrap; z-index:25; pointer-events:none; display:none; }
        .respawn-message { color:#ffaa00; border-color:#ffaa00; }

        /* 全屏商店面板 */
        .shop-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .shop-content {
            background: rgba(30,30,40,0.9);
            border-radius: 30px;
            padding: 2rem;
            width: 80%;
            max-width: 900px;
            box-shadow: 0 0 30px gold;
            border: 2px solid gold;
            position: relative;
        }
        .boss-image {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 128px;
            height: 128px;
            background-image: url('素材/商店/老板.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            filter: drop-shadow(0 0 8px gold);
        }
        .items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
        }
        .shop-item-card {
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 1.5rem;
            width: 180px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid #aaa;
        }
        .shop-item-card:hover {
            transform: scale(1.05);
            background: rgba(0,0,0,0.9);
            border-color: gold;
        }
        .shop-item-icon img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }
        .shop-item-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: gold;
        }
        .shop-item-price {
            font-size: 1rem;
            color: #fff;
            margin-top: 0.3rem;
        }
        .close-shop {
            text-align: center;
            margin-top: 1rem;
        }
        .close-shop-btn {
            background: #555;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            color: white;
        }
        .close-shop-btn:hover {
            background: #777;
        }

        /* 购买确认模态框 */
        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            display: none;
        }
        .confirm-content {
            background: #222;
            border-radius: 30px;
            padding: 2rem;
            text-align: center;
            width: 300px;
            border: 2px solid gold;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .confirm-icon img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 1rem;
        }
        .confirm-text {
            font-size: 1.2rem;
            margin: 1rem 0;
            color: #fff;
        }
        .confirm-buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 1.5rem;
        }
        .confirm-buy, .confirm-cancel {
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .confirm-buy {
            background: gold;
            color: black;
        }
        .confirm-cancel {
            background: #555;
            color: white;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="status-panel" id="statusPanel">
        <h2>角色状态</h2>
        <div class="status-row"><span class="status-label">LV</span><span class="status-value" id="panelLevel">1</span></div>
        <div class="status-row"><span class="status-label">EXP</span><span class="status-value" id="panelExp">0/100</span></div>
        <div class="status-row"><span class="status-label">金币</span><span class="status-value" id="panelGold">0</span></div>
        <div class="status-row"><span class="status-label">杀敌数</span><span class="status-value" id="panelKills">0</span></div>
        <div class="status-row"><span class="status-label">当前区块</span><span class="status-value" id="panelChunk">0</span></div>
        <div class="status-row"><span class="status-label">攻击力(普攻)</span><span class="status-value" id="panelAtk">10</span></div>
        <div class="status-row"><span class="status-label">技能倍率</span><span class="status-value" id="panelMult">x1.00</span></div>
        <div class="close-hint">松开 F 关闭</div>
    </div>

    <!-- 全屏商店 -->
    <div id="shopPanel" class="shop-panel">
        <div class="shop-content">
            <div class="boss-image"></div>
            <h2 style="text-align:center; color:gold;">🛒 黑市商店</h2>
            <div class="items-container" id="itemsContainer">
                <div class="shop-item-card" data-item="hp">
                    <div class="shop-item-icon"><img src="素材/商店/HP药水.png" alt="HP药水"></div>
                    <div class="shop-item-name">HP药水</div>
                    <div class="shop-item-price">30 金币</div>
                </div>
                <div class="shop-item-card" data-item="normalAtk">
                    <div class="shop-item-icon"><img src="素材/商店/normal attack药水.png" alt="普攻药水"></div>
                    <div class="shop-item-name">普攻药水</div>
                    <div class="shop-item-price">100 金币</div>
                </div>
                <div class="shop-item-card" data-item="skill">
                    <div class="shop-item-icon"><img src="素材/商店/skill药水.png" alt="技能药水"></div>
                    <div class="shop-item-name">技能药水</div>
                    <div class="shop-item-price">50 金币</div>
                </div>
            </div>
            <div class="close-shop">
                <div class="close-shop-btn" id="closeShopBtn">关闭商店</div>
            </div>
        </div>
    </div>

    <!-- 购买确认模态框 -->
    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-content">
            <div id="confirmIcon" class="confirm-icon"></div>
            <div id="confirmText" class="confirm-text">购买 HP药水？</div>
            <div class="confirm-buttons">
                <div id="confirmBuy" class="confirm-buy">购买</div>
                <div id="confirmCancel" class="confirm-cancel">取消</div>
            </div>
        </div>
    </div>

    <div class="victory-message" id="victoryMessage">胜利！</div>
    <div id="nextMapBtn">下一站：监狱</div>
    <div class="save-message" id="saveMessage">✨ 游戏已保存 ✨</div>
    <div class="respawn-message" id="respawnMessage">💀 从存档点复活 💀</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
</div>

<script>
(function(){
    // ---------- 游戏核心 ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const victoryMsgDiv = document.getElementById('victoryMessage');
    const nextMapBtn = document.getElementById('nextMapBtn');
    const saveMsgDiv = document.getElementById('saveMessage');
    const respawnMsgDiv = document.getElementById('respawnMessage');
    const statusPanel = document.getElementById('statusPanel');
    const panelLevel = document.getElementById('panelLevel');
    const panelExp = document.getElementById('panelExp');
    const panelGold = document.getElementById('panelGold');
    const panelKills = document.getElementById('panelKills');
    const panelChunk = document.getElementById('panelChunk');
    const panelAtk = document.getElementById('panelAtk');
    const panelMult = document.getElementById('panelMult');

    const CHUNK_SIZE = 400;
    const VIEW_W = 800, VIEW_H = 400;
    const WORLD_H = 400;
    const MAP_CHUNKS = 20;
    let WORLD_W = MAP_CHUNKS * CHUNK_SIZE;

    const DEAD_ZONE_LEFT = VIEW_W / 3;
    const DEAD_ZONE_RIGHT = VIEW_W * 2 / 3;

    const GRAVITY = 0.4;
    const JUMP_POWER = -8;
    const GROUND_Y_OFFSET = 10;
    const STAND_H = 30, DUCK_H = 15;
    const ATK_DUR = 200;
    const ATK_RANGE = 20;
    const STUN_DUR = 12;

    const MAX_ENEMY = 15;
    const ENEMY_W = 30, ENEMY_H = 30;
    const ENEMY_SPD = 1.2;
    const ENEMY_HP = 50;

    const BASE_ATTACK_DAMAGE = 10;
    const BASE_BRICK_DAMAGE = 50;
    const BASE_PIERCE_PASS = 20;
    const BASE_PIERCE_FINAL_ADD = 180;

    const BRICK_W = 20, BRICK_H = 12;
    const BRICK_SPD = 6;
    const BRICK_BACK = 30;
    const BRICK_GRAV = 0.05;

    const PIERCE_CD = 15000;
    const PIERCE_BASE = 3;
    const PIERCE_MAX = 8;
    const PIERCE_CHARGE_RATE = 1;
    const PIERCE_W = 5, PIERCE_H = 8;
    const PIERCE_SPD = 10;

    const BOSS_SIZE = 200;
    const BOSS_HP = 1000;
    const BOSS_SPEED = 1.5;
    let BOSS_X = WORLD_W - BOSS_SIZE;
    let BOSS_Y = WORLD_H - BOSS_SIZE - GROUND_Y_OFFSET;

    const PLAYER_MAX_HP = 100;
    let playerHP = PLAYER_MAX_HP;
    let gold = 0, exp = 0, level = 1, killCount = 0;
    const EXP_PER_LV = 100;

    let normalAttackMult = 1.0;
    let skillDamageMult = 1.0;

    let victory = false, gameOver = false, panelVisible = false;
    let cameraX = 0;

    let enemies = [];
    let projectiles = [];
    let boss = null;
    let pierceProjectile = null;

    let charging = false;
    let previewBrick = { worldX: 0, worldY: 0, angle: 0, active: false };
    let mouseScreenX = 0, mouseScreenY = 0;

    let left = false, right = false, jumpUsed = false, shiftDown = false, arrowDown = false;

    // 装饰壁灯
    const DECOS = [];
    for (let i = 0; i < 10; i++) {
        let x = 100 + (i / 9) * (WORLD_W - 200);
        DECOS.push({ x, y: WORLD_H/2 - 15, w: 12, h: 30, color: '#ffaa00' });
    }

    // 存档点
    const SAVE_ZONE_W = 200;
    const SAVE_OFFSET = 100;
    let savePoints = [];
    let lastSaveTime = 0;
    const SAVE_COOLDOWN = 5000;
    let savedData = { hp: PLAYER_MAX_HP, worldX: 0, gold: 0, exp: 0, level: 1, kills: 0, normalAttackMult:1.0, skillDamageMult:1.0 };
    let hasSave = false;
    const SAVE_INTERVAL = 10 * CHUNK_SIZE;
    for (let i = 1; i * SAVE_INTERVAL < WORLD_W; i++) {
        let zoneX = i * SAVE_INTERVAL + SAVE_OFFSET;
        savePoints.push({ x: zoneX, width: SAVE_ZONE_W, starX: zoneX + SAVE_ZONE_W/2 });
    }

    let saveStarImage = null;
    const ANIMATION_SCALE = 2;
    const ANIMATION_SIZE = 32 * ANIMATION_SCALE;
    function loadSaveStarImage() {
        const img = new Image();
        img.src = '素材/存档点.gif';
        img.onload = () => { saveStarImage = img; };
        img.onerror = () => { console.warn('未找到存档点图片，使用默认星星'); };
    }
    loadSaveStarImage();

    // 刷新点
    let SPAWN_POINTS = [], chunkSpawnPoints = [], chunkLastSpawn = [];
    function genSpawnPoints() {
        SPAWN_POINTS = [];
        let pad = 100;
        for (let i = 0; i < MAP_CHUNKS; i++) {
            let x = pad + (i / (MAP_CHUNKS-1)) * (WORLD_W - 2*pad);
            SPAWN_POINTS.push(Math.floor(x));
        }
        chunkSpawnPoints = Array.from({ length: MAP_CHUNKS }, () => []);
        SPAWN_POINTS.forEach((x, idx) => {
            let c = Math.floor(x / CHUNK_SIZE);
            chunkSpawnPoints[c].push(x);
        });
        chunkLastSpawn = Array(MAP_CHUNKS).fill(0).map(() => performance.now() - Math.random()*10000);
    }
    genSpawnPoints();

    function spawnEnemyInChunk(chunkIdx) {
        let pts = chunkSpawnPoints[chunkIdx];
        if (!pts.length) return false;
        let sx = pts[Math.floor(Math.random()*pts.length)];
        let sy = WORLD_H - ENEMY_H - GROUND_Y_OFFSET;
        enemies.push({
            x: sx, y: sy, w: ENEMY_W, h: ENEMY_H,
            hp: ENEMY_HP, stun: 0, color: '#ff0000',
            hitFlash: 0
        });
        return true;
    }

    let player = {
        x: 0, y: 0, w: 30, h: STAND_H,
        vx: 0, vy: 0, facing: 1,
        attacking: false, attackStart: 0,
        visualOffX: 0, jumpsLeft: 2
    };
    function getGroundY() { return WORLD_H - player.h - GROUND_Y_OFFSET; }
    player.y = getGroundY();

    function updatePanelUI() {
        let curChunk = Math.floor((player.x + player.w/2) / CHUNK_SIZE);
        panelLevel.innerText = level;
        panelExp.innerText = `${exp}/${EXP_PER_LV}`;
        panelGold.innerText = gold;
        panelKills.innerText = killCount;
        panelChunk.innerText = curChunk;
        panelAtk.innerText = getAttackDamage();
        panelMult.innerText = `x${getSkillMultiplier().toFixed(2)}`;
    }
    updatePanelUI();

    function addKillReward() {
        gold += Math.floor(Math.random() * 5) + 1;
        exp += Math.floor(Math.random() * 5) + 1;
        while (exp >= EXP_PER_LV) { exp -= EXP_PER_LV; level++; }
        if (panelVisible) updatePanelUI();
    }

    function getAttackDamage() {
        let base = BASE_ATTACK_DAMAGE + (level - 1) * 5;
        return Math.floor(base * normalAttackMult);
    }
    function getSkillMultiplier() {
        return (1 + (level - 1) * 0.2) * skillDamageMult;
    }
    function getBrickDamage() {
        return Math.floor(BASE_BRICK_DAMAGE * getSkillMultiplier());
    }
    function getPiercePassDamage() {
        return Math.floor(BASE_PIERCE_PASS * getSkillMultiplier());
    }
    function getPierceFinalAdd() {
        return Math.floor(BASE_PIERCE_FINAL_ADD * getSkillMultiplier());
    }

    function doSave(now) {
        if (now - lastSaveTime < SAVE_COOLDOWN) return false;
        lastSaveTime = now;
        savedData = { hp: playerHP, worldX: player.x, gold, exp, level, kills: killCount, normalAttackMult, skillDamageMult };
        hasSave = true;
        playerHP = PLAYER_MAX_HP;
        saveMsgDiv.style.display = 'block';
        setTimeout(() => saveMsgDiv.style.display = 'none', 1500);
        return true;
    }
    function respawn() {
        if (!hasSave) return false;
        playerHP = savedData.hp;
        player.x = savedData.worldX;
        player.y = getGroundY();
        player.vy = 0;
        player.jumpsLeft = 2;
        gold = savedData.gold;
        exp = savedData.exp;
        level = savedData.level;
        killCount = savedData.kills;
        normalAttackMult = savedData.normalAttackMult;
        skillDamageMult = savedData.skillDamageMult;
        projectiles = [];
        pierceProjectile = null;
        cameraX = Math.max(0, Math.min(player.x - VIEW_W/2, WORLD_W - VIEW_W));
        respawnMsgDiv.style.display = 'block';
        setTimeout(() => respawnMsgDiv.style.display = 'none', 2000);
        if (panelVisible) updatePanelUI();
        return true;
    }

    function rectCollide(a, b) {
        return !(b.x >= a.x + a.w || b.x + b.w <= a.x || b.y >= a.y + a.h || b.y + b.h <= a.y);
    }

    function brickHitEnemy(b, e) {
        let cx = b.x + b.w/2, cy = b.y + b.h/2;
        let r = Math.hypot(b.w, b.h)/2;
        let ex = Math.max(e.x, Math.min(cx, e.x+e.w));
        let ey = Math.max(e.y, Math.min(cy, e.y+e.h));
        let dx = cx - ex, dy = cy - ey;
        return dx*dx + dy*dy < r*r;
    }

    function updateCam() {
        let target = cameraX;
        let psx = player.x - cameraX;
        if (psx < DEAD_ZONE_LEFT) target = player.x - DEAD_ZONE_LEFT;
        else if (psx > DEAD_ZONE_RIGHT) target = player.x - DEAD_ZONE_RIGHT;
        target = Math.min(Math.max(0, target), WORLD_W - VIEW_W);
        cameraX += (target - cameraX)*0.1;
        cameraX = Math.min(Math.max(0, cameraX), WORLD_W - VIEW_W);
    }

    function createBoss() {
        boss = {
            x: WORLD_W - BOSS_SIZE, y: WORLD_H - BOSS_SIZE - GROUND_Y_OFFSET,
            w: BOSS_SIZE, h: BOSS_SIZE, hp: BOSS_HP, maxHp: BOSS_HP,
            colors: Array(16).fill('#ff0000'), colorIdx: 0, nextTime: 0, interval: 100,
            speed: 0
        };
    }
    createBoss();

    // 激光系统
    let lasers = [];
    let lastLaser = 0;
    const LASER_DMG = 10;
    const LASER_WARN = 1000;
    const LASER_ACT = 500;
    const LASER_CD = 5000;
    const LASER_INTERVAL = 100;

    function getSlantLaserEndpoints(centerX, angle) {
        const crossY = WORLD_H / 2;
        const k = Math.tan(angle);
        if (Math.abs(k) < 1e-6) return { startX: centerX, endX: centerX };
        const startX = centerX - crossY / k;
        const endX = centerX + (WORLD_H - crossY) / k;
        return { startX, endX };
    }

    function updateLaser(now) {
        if (!boss) return;
        const bossCenter = boss.x + boss.w/2;
        const playerCenter = player.x + player.w/2;
        const distance = Math.abs(bossCenter - playerCenter);
        const isActive = (distance < CHUNK_SIZE);
        if (isActive && lasers.length === 0 && now - lastLaser >= LASER_CD) {
            const targetX = player.x + player.w/2;
            lasers = [
                { state: 'warn', startTime: now, x: targetX, angle: 0, factor: 0, lastDamage: 0, blink: 0 },
                { state: 'warn', startTime: now, x: targetX, angle: -Math.PI/6, factor: 0, lastDamage: 0, blink: 0 },
                { state: 'warn', startTime: now, x: targetX, angle: Math.PI/6, factor: 0, lastDamage: 0, blink: 0 }
            ];
            lastLaser = now;
        }
        for (let i = 0; i < lasers.length; i++) {
            const l = lasers[i];
            if (l.state === 'warn') {
                l.blink = (l.blink + 0.1) % 1;
                if (now - l.startTime >= LASER_WARN) {
                    l.state = 'act';
                    l.startTime = now;
                    l.factor = 0;
                }
            } else if (l.state === 'act') {
                const elapsed = now - l.startTime;
                if (elapsed >= LASER_ACT) {
                    lasers.splice(i,1);
                    i--;
                    continue;
                }
                l.factor = Math.min(1, elapsed / LASER_ACT);
                if (now - l.lastDamage >= LASER_INTERVAL) {
                    let startX, endX;
                    if (l.angle === 0) {
                        startX = l.x;
                        endX = l.x;
                    } else {
                        const { startX: sx, endX: ex } = getSlantLaserEndpoints(l.x, l.angle);
                        startX = sx;
                        endX = ex;
                    }
                    const startY = 0, endY = WORLD_H;
                    const px = player.x + player.w/2;
                    const py = player.y + player.h/2;
                    const ax = px - startX, ay = py - startY;
                    const bx = endX - startX, by = endY - startY;
                    const dot = ax * bx + ay * by;
                    const len2 = bx * bx + by * by;
                    let t = (len2 > 0) ? dot / len2 : 0;
                    t = Math.max(0, Math.min(1, t));
                    const projX = startX + t * bx;
                    const projY = startY + t * by;
                    const dist = Math.hypot(px - projX, py - projY);
                    if (dist < 15) {
                        playerHP = Math.max(0, playerHP - LASER_DMG);
                        lasers.splice(i,1);
                        i--;
                    } else {
                        l.lastDamage = now;
                    }
                }
            }
        }
    }

    function drawLaser() {
        if (!boss) return;
        for (let l of lasers) {
            const startY = 0, endY = WORLD_H;
            let startX, endX;
            if (l.angle === 0) {
                startX = l.x;
                endX = l.x;
            } else {
                const { startX: sx, endX: ex } = getSlantLaserEndpoints(l.x, l.angle);
                startX = sx;
                endX = ex;
            }
            const screenStartX = startX - cameraX;
            const screenEndX = endX - cameraX;
            ctx.beginPath();
            ctx.moveTo(screenStartX, startY);
            if (l.state === 'warn') {
                const alpha = 0.3 + Math.sin(l.blink * Math.PI * 2) * 0.2;
                ctx.lineTo(screenEndX, endY);
                ctx.strokeStyle = `rgba(255,0,0,${alpha})`;
                ctx.lineWidth = 20;
                ctx.stroke();
            } else if (l.state === 'act') {
                const currentEndY = startY + (endY - startY) * l.factor;
                const currentEndX = startX + (endX - startX) * l.factor;
                const screenCurrentEndX = currentEndX - cameraX;
                ctx.lineTo(screenCurrentEndX, currentEndY);
                ctx.strokeStyle = 'rgba(255,50,50,0.9)';
                ctx.lineWidth = 22;
                ctx.stroke();
            }
        }
    }

    let lastPierce = 0, pierceCharge = false, pierceStart = 0;
    let lastBrick = 0;
    const BRICK_CD = 5000;

    function performAttack() {
        let attackDamage = getAttackDamage();
        let rect = {
            x: player.facing===1 ? player.x+player.w : player.x-ATK_RANGE,
            y: player.y, w: ATK_RANGE, h: player.h
        };
        for (let e of enemies) {
            if (rectCollide(rect, e)) {
                e.hp -= attackDamage;
                e.stun = STUN_DUR;
                e.hitFlash = 5;
            }
        }
        if (boss && rectCollide(rect, boss)) {
            boss.hp -= attackDamage;
        }
    }

    // ---------- 商店交互 ----------
    const shopPanel = document.getElementById('shopPanel');
    const confirmModal = document.getElementById('confirmModal');
    let pendingItem = null;

    function openShop() {
        if (victory || gameOver) return;
        shopPanel.style.display = 'flex';
    }
    function closeShop() {
        shopPanel.style.display = 'none';
    }
    function showConfirm(itemType) {
        pendingItem = itemType;
        let iconSrc = '', name = '';
        if (itemType === 'hp') {
            iconSrc = '素材/商店/HP药水.png';
            name = 'HP药水';
        } else if (itemType === 'normalAtk') {
            iconSrc = '素材/商店/normal attack药水.png';
            name = '普攻药水';
        } else if (itemType === 'skill') {
            iconSrc = '素材/商店/skill药水.png';
            name = '技能药水';
        }
        document.getElementById('confirmIcon').innerHTML = `<img src="${iconSrc}" alt="${name}">`;
        document.getElementById('confirmText').innerHTML = `购买 ${name}？`;
        confirmModal.style.display = 'flex';
    }
    function hideConfirm() {
        confirmModal.style.display = 'none';
        pendingItem = null;
    }
    function executePurchase() {
        if (!pendingItem) return;
        let success = false;
        if (pendingItem === 'hp') {
            if (gold >= 30 && playerHP < PLAYER_MAX_HP) {
                gold -= 30;
                playerHP = Math.min(PLAYER_MAX_HP, playerHP + 20);
                success = true;
            } else {
                alert('金币不足或生命已满！');
            }
        } else if (pendingItem === 'normalAtk') {
            if (gold >= 100) {
                gold -= 100;
                normalAttackMult *= 1.2;
                success = true;
            } else {
                alert('金币不足！');
            }
        } else if (pendingItem === 'skill') {
            if (gold >= 50) {
                gold -= 50;
                skillDamageMult *= 1.2;
                success = true;
            } else {
                alert('金币不足！');
            }
        }
        if (success) {
            if (panelVisible) updatePanelUI();
        }
        hideConfirm();
    }

    window.addEventListener('keydown', e => {
        if (victory || gameOver) return;
        if (e.code === 'KeyH') {
            e.preventDefault();
            openShop();

    // ---------- 主更新循环 ----------
    function update(now) {
        if (victory || gameOver) return;
        for (let sp of savePoints) {
            if (player.x + player.w > sp.x && player.x < sp.x + sp.width) {
                doSave(now);
                break;
            }
        }
        if (left && !right) player.facing = -1;
        else if (right && !left) player.facing = 1;
        let dx = 0;
        if (left) dx -= 2.8;
        if (right) dx += 2.8;
        player.x = Math.min(Math.max(0, player.x + dx), WORLD_W - player.w);
        player.vy += GRAVITY;
        player.y += player.vy;
        let grounded = false;
        if (player.y > getGroundY()) {
            player.y = getGroundY(); player.vy = 0; grounded = true;
        }
        if (player.y < 0) { player.y = 0; player.vy = 0; }
        if (grounded || player.y >= getGroundY()-0.001) {
            jumpUsed = false;
            player.jumpsLeft = 2;
        }
        let duck = shiftDown || arrowDown;
        let targetH = (grounded && duck) ? DUCK_H : STAND_H;
        if (targetH !== player.h) {
            let oldBottom = player.y + player.h;
            player.h = targetH;
            if (grounded) player.y = getGroundY();
            else player.y = oldBottom - player.h;
        }
        if (player.attacking) {
            let elapsed = now - player.attackStart;
            let prog = Math.min(elapsed / ATK_DUR, 1);
            let off = player.w * 0.5 * Math.sin(prog * Math.PI);
            player.visualOffX = player.facing * off;
            if (prog >= 1) {
                player.attacking = false;
                player.visualOffX = 0;
            }
        } else player.visualOffX = 0;
        let curChunk = Math.floor((player.x + player.w/2) / CHUNK_SIZE);
        for (let ch = 0; ch < MAP_CHUNKS; ch++) {
            let dist = Math.abs(ch - curChunk);
            let interval = 0;
            if (dist === 0) interval = 4000;
            else if (dist === 1) interval = 8000;
            else if (dist === 2) interval = 10000;
            if (!interval) continue;
            if (enemies.length < MAX_ENEMY && now - chunkLastSpawn[ch] >= interval) {
                if (spawnEnemyInChunk(ch)) chunkLastSpawn[ch] = now;
            }
        }
        if (boss) {
            const bossCenter = boss.x + boss.w/2;
            const playerCenter = player.x + player.w/2;
            const distance = Math.abs(bossCenter - playerCenter);
            if (distance < CHUNK_SIZE) {
                if (playerCenter > bossCenter) boss.speed = BOSS_SPEED;
                else if (playerCenter < bossCenter) boss.speed = -BOSS_SPEED;
                else boss.speed = 0;
            } else boss.speed = 0;
            boss.x += boss.speed;
            boss.x = Math.min(Math.max(0, boss.x), WORLD_W - boss.w);
        }
        for (let i=projectiles.length-1; i>=0; i--) {
            let b = projectiles[i];
            if (b.isEnemy) continue;
            b.vy += BRICK_GRAV;
            b.x += b.vx; b.y += b.vy;
            if (b.x < -50 || b.x > WORLD_W+50 || b.y < -50 || b.y > WORLD_H+50) {
                projectiles.splice(i,1); continue;
            }
            let hit = false;
            let brickDamage = getBrickDamage();
            for (let e of enemies) {
                if (brickHitEnemy(b, e)) {
                    e.hp -= brickDamage;
                    e.stun = STUN_DUR;
                    e.hitFlash = 5;
                    hit=true; break;
                }
            }
            if (!hit && boss && brickHitEnemy(b, boss)) {
                boss.hp -= brickDamage;
                hit=true;
            }
            if (hit) projectiles.splice(i,1);
        }
        for (let e of enemies) {
            if (e.stun > 0) e.stun--;
            if (e.hitFlash > 0) e.hitFlash--;
            let pc = player.x + player.w/2, ec = e.x + e.w/2;
            if (pc > ec) e.x += ENEMY_SPD;
            else if (pc < ec) e.x -= ENEMY_SPD;
            e.x = Math.min(Math.max(0, e.x), WORLD_W - e.w);
        }
        if (pierceCharge && !pierceProjectile && now - lastPierce >= PIERCE_CD) {
            let chargeTime = (now - pierceStart) / 1000;
            let cnt = PIERCE_BASE + Math.floor(chargeTime * PIERCE_CHARGE_RATE);
            cnt = Math.min(cnt, PIERCE_MAX);
            let px = player.x + player.w/2, py = player.y + player.h/2;
            let tx = mouseScreenX + cameraX, ty = mouseScreenY;
            let dx = tx - px, dy = ty - py, len = Math.hypot(dx,dy);
            if (len > 0.001) {
                let nx = dx/len, ny = dy/len;
                pierceProjectile = {
                    x: px - PIERCE_W/2, y: py - PIERCE_H/2,
                    vx: nx * PIERCE_SPD, vy: ny * PIERCE_SPD,
                    w: PIERCE_W, h: PIERCE_H,
                    left: cnt, hitSet: new Set(), lastEnemy: null,
                    passDamage: getPiercePassDamage(),
                    finalAdd: getPierceFinalAdd()
                };
            }
            lastPierce = now;
            pierceCharge = false;
        }
        if (pierceProjectile) {
            let p = pierceProjectile;
            p.x += p.vx; p.y += p.vy;
            if (p.x < -50 || p.x > WORLD_W+50 || p.y < -50 || p.y > WORLD_H+50) {
                pierceProjectile = null;
            } else {
                for (let e of enemies) {
                    if (p.hitSet.has(e)) continue;
                    if (rectCollide({x:p.x, y:p.y, w:p.w, h:p.h}, e)) {
                        e.hp -= p.passDamage;
                        e.stun = STUN_DUR;
                        e.hitFlash = 5;
                        p.hitSet.add(e);
                        p.left--;
                        p.lastEnemy = e;
                        if (p.left <= 0) {
                            if (p.lastEnemy) p.lastEnemy.hp -= p.finalAdd;
                            pierceProjectile = null;
                            break;
                        }
                    }
                }
            }
        }
        updateLaser(now);
        if (boss && now >= (boss.nextTime || 0)) {
            boss.nextTime = now + boss.interval;
            let cols = ['#ff0000','#ff7f00','#ffff00','#00ff00','#0000ff','#4b0082','#8f00ff','#ffffff'];
            boss.colors[boss.colorIdx] = cols[Math.floor(Math.random()*cols.length)];
            boss.colorIdx = (boss.colorIdx+1) % 16;
        }
        let oldLen = enemies.length;
        enemies = enemies.filter(e => e.hp > 0);
        let killed = oldLen - enemies.length;
        if (killed > 0) {
            killCount += killed;
            for (let i=0;i<killed;i++) addKillReward();
        }
        let allEntities = [player, ...enemies];
        if (boss) allEntities.push(boss);
        const ITER = 12;
        for (let iter = 0; iter < ITER; iter++) {
            for (let i = 0; i < allEntities.length; i++) {
                for (let j = i+1; j < allEntities.length; j++) {
                    let a = allEntities[i];
                    let b = allEntities[j];
                    let overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
                    let overlapY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
                    if (overlapX > 0 && overlapY > 0) {
                        let dx = overlapX / 2;
                        if (a.x < b.x) { a.x -= dx; b.x += dx; }
                        else { a.x += dx; b.x -= dx; }
                    }
                }
            }
            for (let e of allEntities) {
                e.x = Math.min(Math.max(0, e.x), WORLD_W - e.w);
            }
        }
        if (playerHP <= 0) {
            if (!respawn()) gameOver = true;
        }
        if (boss && boss.hp <= 0 && !victory) {
            victory = true;
            victoryMsgDiv.style.display = 'block';
            nextMapBtn.style.display = 'block';
            boss = null;
        }
        updateCam();
        if (panelVisible) updatePanelUI();
    }

    function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
        for (let d of DECOS) {
            let sx = d.x - cameraX;
            if (sx + d.w < 0 || sx > VIEW_W) continue;
            ctx.fillStyle = d.color;
            ctx.fillRect(sx, d.y, d.w, d.h);
        }
        for (let sp of savePoints) {
            let sx = sp.starX - cameraX;
            if (sx+25 < 0 || sx-25 > VIEW_W) continue;
            let sy = WORLD_H - 70;
            const displaySize = ANIMATION_SIZE;
            const halfSize = displaySize / 2;
            if (saveStarImage && saveStarImage.complete && saveStarImage.naturalWidth > 0) {
                ctx.drawImage(saveStarImage, sx - halfSize, sy - halfSize, displaySize, displaySize);
                ctx.save();
                ctx.shadowColor = 'rgba(255, 215, 0, 0.6)';
                ctx.shadowBlur = 10;
                ctx.drawImage(saveStarImage, sx - halfSize, sy - halfSize, displaySize, displaySize);
                ctx.restore();
            } else {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(sx, sy, 16, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#ffaa33';
                for (let i=0;i<6;i++) {
                    let ang = i * Math.PI*2/6;
                    let x = sx + Math.cos(ang)*24, y = sy + Math.sin(ang)*24;
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
        for (let e of enemies) {
            let sx = e.x - cameraX;
            if (sx+e.w <0 || sx>VIEW_W) continue;
            if (e.hitFlash > 0) ctx.fillStyle = '#ffffff';
            else ctx.fillStyle = e.color;
            ctx.fillRect(sx, e.y, e.w, e.h);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(e.hp, sx+6, e.y-5);
        }
        for (let b of projectiles) {
            let sx = b.x - cameraX;
            if (sx+b.w<0 || sx>VIEW_W) continue;
            if (b.isEnemy) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(sx, b.y, b.w, b.h);
            } else {
                ctx.save();
                ctx.translate(sx+b.w/2, b.y+b.h/2);
                ctx.rotate(b.angle);
                ctx.fillStyle = '#b8860b';
                ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
                ctx.restore();
            }
        }
        if (pierceProjectile) {
            let sx = pierceProjectile.x - cameraX;
            let sy = pierceProjectile.y;
            ctx.fillStyle = '#fff';
            ctx.fillRect(sx, sy, PIERCE_W, PIERCE_H);
        }
        drawLaser();
        if (charging && previewBrick.active) {
            let sx = previewBrick.worldX - cameraX;
            let sy = previewBrick.worldY;
            ctx.save();
            ctx.translate(sx + BRICK_W/2, sy + BRICK_H/2);
            ctx.rotate(previewBrick.angle);
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = '#cd853f';
            ctx.fillRect(-BRICK_W/2, -BRICK_H/2, BRICK_W, BRICK_H);
            ctx.restore();
            let pcx = player.x, pcy = player.y + player.h/2;
            let tx = mouseScreenX + cameraX, ty = mouseScreenY;
            let dx = tx - pcx, dy = ty - pcy, len = Math.hypot(dx,dy);
            if (len > 0.001) {
                let nx = dx/len, ny = dy/len;
                let sx2 = previewBrick.worldX + BRICK_W/2;
                let sy2 = previewBrick.worldY + BRICK_H/2;
                let vx = nx * BRICK_SPD, vy = ny * BRICK_SPD;
                ctx.beginPath();
                ctx.strokeStyle = '#aaa';
                ctx.setLineDash([4,4]);
                ctx.lineWidth = 1.5;
                let x = sx2, y = sy2;
                let vxs = vx, vys = vy;
                ctx.moveTo(x - cameraX, y);
                for (let t = 0.1; t <= 2.0; t += 0.1) {
                    vys += BRICK_GRAV * 0.1;
                    x += vxs * 0.1;
                    y += vys * 0.1;
                    ctx.lineTo(x - cameraX, y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x - cameraX, y, 3, 0, Math.PI*2);
                ctx.fill();
            }
        }
        if (boss) {
            let sx = boss.x - cameraX;
            if (sx + boss.w > 0 && sx < VIEW_W) {
                let cellW = boss.w/4, cellH = boss.h/4;
                for (let i=0;i<4;i++) for (let j=0;j<4;j++) {
                    let idx = i*4+j;
                    ctx.fillStyle = boss.colors[idx];
                    ctx.fillRect(sx + j*cellW, boss.y + i*cellH, cellW, cellH);
                }
                ctx.fillStyle = '#f00';
                ctx.fillRect(sx, boss.y-12, boss.w, 6);
                ctx.fillStyle = '#0f0';
                ctx.fillRect(sx, boss.y-12, boss.w * (boss.hp/boss.maxHp), 6);
            }
        }
        let px = player.x - cameraX + player.visualOffX;
        ctx.fillStyle = '#fff';
        ctx.fillRect(px, player.y, player.w, player.h);
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.roundRect(px+player.w/2-14, player.y-20, 28, 20, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(player.facing===1?'→':'←', px+player.w/2, player.y-10);
        ctx.fillStyle = '#ff0';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('⤴'+player.jumpsLeft, px+player.w/2, player.y-23);
        const barWidth = 200, barHeight = 20;
        const hpPercent = Math.min(1, Math.max(0, playerHP / PLAYER_MAX_HP));
        ctx.fillStyle = '#333';
        ctx.fillRect(10, 10, barWidth, barHeight);
        ctx.fillStyle = '#f00';
        ctx.fillRect(10, 10, barWidth * hpPercent, barHeight);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, barWidth, barHeight);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px monospace';
        ctx.fillText(`HP: ${Math.floor(playerHP)}/${PLAYER_MAX_HP}`, 15, 25);
        if (gameOver) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 48px monospace';
            ctx.fillText('游戏结束', VIEW_W/2, VIEW_H/2);
        }
    }

    // 交互
    function updatePreview() {
        let pcx = player.x, pcy = player.y + player.h/2;
        let tw = mouseScreenX + cameraX, th = mouseScreenY;
        let dx = tw - pcx, dy = th - pcy, len = Math.hypot(dx,dy);
        if (len > 0.001) {
            let nx = dx/len, ny = dy/len;
            previewBrick.worldX = pcx - nx * BRICK_BACK;
            previewBrick.worldY = pcy - ny * BRICK_BACK;
            previewBrick.angle = Math.atan2(dy,dx);
            previewBrick.active = true;
        } else previewBrick.active = false;
    }

    canvas.addEventListener('mousemove', e => {
        let rect = canvas.getBoundingClientRect();
        let sx = canvas.width / rect.width, sy = canvas.height / rect.height;
        mouseScreenX = (e.clientX - rect.left) * sx;
        mouseScreenY = (e.clientY - rect.top) * sy;
        mouseScreenX = Math.min(Math.max(0, mouseScreenX), VIEW_W);
        mouseScreenY = Math.min(Math.max(0, mouseScreenY), VIEW_H);
        if (charging) updatePreview();
    });
    canvas.addEventListener('mousedown', e => {
        if (victory || gameOver) return;
        if (e.button === 0) {
            e.preventDefault();
            if (!player.attacking) {
                player.attacking = true;
                player.attackStart = performance.now();
                performAttack();
            }
        } else if (e.button === 2) {
            e.preventDefault();
            charging = true;
            updatePreview();
        }
    });
    canvas.addEventListener('mouseup', e => {
        if (victory || gameOver) return;
        if (e.button === 2 && charging) {
            e.preventDefault();
            let now = performance.now();
            if (now - lastBrick < BRICK_CD) { charging = false; return; }
            lastBrick = now;
            let pcx = player.x, pcy = player.y + player.h/2;
            let tw = mouseScreenX + cameraX, th = mouseScreenY;
            let dx = tw - pcx, dy = th - pcy, len = Math.hypot(dx,dy);
            if (len > 0.001) {
                let nx = dx/len, ny = dy/len;
                projectiles.push({
                    x: previewBrick.worldX, y: previewBrick.worldY,
                    vx: nx*BRICK_SPD, vy: ny*BRICK_SPD,
                    angle: previewBrick.angle, w: BRICK_W, h: BRICK_H,
                    damage: getBrickDamage(), isEnemy: false
                });
            }
            charging = false;
        }
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('mouseleave', () => charging = false);

    window.addEventListener('keydown', e => {
        if (victory || gameOver) return;
        let code = e.code;
        if (code === 'KeyF') {
            e.preventDefault();
            if (!panelVisible) { panelVisible=true; statusPanel.style.display='block'; updatePanelUI(); }
            return;
        }
        if (code === 'KeyA' || code === 'ArrowLeft') { left = true; e.preventDefault(); }
        else if (code === 'KeyD' || code === 'ArrowRight') { right = true; e.preventDefault(); }
        else if (code === 'Space' || code === 'ArrowUp') {
            if (!jumpUsed) {
                let onGround = player.y >= getGroundY() - 0.001;
                if (onGround || player.jumpsLeft > 0) {
                    player.vy = JUMP_POWER;
                    jumpUsed = true;
                    player.jumpsLeft = onGround ? 1 : player.jumpsLeft - 1;
                }
            }
            e.preventDefault();
        }
        else if (code === 'ShiftLeft' || code === 'ShiftRight') { shiftDown = true; e.preventDefault(); }
        else if (code === 'ArrowDown') { arrowDown = true; e.preventDefault(); }
        else if (code === 'KeyC') {
            e.preventDefault();
            let now = performance.now();
            if (now - lastPierce >= PIERCE_CD && !pierceCharge && !pierceProjectile) {
                pierceCharge = true;
                pierceStart = now;
            }
        }
    });
    window.addEventListener('keyup', e => {
        if (victory || gameOver) return;
        let code = e.code;
        if (code === 'KeyF') {
            e.preventDefault();
            if (panelVisible) { panelVisible=false; statusPanel.style.display='none'; }
            return;
        }
        if (code === 'KeyA' || code === 'ArrowLeft') { left = false; e.preventDefault(); }
        else if (code === 'KeyD' || code === 'ArrowRight') { right = false; e.preventDefault(); }
        else if (code === 'Space' || code === 'ArrowUp') { jumpUsed = false; e.preventDefault(); }
        else if (code === 'ShiftLeft' || code === 'ShiftRight') { shiftDown = false; e.preventDefault(); }
        else if (code === 'ArrowDown') { arrowDown = false; e.preventDefault(); }
        else if (code === 'KeyC') {
            if (pierceCharge) pierceCharge = false;
            e.preventDefault();
        }
    });
    function onBlur() {
        left = right = shiftDown = arrowDown = jumpUsed = false;
        charging = false;
        if (panelVisible) { panelVisible=false; statusPanel.style.display='none'; }
        if (shopPanel.style.display === 'flex') shopPanel.style.display = 'none';
        if (confirmModal.style.display === 'flex') confirmModal.style.display = 'none';
    }
    window.addEventListener('blur', onBlur);
    document.addEventListener('visibilitychange', () => { if (document.hidden) onBlur(); });

    nextMapBtn.addEventListener('click', () => {
        let data = { hp: playerHP, gold, level, exp, kills: killCount, normalAttackMult, skillDamageMult };
        let enc = btoa(JSON.stringify(data));
        window.location.href = `prison.html?data=${enc}`;
    });

    function loop(t) {
        update(t);
        draw();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
