// ---------- 贴图替换系统（image 指令） ----------
// 用法：image 物品名(或ID) = 物品名(或ID)
// 效果：把等号前物品的 icon 换成等号后物品的 icon（背包/快捷栏/装备栏/手持/敌人手持同步生效）
// 覆盖记录写入 localStorage，刷新后自动重放；image reset 可全部还原
const IMAGE_OVERRIDE_STORE_KEY = 'whiteSquareImageOverrides';
let imageOverrideMap = {};

function normalizeImageName(s) {
    return String(s || '')
        .replace(/[\uD800-\uDFFF]/g, '')                              // 去掉 emoji（代理对）
        .replace(/[\u2190-\u21FF\u2600-\u27BF\u2B00-\u2BFF\uFE0F]/g, '') // 去掉符号类字符
        .replace(/[\s·・.\-_/\\()（）]/g, '')                            // 去掉空格与分隔符
        .toLowerCase();
}

function collectImageKeys() {
    const keys = [];
    if (typeof ITEMS !== 'undefined' && ITEMS) keys.push(...Object.keys(ITEMS));
    if (typeof WEAPONS !== 'undefined' && WEAPONS) keys.push(...Object.keys(WEAPONS));
    if (typeof PET_DEFS !== 'undefined' && PET_DEFS) keys.push(...Object.keys(PET_DEFS));
    return Array.from(new Set(keys));
}

function getImageEntry(key) {
    if (typeof ITEMS !== 'undefined' && ITEMS && ITEMS[key]) return ITEMS[key];
    if (typeof WEAPONS !== 'undefined' && WEAPONS && WEAPONS[key]) return WEAPONS[key];
    if (typeof PET_DEFS !== 'undefined' && PET_DEFS && PET_DEFS[key]) return PET_DEFS[key];
    return null;
}

function getIconOf(key) {
    const entry = getImageEntry(key);
    return (entry && entry.icon) ? entry.icon : null;
}

function displayNameOf(key) {
    const entry = getImageEntry(key);
    return (entry && entry.name) ? entry.name : key;
}

// 解析用户输入（ID 或名称）→ 物品 key；命中多个时返回 { ambiguous: [...] }
function resolveImageTarget(input) {
    const raw = String(input || '').trim();
    if (!raw) return null;
    const norm = normalizeImageName(raw);
    const keys = collectImageKeys();

    for (const k of keys) {
        if (k.toLowerCase() === raw.toLowerCase()) return k;
    }
    const exact = keys.filter(k => normalizeImageName(displayNameOf(k)) === norm);
    if (exact.length === 1) return exact[0];
    if (norm) {
        const fuzzy = keys.filter(k => normalizeImageName(displayNameOf(k)).indexOf(norm) >= 0);
        if (fuzzy.length === 1) return fuzzy[0];
        if (fuzzy.length > 1) return { ambiguous: fuzzy };
    }
    return null;
}

function setIconOf(key, icon) {
    if (!icon) return;
    if (typeof ITEMS !== 'undefined' && ITEMS && ITEMS[key]) ITEMS[key].icon = icon;
    if (typeof WEAPONS !== 'undefined' && WEAPONS && WEAPONS[key]) WEAPONS[key].icon = icon;
    if (typeof PET_DEFS !== 'undefined' && PET_DEFS && PET_DEFS[key]) PET_DEFS[key].icon = icon;
    const livePets = window.activePets;
    if (Array.isArray(livePets)) {
        for (const pet of livePets) {
            if (pet && pet.type === key) pet.icon = icon;
        }
    }
}

function saveImageOverrides() {
    try {
        window.localStorage.setItem(IMAGE_OVERRIDE_STORE_KEY, JSON.stringify(imageOverrideMap));
    } catch (e) {
        console.warn('[image] 覆盖记录保存失败', e);
    }
}

// 应用覆盖：image A = B
function applyImageOverride(targetInput, sourceInput) {
    const target = resolveImageTarget(targetInput);
    if (!target) { showToast(`未找到物品：${targetInput}`); return false; }
    if (target.ambiguous) {
        showToast(`「${targetInput}」命中多个物品：${target.ambiguous.map(displayNameOf).join(' / ')}\n请改用 ID 指定`);
        return false;
    }
    const source = resolveImageTarget(sourceInput);
    if (!source) { showToast(`未找到物品：${sourceInput}`); return false; }
    if (source.ambiguous) {
        showToast(`「${sourceInput}」命中多个物品：${source.ambiguous.map(displayNameOf).join(' / ')}\n请改用 ID 指定`);
        return false;
    }
    if (target === source) { showToast('前后是同一个物品，贴图未变化'); return false; }

    const srcIcon = getIconOf(source);
    if (!srcIcon) { showToast(`${displayNameOf(source)} 没有可用的贴图`); return false; }

    if (!imageOverrideMap[target]) {
        imageOverrideMap[target] = { icon: srcIcon, orig: getIconOf(target) };
    } else {
        imageOverrideMap[target].icon = srcIcon;
    }
    setIconOf(target, srcIcon);
    saveImageOverrides();
    showToast(`✅ 已将 ${displayNameOf(target)} 的贴图替换为 ${displayNameOf(source)} 的贴图`);
    return true;
}

// 还原本轮或历史所有覆盖
function resetImageOverrides() {
    const keys = Object.keys(imageOverrideMap);
    for (const key of keys) {
        const rec = imageOverrideMap[key];
        if (rec && rec.orig) setIconOf(key, rec.orig);
    }
    imageOverrideMap = {};
    try {
        window.localStorage.removeItem(IMAGE_OVERRIDE_STORE_KEY);
    } catch (e) {
        console.warn('[image] 覆盖记录清除失败', e);
    }
    showToast(keys.length ? `✅ 已还原 ${keys.length} 个物品的贴图` : '当前没有贴图覆盖');
}

// 页面加载后重放存档中的覆盖（等所有物品/武器/宠物定义脚本执行完）
function restoreImageOverrides() {
    let saved = null;
    try {
        saved = JSON.parse(window.localStorage.getItem(IMAGE_OVERRIDE_STORE_KEY) || 'null');
    } catch (e) {
        saved = null;
    }
    if (!saved || typeof saved !== 'object') return;
    imageOverrideMap = saved;
    for (const key of Object.keys(saved)) {
        const rec = saved[key];
        if (rec && rec.icon) setIconOf(key, rec.icon);
    }
}

window.applyImageOverride = applyImageOverride;
window.resetImageOverrides = resetImageOverrides;
window.restoreImageOverrides = restoreImageOverrides;
window.resolveImageTarget = resolveImageTarget;

setTimeout(restoreImageOverrides, 0);

</script>
<script>
/* ================= 公用文件/js/talent.js ================= */
// ---------- 天赋树系统 ----------
const TALENTS = [
    { id: 0, name: '💪 力量强化', description: '攻击力 +10%', maxLevel: 3, costPerLevel: 1, effect: (level) => ({ attackMult: 1 + level * 0.1 }) },
    { id: 1, name: '🏃 疾风步', description: '移动速度 +15%', maxLevel: 2, costPerLevel: 1, effect: (level) => ({ speedMult: 1 + level * 0.15 }) },
    { id: 2, name: '❤️ 生命祝福', description: '最大生命值 +20', maxLevel: 2, costPerLevel: 1, effect: (level) => ({ maxHpBonus: level * 20 }) },
    { id: 3, name: '🪽 三段跳', description: '解锁三段跳', maxLevel: 1, costPerLevel: 2, effect: (level) => ({ tripleJump: true }) }
];

function initTalents(savedTalents, savedPoints) {
    if (savedTalents) learnedTalents = savedTalents;
    else learnedTalents = TALENTS.map(t => ({ id: t.id, level: 0 }));
    if (savedPoints !== undefined) talentPoints = savedPoints;
    applyTalentEffects();
}

function getTalentLevel(id) {
    const t = learnedTalents.find(t => t.id === id);
    return t ? t.level : 0;
}

function learnTalent(id) {
    const talent = TALENTS.find(t => t.id === id);
    if (!talent) return false;
    const current = getTalentLevel(id);
    if (current >= talent.maxLevel) return false;
    const cost = talent.costPerLevel;
    if (talentPoints < cost) return false;
    talentPoints -= cost;
    const idx = learnedTalents.findIndex(t => t.id === id);
    if (idx !== -1) learnedTalents[idx].level++;
    else learnedTalents.push({ id, level: 1 });
    applyTalentEffects();
    return true;
}

function applyTalentEffects() {
    let attackMult = 1, speedMult = 1, maxHpBonus = 0, tripleJump = false;
    for (const t of learnedTalents) {
        const talent = TALENTS.find(tl => tl.id === t.id);
        if (talent && t.level > 0) {
            const eff = talent.effect(t.level);
            if (eff.attackMult) attackMult *= eff.attackMult;
            if (eff.speedMult) speedMult *= eff.speedMult;
            if (eff.maxHpBonus) maxHpBonus += eff.maxHpBonus;
            if (eff.tripleJump) tripleJump = true;
        }
    }
    talentAttackMult = attackMult;
    talentSpeedMult = speedMult;
    talentMaxHpBonus = maxHpBonus;
    talentTripleJump = tripleJump;
    if (typeof updatePlayerMaxHp === 'function') updatePlayerMaxHp();
}

function drawTalentTree() {
    // 深色玻璃拟态背景（与原神风格面板基调统一）
    const g = ctx.createLinearGradient(0, 0, VIEW_W, VIEW_H);
    g.addColorStop(0, 'rgba(16,16,28,0.88)');
    g.addColorStop(1, 'rgba(8,8,16,0.9)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.strokeStyle = 'rgba(255,215,0,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, VIEW_W - 20, VIEW_H - 20);

    ctx.fillStyle = 'rgba(255,215,0,0.08)';
    ctx.fillRect(0, 0, VIEW_W, 60);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 22px "Segoe UI", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🌳 天赋', VIEW_W/2, 28);

    ctx.font = '14px "Segoe UI", monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`可用天赋点: ${talentPoints}`, VIEW_W/2, 50);

    const startX = 24, startY = 80, cellW = 220, cellH = 88, gapX = 16, gapY = 14, cols = 3;

    for (let i = 0; i < TALENTS.length; i++) {
        const t = TALENTS[i];
        const row = Math.floor(i / cols);
        const col = i % cols;
        const x = startX + col * (cellW + gapX);
        const y = startY + row * (cellH + gapY);
        const level = getTalentLevel(t.id);
        const isMaxed = level >= t.maxLevel;
        const canAfford = talentPoints >= t.costPerLevel && !isMaxed;

        ctx.fillStyle = level > 0 ? 'rgba(255,215,0,0.06)' : 'rgba(255,255,255,0.03)';
        ctx.beginPath();
        ctx.roundRect(x, y, cellW, cellH, 12);
        ctx.fill();

        ctx.strokeStyle = level > 0 ? 'rgba(255,215,0,0.2)' : 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(x, y, cellW, cellH, 12);
        ctx.stroke();

        ctx.fillStyle = level > 0 ? '#fff' : 'rgba(255,255,255,0.5)';
        ctx.font = 'bold 14px "Segoe UI", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(t.name, x + 14, y + 26);

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '11px "Segoe UI", monospace';
        let desc = t.description;
        if (ctx.measureText(desc).width > cellW - 40) {
            while (ctx.measureText(desc + '…').width > cellW - 40 && desc.length > 0) {
                desc = desc.slice(0, -1);
            }
            desc += '…';
        }
        ctx.fillText(desc, x + 14, y + 50);

        const statusX = x + cellW - 12;
        if (isMaxed) {
            ctx.fillStyle = '#2ecc71';
            ctx.font = '11px "Segoe UI", monospace';
            ctx.textAlign = 'right';
            ctx.fillText('✓ 满级', statusX, y + 74);
        } else if (canAfford) {
            ctx.fillStyle = '#ffd700';
            ctx.font = '11px "Segoe UI", monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`升级 ${t.costPerLevel}点`, statusX, y + 74);
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '11px "Segoe UI", monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`Lv.${level}/${t.maxLevel}`, statusX, y + 74);
        }

        const dotSize = 6, dotGap = 4;
        const dotStartX = x + 14;
        const dotY = y + cellH - 14;
        for (let d = 0; d < t.maxLevel; d++) {
            ctx.fillStyle = d < level ? '#ffd700' : 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.arc(dotStartX + d * (dotSize + dotGap), dotY, dotSize/2, 0, 2 * Math.PI);
            ctx.fill();
        }

        if (mouseLeftClicked) {
            const mx = mouseScreenX, my = mouseScreenY;
            if (mx > x && mx < x + cellW && my > y && my < y + cellH) {
                if (learnTalent(t.id)) {
                    showInventoryMessage(`学习了 ${t.name}！`);
                } else {
                    showInventoryMessage(isMaxed ? '已满级' : '天赋点不足');
                }
                mouseLeftClicked = false;
            }
        }
    }

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '12px "Segoe UI", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('按 Z 关闭', VIEW_W/2, VIEW_H - 16);
    ctx.textAlign = 'start';
}

// ---------- 成就系统 ----------
const ACHIEVEMENTS = [
    { id: 0, name: '初次杀敌', description: '击败第一个敌人', condition: () => killCount >= 1, reward: 1 },
    { id: 1, name: '百人斩', description: '击败100个敌人', condition: () => killCount >= 100, reward: 1 },
    { id: 2, name: '等级提升', description: '等级达到5级', condition: () => level >= 5, reward: 1 },
    { id: 3, name: '等级大师', description: '等级达到10级', condition: () => level >= 10, reward: 2 },
    { id: 4, name: '财源滚滚', description: '累计获得1000金币', condition: () => totalGoldEarned >= 1000, reward: 1 },
    { id: 5, name: 'BOSS终结者', description: '击败BOSS', condition: () => bossDefeated, reward: 2 }
];

function initAchievements(savedUnlocked, savedTotalGold, savedBossDefeated) {
    if (savedUnlocked) achievementsUnlocked = savedUnlocked;
    else achievementsUnlocked = [];
    if (savedTotalGold !== undefined) totalGoldEarned = savedTotalGold;
    if (savedBossDefeated !== undefined) bossDefeated = savedBossDefeated;
}

function checkAchievements() {
    let newUnlock = false;
    for (const ach of ACHIEVEMENTS) {
        if (!achievementsUnlocked.includes(ach.id) && ach.condition()) {
            achievementsUnlocked.push(ach.id);
            talentPoints += ach.reward;
            newUnlock = true;
            showInventoryMessage(`🏆 成就解锁：${ach.name}！ +${ach.reward} 天赋点`);
        }
    }
    if (newUnlock) {
        applyTalentEffects();
        if (panelVisible) updatePanelUI();
    }
}

function addGoldEarned(amount) {
    totalGoldEarned += amount;
    checkAchievements();
}

function drawAchievements() {
    // 深色玻璃拟态背景（与原神风格面板基调统一）
    const g = ctx.createLinearGradient(0, 0, VIEW_W, VIEW_H);
    g.addColorStop(0, 'rgba(16,16,28,0.88)');
    g.addColorStop(1, 'rgba(8,8,16,0.9)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.strokeStyle = 'rgba(255,215,0,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, VIEW_W - 20, VIEW_H - 20);

    ctx.fillStyle = 'rgba(255,215,0,0.08)';
    ctx.fillRect(0, 0, VIEW_W, 56);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 20px "Segoe UI", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🏅 成就', VIEW_W/2, 28);

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '13px "Segoe UI", monospace';
    ctx.fillText(`已解锁 ${achievementsUnlocked.length}/${ACHIEVEMENTS.length}`, VIEW_W/2, 48);

    const startX = 28, startY = 76, lineH = 40;
    const maxLines = Math.floor((VIEW_H - 120) / lineH);

    for (let i = 0; i < Math.min(ACHIEVEMENTS.length, maxLines); i++) {
        const ach = ACHIEVEMENTS[i];
        const unlocked = achievementsUnlocked.includes(ach.id);
        const y = startY + i * lineH;

        if (unlocked) {
            ctx.fillStyle = 'rgba(46,204,113,0.08)';
            ctx.beginPath();
            ctx.roundRect(startX - 8, y - 6, VIEW_W - startX * 2 + 16, lineH - 2, 6);
            ctx.fill();
        }

        ctx.fillStyle = unlocked ? '#2ecc71' : 'rgba(255,255,255,0.15)';
        ctx.font = '16px monospace';
        ctx.textAlign = 'left';

window.GUEST_MODE = GUEST_MODE;

// ---------- 游戏状态管理（压缩版） ----------

// ========== 压缩辅助常量 ==========
// 短键名映射表（仅用于压缩导出，导入时反向还原）
const KEY_MAP = {
    // 顶层
    map: 'mp', hp: 'hp', gold: 'gd', level: 'lv', exp: 'ex', kills: 'kl',
    x: 'px', y: 'py', normalAttackMult: 'nam', skillDamageMult: 'sdm',

// 反向映射

for (const [long, short] of Object.entries(KEY_MAP)) {

    stun: 0,

// 压缩函数：将标准对象转为压缩对象（短键名 + 省略默认值）
function compressObject(obj, defaults = {}) {
    if (Array.isArray(obj)) {
        return obj.map(item => compressObject(item, defaults));
    }
    if (obj && typeof obj === 'object') {
        const compressed = {};
        for (const [key, value] of Object.entries(obj)) {
            // 忽略 undefined 和 null
            if (value === undefined || value === null) continue;
            // 如果值等于默认值，则跳过（但需要根据上下文判断，此处我们只跳过特定字段）
            // 如果该字段在默认值字典中且相等，则跳过
            if (defaults.hasOwnProperty(key) && value === defaults[key]) continue;
            // 如果是数组或对象，递归压缩
            let processed = value;
            if (typeof value === 'object') {
                processed = compressObject(value, defaults);
                if (processed === undefined || processed === null) continue;
                // 如果压缩后为空对象或空数组，可以跳过，但为了保留结构，我们保留空对象/数组？不过敌人空对象无意义，可跳过
                if (Array.isArray(processed) && processed.length === 0) continue;
                if (!Array.isArray(processed) && Object.keys(processed).length === 0) continue;
            }
            // 数值四舍五入到1位小数（仅对数字）
            if (typeof processed === 'number') {
                processed = Math.round(processed * 10) / 10;
                // 如果处理后的值为 0 且字段默认值为 0，跳过
                if (processed === 0 && (defaults.hasOwnProperty(key) && defaults[key] === 0)) continue;
            }
            // 替换键名
            const shortKey = KEY_MAP[key] || key;
            compressed[shortKey] = processed;
        }
        return compressed;
    }
    return obj;
}

// 解压函数：将压缩对象还原为标准对象（长键名 + 填充默认值）
function decompressObject(obj, defaults = {}) {
    if (Array.isArray(obj)) {
        return obj.map(item => decompressObject(item, defaults));
    }
    if (obj && typeof obj === 'object') {
        const decompressed = {};
        for (const [shortKey, value] of Object.entries(obj)) {
            const longKey = REV_KEY_MAP[shortKey] || shortKey;
            let processed = value;
            if (typeof value === 'object') {
                processed = decompressObject(value, defaults);
                if (processed === undefined || processed === null) continue;
            }
            decompressed[longKey] = processed;
        }
        // 填充默认值
        for (const [key, def] of Object.entries(defaults)) {
            if (!decompressed.hasOwnProperty(key)) {
                decompressed[key] = def;
            }
        }
        return decompressed;
    }
    return obj;
}

// 优化清单第 6 条：读档后敌人状态计时器重基准。
// 问题：slowLastDecay / fireLastDecay / frozenUntil 等字段以 performance.now() 为基准，

// 方案：导入存档后把这些绝对时间戳整体平移，使其中最大值对齐当前 performance.now()，
// 保留存档内的相对先后与剩余时长；不改变任何比较逻辑，也不需要更换全局时钟。
const ENEMY_TIMER_KEYS = [
    'lastAttack', 'suspendStartTime',
    'slowLastDecay', 'frozenUntil',
    'fireLastDamage', 'fireLastDecay',
    'blackholeLastDamage',
    'lightningLastDamage', 'lightningLastDecay',
    'weakLastDecay',
    '_lastLightningUpdate', '_lastLightningDurationUpdate'
];

function rebaseEnemyTimers(list) {
    if (!Array.isArray(list) || list.length === 0) return;
    const now = performance.now();
    let maxTs = 0;
    for (const it of list) {
        if (!it) continue;
        for (const k of ENEMY_TIMER_KEYS) {
            const v = it[k];
            if (typeof v === 'number' && v > maxTs) maxTs = v;
        }
    }
    if (maxTs <= 0) return;
    const delta = now - maxTs;
    // 差值过小说明时间戳本来就是本会话产生的，无需平移
    if (Math.abs(delta) < 1000) return;
    for (const it of list) {
        if (!it) continue;
        for (const k of ENEMY_TIMER_KEYS) {
            const v = it[k];
            if (typeof v === 'number' && v > 1) it[k] = v + delta;
        }
    }
}

function canUserSave() {
    // 修复（优化清单第 1 条）：旧实现读 'ws_current_user' / 'ws_accounts'，而 auth.js 实际写入
    // 'ws_token' / 'ws_users'，两个键都不存在，函数恒返回 true，管理员"禁止存档"完全失效。
    if (window.WS_STORAGE && typeof window.WS_STORAGE.canSave === 'function') {
        return window.WS_STORAGE.canSave();
    }
    // storage-keys.js 未加载时的兜底：直接解码 ws_token 判断 canSave
    try {
        const raw = sessionStorage.getItem(STORAGE_KEYS.TOKEN);
        if (!raw) return true;
        const session = JSON.parse(decodeURIComponent(escape(atob(raw))));
        if (!session || typeof session !== 'object') return true;
        if (session.exp && session.exp < Date.now()) return true;
        return session.canSave !== false;
    } catch (e) {
        return true;
    }
}

// 优化清单第 5 条：存档带显式版本号 + 迁移钩子；导入前统一走 migrateSave，之后再逐字段赋值。
const SAVE_VERSION = 2;
function migrateSave(data) {
    if (!data || typeof data !== 'object') return data;
    let v = Number(data.saveVersion || data.v || 0) || 1;
    if (v < 2) {
        // v1 → v2：只补结构型字段（与原逻辑的空值分支等价），绝不覆写任何已有数值，避免老档被改成"重开"
        if (!Array.isArray(data.enemies)) data.enemies = [];
        if (!Array.isArray(data.inventorySlots)) data.inventorySlots = null;
        if (data.learnedTalents === undefined) data.learnedTalents = {};
        if (data.achievementsUnlocked === undefined) data.achievementsUnlocked = {};
        if (data.characters === undefined) data.characters = {};
        v = 2;
    }
    data.saveVersion = v;
    return data;
}

// ========== 修改 importSaveFromObject 以支持压缩格式 ==========
function importSaveFromObject(saveObj) {
    if (isGuestMode()) return;
    // 检测是否为压缩格式（如果存在短键名如 'mp', 'hp' 等）
    // 我们通过检查是否有 'mp' 键且没有 'map' 键来判断（因为压缩后 map 变为 mp）
    const isCompressed = (saveObj.mp !== undefined && saveObj.map === undefined);

    let data = saveObj;
    if (isCompressed) {
        // 解压整个对象
        data = decompressObject(saveObj, {});
        // 需要手动处理一些嵌套的默认值（因为 decompressObject 只处理一层默认值，但敌人内部的默认值需单独处理）
        // 但我们在解压时没有指定敌人默认值，所以之后在读取敌人时再填充
    }
    // 统一迁移：老档（无版本号）补结构字段后再赋值
    data = migrateSave(data);

    // 正常解析 data
    playerHP = data.hp;
    gold = data.gold;
    level = data.level;
    exp = data.exp;
    killCount = data.kills;
    player.x = data.x;
    player.y = data.y;
    normalAttackMult = data.normalAttackMult || 1.0;
    skillDamageMult = data.skillDamageMult || 1.0;
    hasSave = data.hasSavePoint || false;
    if (hasSave && data.savedData) {
        // 如果 savedData 也是压缩的，解压它
        if (data.savedData.mp !== undefined) {
            savedData = decompressObject(data.savedData, {});
        } else {
            savedData = data.savedData;
        }
    }

    if (data.inventorySlots) {
        inventorySlots = data.inventorySlots.map(slot => slot ? { type: slot.type, count: slot.count } : null);
    } else {
        inventorySlots = new Array(INVENTORY_SIZE).fill(null);
    }

    if (data.talentPoints !== undefined) talentPoints = data.talentPoints;
    if (data.learnedTalents) learnedTalents = data.learnedTalents;
    if (data.achievementsUnlocked) achievementsUnlocked = data.achievementsUnlocked;
    if (data.totalGoldEarned !== undefined) totalGoldEarned = data.totalGoldEarned;
    if (data.bossDefeated !== undefined) bossDefeated = data.bossDefeated;

    // 角色系统恢复
    if (data.currentCharacter !== undefined) window.currentCharacter = data.currentCharacter;
    if (data.characterUnlocked !== undefined) window.characterUnlocked = data.characterUnlocked;
    if (data.basicExp !== undefined) basicExp = data.basicExp;
    if (data.midExp !== undefined) midExp = data.midExp;
    if (data.characters) {
        for (const [id, cd] of Object.entries(data.characters)) {
            if (CHARACTERS[id]) {
                CHARACTERS[id].level = cd.level || 1;
                CHARACTERS[id].exp = cd.exp || 0;
                CHARACTERS[id].potionAtkMult = cd.potionAtkMult || 1.0;

                CHARACTERS[id].savedWeapon = cd.savedWeapon || null;
                CHARACTERS[id].savedEquipSlots = cd.savedEquipSlots || null;
            }
        }
    }

    if (data.hasCross !== undefined) {
        window.hasCross = data.hasCross;
        window.crossProtectionAvailable = data.crossProtectionAvailable !== undefined ? data.crossProtectionAvailable : true;
        window.crossCooldownTimer = data.crossCooldownTimer || 0;
    }
    // 小丑面具
    if (data.hasClownMask !== undefined) {
        window.hasClownMask = data.hasClownMask;
    }

    if (data.ownedPets) window.ownedPets = data.ownedPets;
    if (data.petLevelMap) window.petLevelMap = data.petLevelMap;
    if (data.activePets && typeof addPet === 'function') {

            addPet(p.type);
        }
    }
    if (typeof syncPetLevels === 'function') syncPetLevels();
    if (data.currentWeapon && typeof equipWeapon === 'function') {
        equipWeapon(data.currentWeapon);
    }

    if (typeof initTalents === 'function') initTalents(learnedTalents, talentPoints);
    if (typeof initAchievements === 'function') initAchievements(achievementsUnlocked, totalGoldEarned, bossDefeated);
    if (typeof applyTalentEffects === 'function') applyTalentEffects();
    if (typeof updatePlayerMaxHp === 'function') updatePlayerMaxHp();

    // 导入敌人
    enemies = [];
    if (data.enemies) {
        data.enemies.forEach(eData => {
            // 如果 eData 是压缩的，解压它
            let e = eData;
            if (eData.t === undefined && eData.type === undefined) {
                // 可能是普通对象，无需解压
            } else if (eData.t !== undefined) {
                // 压缩敌人对象，解压
                e = decompressObject(eData, DEFAULTS);
            }
            // 填充默认值
            const enemy = {
                x: e.x, y: e.y, w: ENEMY_W, h: ENEMY_H,
                hp: e.hp !== undefined ? e.hp : 300,
                stun: e.stun || 0,
                type: e.type || 'red',
                lastAttack: e.lastAttack || 0,
                hitFlash: 0,
                summoned: e.summoned || false,
                slowLevel: e.slowLevel || 0,
                slowLastDecay: e.slowLastDecay || performance.now(),
                frozenUntil: e.frozenUntil || 0,
                fireLevel: e.fireLevel || 0,
                fireLastDamage: e.fireLastDamage || performance.now(),
                fireLastDecay: e.fireLastDecay || performance.now(),
                controlledByPet: e.controlledByPet || false,
                suspended: e.suspended || false,
                suspendStartTime: e.suspendStartTime || 0,
                suspendTargetY: e.suspendTargetY || 0,
                suspendOriginalY: e.suspendOriginalY || 0,
                canBeDamaged: e.canBeDamaged !== undefined ? e.canBeDamaged : true,
                hasPermanentSlow: e.hasPermanentSlow || false,
                blackholeLevel: e.blackholeLevel || 0,
                blackholeLastDamage: e.blackholeLastDamage || performance.now(),
                lightningLevel: e.lightningLevel || 0,
                lightningTimer: e.lightningTimer || 0,
                lightningDuration: e.lightningDuration || 0,
                lightningLastDamage: e.lightningLastDamage || performance.now(),
                lightningLastDecay: e.lightningLastDecay || performance.now(),
                weakLevel: e.weakLevel || 0,
                weakLastDecay: e.weakLastDecay || performance.now(),
                _lastLightningUpdate: performance.now(),
                _lastLightningDurationUpdate: performance.now()
            };
            enemy.color = enemy.type === 'red' ? '#ff0000' : BLACK_ENEMY_COLOR;
            enemies.push(enemy);
        });
    }
    rebaseEnemyTimers(enemies);
    if (data.boss) {
        let b = data.boss;
        if (b.cl !== undefined) {
            b = decompressObject(b, {});
        }
        boss = {
            x: b.x, y: b.y, w: BOSS_SIZE, h: BOSS_SIZE,
            hp: b.hp, maxHp: b.maxHp,
            colors: b.colors || Array(16).fill('#ff0000'),
            colorIdx: b.colorIdx || 0,
            nextTime: b.nextTime || 0,
            interval: b.interval || 100,
            speed: b.speed || 0
        };
    } else boss = null;

    player.vy = 0;
    let triple = (typeof talentTripleJump !== 'undefined') ? talentTripleJump : false;
    player.jumpsLeft = triple ? 3 : 2;
    projectiles = [];
    lasers = [];
    lastLaser = 0;
    cameraX = Math.max(0, Math.min(player.x - VIEW_W/2, WORLD_W - VIEW_W));
    updatePanelUI();
}

// ========== 修改 exportSave 以生成压缩存档 ==========
function exportSave() {
    if (isGuestMode()) {
        showToast('游客模式无法存档');
        return;
    }
    if (!canUserSave()) {
        showToast('管理员已禁止你使用存档功能');
        return;
    }
    // 构建标准对象（与之前相同）
    const enemiesData = enemies.map(e => ({
        x: e.x, y: e.y, type: e.type, hp: e.hp, stun: e.stun, lastAttack: e.lastAttack,
        summoned: e.summoned || false,
        slowLevel: e.slowLevel, slowLastDecay: e.slowLastDecay,
        frozenUntil: e.frozenUntil, fireLevel: e.fireLevel,
        fireLastDamage: e.fireLastDamage, fireLastDecay: e.fireLastDecay,
        controlledByPet: e.controlledByPet, suspended: e.suspended,
        suspendStartTime: e.suspendStartTime, suspendTargetY: e.suspendTargetY,
        suspendOriginalY: e.suspendOriginalY, canBeDamaged: e.canBeDamaged,
        hasPermanentSlow: e.hasPermanentSlow,
        blackholeLevel: e.blackholeLevel, blackholeLastDamage: e.blackholeLastDamage,
        lightningLevel: e.lightningLevel, lightningTimer: e.lightningTimer,
        lightningDuration: e.lightningDuration, lightningLastDamage: e.lightningLastDamage,
        lightningLastDecay: e.lightningLastDecay,
        weakLevel: e.weakLevel, weakLastDecay: e.weakLastDecay
    }));
    let bossData = null;
    if (boss) {
        bossData = {
            x: boss.x, y: boss.y, hp: boss.hp, maxHp: boss.maxHp,
            colors: boss.colors, colorIdx: boss.colorIdx, nextTime: boss.nextTime,
            interval: boss.interval, speed: boss.speed
        };
    }
    const saveObj = {
        map: (window.WS_isPrison ? window.WS_isPrison() : window.location.pathname.includes('prison')) ? 'prison' : 'black',
        hp: playerHP, gold, level, exp, kills: killCount,
        x: player.x, y: player.y,
        normalAttackMult, skillDamageMult,
        saveVersion: SAVE_VERSION,
        hasSavePoint: hasSave,
        savedData: hasSave ? savedData : null,
        enemies: enemiesData,
        boss: bossData,
        inventorySlots: inventorySlots.map(slot => slot ? { type: slot.type, count: slot.count } : null),
        talentPoints, learnedTalents, achievementsUnlocked, totalGoldEarned, bossDefeated,
        hasCross: window.hasCross || false,
        crossProtectionAvailable: window.crossProtectionAvailable !== undefined ? window.crossProtectionAvailable : true,
        crossCooldownTimer: window.crossCooldownTimer || 0,
        hasClownMask: window.hasClownMask || false,
        ownedPets: window.ownedPets,
        petLevelMap: window.petLevelMap || {},
        activePets: activePets ? activePets.map(p => ({ type: p.type })) : [],
        currentWeapon: currentWeapon ? currentWeapon.id : null,
        currentCharacter: window.currentCharacter || 'ava',
        characterUnlocked: window.characterUnlocked || false,
        basicExp: basicExp,
        midExp: midExp,
        characters: Object.fromEntries(Object.entries(CHARACTERS).map(([id, c]) => [id, { level: c.level, exp: c.exp, potionAtkMult: c.potionAtkMult, potionSkillMult: c.potionSkillMult, savedWeapon: c.savedWeapon, savedEquipSlots: c.savedEquipSlots }]))
    };

    // ========== 压缩对象 ==========
    // 首先压缩顶层，然后压缩 savedData（如果存在）
    let compressed = compressObject(saveObj, {});
    // 如果 savedData 存在，单独压缩 savedData（因为它的默认值不同）
    if (compressed.sd) {
        compressed.sd = compressObject(saveObj.savedData, {});
    }
    // 压缩敌人（每个敌人默认值不同，但我们已在 compressObject 中处理了 DEFAULTS，但需要在调用时传入 DEFAULTS）
    // 重新压缩敌人（因为 compressObject 内未传入 DEFAULTS）
    // 我们可以重新实现，但为了简便，我们在压缩前对 enemies 应用默认值去除，但这里直接用 compressObject 处理每个敌人时传入 DEFAULTS
    // 但 compressObject 目前不支持按每个元素传入默认值，我们可以在外部处理：
    if (compressed.en) {
        compressed.en = compressed.en.map(en => {
            // 使用 DEFAULTS 作为默认值字典
            return compressObject(en, DEFAULTS);
        });
    }

    // 生成 JSON 字符串
    const jsonStr = JSON.stringify(compressed, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (window.WS_isPrison ? window.WS_isPrison() : window.location.pathname.includes('prison')) ? 'prison_save.json' : 'black_room_save.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    saveMsgDiv.style.display = 'block';
    setTimeout(() => saveMsgDiv.style.display = 'none', 1500);
}

function importSave(file) {
    if (isGuestMode()) {
        showToast('游客模式无法读档');
        return;
    }
    if (!canUserSave()) {
        showToast('管理员已禁止你使用存档功能');
        return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const saveObj = JSON.parse(e.target.result);
            importSaveFromObject(saveObj);
            loadMsgDiv.style.display = 'block';
            setTimeout(() => loadMsgDiv.style.display = 'none', 2000);
        } catch (err) {
            showToast('存档损坏');
        }
    };
    reader.readAsText(file);
}

function triggerLoad() {
    if (isGuestMode()) {
        showToast('游客模式无法读档');
        return;
    }
    if (!canUserSave()) {
        showToast('管理员已禁止你使用存档功能');
        return;
    }
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
        if (e.target.files[0]) importSave(e.target.files[0]);
    };
    input.click();
}

// ========== 修改 initFromURL 以支持 load=pending ==========
function initFromURL() {
    if (isGuestMode()) { updatePanelUI(); return; }
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');
    const loadParam = urlParams.get('load');

    if (dataParam) {
        try {
            const decoded = JSON.parse(atob(dataParam));
            // 假设 dataParam 是旧格式（未压缩），直接使用
            importSaveFromObject(decoded);
        } catch(e) {}
    }

    // 处理 load=pending（从 localStorage 读取）
    if (loadParam === 'pending') {
        const pendingData = localStorage.getItem(STORAGE_KEYS.PENDING_SAVE);
        if (pendingData) {
            try {
                const saveObj = JSON.parse(pendingData);
                importSaveFromObject(saveObj);
                localStorage.removeItem(STORAGE_KEYS.PENDING_SAVE);
                loadMsgDiv.style.display = 'block';
                setTimeout(() => loadMsgDiv.style.display = 'none', 2000);
                console.log('[地图] 已从 localStorage 加载存档');
            } catch(e) {
                console.warn('[地图] 从 localStorage 恢复存档失败', e);
            }
        } else {
            console.warn('[地图] 未找到待加载的存档数据');
        }
    }

    // 处理 load=black（从黑屋转到监狱）
    if (loadParam === 'black') {
        const saved = localStorage.getItem(STORAGE_KEYS.SAVE);
        if (saved) {
            try {
                const saveObj = JSON.parse(saved);
                importSaveFromObject(saveObj);
                if ((window.WS_isPrison ? window.WS_isPrison() : window.location.pathname.includes('prison'))) {
                    player.x = 50;
                    player.y = getGroundY();
                    cameraX = 0;
                    updateCam();
                }
                loadMsgDiv.style.display = 'block';
                setTimeout(() => loadMsgDiv.style.display = 'none', 2000);
                console.log('[地图] 已从黑屋存档恢复数据');
            } catch(e) {
                console.warn('[地图] 从黑屋恢复存档失败', e);
            }
        } else {
            console.warn('[地图] 未找到黑屋存档数据');
        }
    }

    // 兼容旧版 Base64 解码
    if (loadParam && loadParam !== 'pending' && loadParam !== 'black') {
        try {
            const jsonStr = decodeURIComponent(escape(window.atob(loadParam)));
            const saveObj = JSON.parse(jsonStr);
            importSaveFromObject(saveObj);
            loadMsgDiv.style.display = 'block';
            setTimeout(() => loadMsgDiv.style.display = 'none', 2000);
        } catch(e) {}
    }

    updatePanelUI();
}

        ownedPets: window.ownedPets,
        petLevelMap: window.petLevelMap || {},
        activePets: activePets ? activePets.map(p => ({ type: p.type })) : [],

// 优化清单第 21 条：innerHTML 插值统一转义，避免外部字符串（名称/路径）破坏结构
function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

                // 跟随玩家

                let targetX = player.x + player.w/2 - 16 + offsetX;
                let targetY = player.y + player.h/2 - 16;
                pet.moveTargetX = Math.min(Math.max(0, targetX), WORLD_W - 32);
                pet.moveTargetY = Math.min(Math.max(20, targetY), WORLD_H - 32);
                pet.isMoving = true;
                pet.currentSpeed = pet.moveSpeed;
                
                if (pet.attackCooldown <= 0) {
                    // 索敌
                    let closest = null;
                    let minDist = Infinity;
                    const pcx = player.x + player.w/2;
                    const pcy = player.y + player.h/2;
                    for (let e of enemies) {
                        if (e.hp <= 0) continue;
                        let dx = (e.x + e.w/2) - pcx;
                        if (Math.abs(dx) > 300) continue;
                        let dy = (e.y + e.h/2) - pcy;
                        if (Math.abs(dy) > 300) continue;
                        let dist = Math.hypot(dx, dy);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = e;
                        }
                    }
                    if (closest) {
                        pet.eTargetEnemy = closest;
                        pet.eState = 'movingToEnemy';
                        // 目标位置：敌人前方（靠近玩家的一侧）
                        let targetX = closest.x;
                        let dirX = (closest.x + closest.w/2) - (player.x + player.w/2);
                        if (dirX > 0) targetX = closest.x - 20;
                        else targetX = closest.x + closest.w + 20;
                        pet.moveTargetX = Math.min(Math.max(0, targetX), WORLD_W - 32);
                        pet.moveTargetY = Math.min(Math.max(20, closest.y), WORLD_H - 32);
                        pet.isMoving = true;
                        pet.currentSpeed = pet.moveSpeed;
                    }
                }
            } 
            else if (pet.eState === 'movingToEnemy') {
                // 检查是否到达目标
                if (!pet.isMoving && Math.hypot(pet.x - pet.moveTargetX, pet.y - pet.moveTargetY) < 5) {
                    pet.eState = 'waitingSlash';
                    pet.eSlashStartTime = now;
                    pet.isMoving = false;
                }
            } 
            else if (pet.eState === 'waitingSlash') {
                if (now - pet.eSlashStartTime >= 500) {
                    if (pet.eTargetEnemy && pet.eTargetEnemy.hp > 0) {
                        let damage = 20 + (level - 1) * 2;
                        Dot.deal(pet.eTargetEnemy, damage);
                        pet.eTargetEnemy.hitFlash = 5;
                        if (typeof damageNumbers !== 'undefined') {
                            damageNumbers.push({
                                x: pet.eTargetEnemy.x + pet.eTargetEnemy.w/2,
                                y: pet.eTargetEnemy.y - 15,
                                damage: damage,
                                timer: 60
                            });
                        }
                    }
                    pet.eState = 'movingBack';
                    pet.isMoving = true;
                    pet.currentSpeed = pet.eReturnSpeed;
                }
            } 
            else if (pet.eState === 'movingBack') {
                // 动态更新目标点为玩家前方
                let offsetX = player.facing === 1 ? 50 : -50;
                let targetX = player.x + player.w/2 - 16 + offsetX;
                let targetY = player.y + player.h/2 - 16;
                pet.moveTargetX = Math.min(Math.max(0, targetX), WORLD_W - 32);
                pet.moveTargetY = Math.min(Math.max(20, targetY), WORLD_H - 32);
                pet.isMoving = true;
                if (Math.hypot(pet.x - pet.moveTargetX, pet.y - pet.moveTargetY) < 5) {
                    pet.eState = 'idle';
                    pet.eTargetEnemy = null;
                    pet.attackCooldown = 180; // 3秒冷却
                    pet.isMoving = false;
                }
            }

            // 统一移动逻辑
            if (pet.isMoving) {
                let speed = pet.currentSpeed !== undefined ? pet.currentSpeed : pet.moveSpeed;
                let dx = pet.moveTargetX - pet.x;
                let dy = pet.moveTargetY - pet.y;
                let dist = Math.hypot(dx, dy);
                if (dist < speed) {
                    pet.x = pet.moveTargetX;
                    pet.y = pet.moveTargetY;
                    pet.isMoving = false;
                } else {
                    let stepX = (dx / dist) * speed;
                    let stepY = (dy / dist) * speed;
                    pet.x += stepX;
                    pet.y += stepY;
                }
                pet.x = Math.min(Math.max(0, pet.x), WORLD_W - 32);
                pet.y = Math.min(Math.max(20, pet.y), WORLD_H - 32);
            }
        },
        draw: (pet) => {
            let img = getCachedImage(pet.icon);
            let px = pet.x - cameraX;
            let py = pet.y;
            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, px, py, 32, 32);
            } else {
                ctx.fillStyle = '#ffaa66';
                ctx.fillRect(px, py, 32, 32);
                ctx.fillStyle = '#fff';
                ctx.font = '12px monospace';
                ctx.fillText('小e', px + 4, py + 20);
            }
            if (pet.eState === 'waitingSlash' && pet.eTargetEnemy) {
                let slashImg = getCachedImage('../公用文件/图片/宠物/其他/斩.png');
                let ex = pet.eTargetEnemy.x - cameraX;
                let ey = pet.eTargetEnemy.y;
                if (slashImg.complete && slashImg.naturalWidth > 0) {
                    ctx.drawImage(slashImg, ex, ey, pet.eTargetEnemy.w, pet.eTargetEnemy.h);
                } else {
                    ctx.fillStyle = 'rgba(255,0,0,0.5)';
                    ctx.fillRect(ex, ey, pet.eTargetEnemy.w, pet.eTargetEnemy.h);
                }
            }
        }
    }
};

// ---------- 宠物升级系统 ----------
function getPetLevel(petId) {
    return (window.petLevelMap && window.petLevelMap[petId]) || 1;
}
function getPetUpgradeCost(petId) {
    const lv = getPetLevel(petId);
    return Math.min(lv, window.MAX_PET_LEVEL);
}
function countItemTotal(type) {
    let total = 0;
    if (typeof inventorySlots !== 'undefined') {
        for (let i = 0; i < inventorySlots.length; i++) {
            const s = inventorySlots[i];
            if (s && s.type === type) total += s.count;
        }
    }
    if (typeof hotbarSlots !== 'undefined') {
        for (let i = 0; i < hotbarSlots.length; i++) {
            const s = hotbarSlots[i];
            if (s && s.type === type) total += s.count;
        }
    }
    return total;
}
function consumeItemTotal(type, amount) {
    let need = amount;
    if (typeof inventorySlots !== 'undefined') {
        for (let i = 0; i < inventorySlots.length && need > 0; i++) {
            const s = inventorySlots[i];
            if (s && s.type === type) {
                const take = Math.min(s.count, need);
                s.count -= take;
                need -= take;
                if (s.count <= 0) inventorySlots[i] = null;
            }
        }
    }
    if (typeof hotbarSlots !== 'undefined') {
        for (let i = 0; i < hotbarSlots.length && need > 0; i++) {
            const s = hotbarSlots[i];
            if (s && s.type === type) {
                const take = Math.min(s.count, need);
                s.count -= take;
                need -= take;
                if (s.count <= 0) hotbarSlots[i] = null;
            }
        }
    }
    return need <= 0;
}
function syncPetLevels() {
    for (const pet of activePets) {
        const lv = getPetLevel(pet.type);
        pet.level = lv;
        pet.levelBonus = lv - 1;
        pet.blackholeDurationBonus = Math.min(2000, Math.floor((lv - 1) / 5) * 500);
        pet.bounceBonus = Math.min(0.04, Math.floor((lv - 1) / 5) * 0.01);
    }
}
function upgradePet(petId) {
    if (!PET_DEFS[petId]) return false;
    if (!window.PET_UPGRADE_MAP || !window.PET_UPGRADE_MAP[petId]) {
        window.showInventoryMessage(`${PET_DEFS[petId].name} 暂无升级材料`);
        return false;
    }
    const lv = getPetLevel(petId);
    if (lv >= window.MAX_PET_LEVEL) {
        window.showInventoryMessage(`${PET_DEFS[petId].name} 已满级`);
        return false;
    }
    const matType = window.PET_UPGRADE_MAP[petId];
    const need = lv;
    if (countItemTotal(matType) < need) {
        const matName = (window.ITEMS && window.ITEMS[matType]) ? window.ITEMS[matType].name : matType;
        window.showInventoryMessage(`材料不足：升级需要 ${need} 个${matName}`);
        return false;
    }
    consumeItemTotal(matType, need);
    window.petLevelMap[petId] = lv + 1;
    syncPetLevels();
    window.showInventoryMessage(`${PET_DEFS[petId].name} 升级到 Lv.${lv + 1}！`);
    if (typeof refreshPetPanel === 'function') refreshPetPanel();
    return true;
}
window.getPetLevel = getPetLevel;
window.getPetUpgradeCost = getPetUpgradeCost;
window.upgradePet = upgradePet;
window.syncPetLevels = syncPetLevels;

// ---------- 通用宠物管理函数 ----------
function addPet(petType) {
    if (!PET_DEFS[petType]) return false;
    if (!window.ownedPets.includes(petType)) window.ownedPets.push(petType);
    if (activePets.some(p => p.type === petType)) {
        showInventoryMessage(`已有 ${PET_DEFS[petType].name} 在场`);
        return false;
    }
    let pet = new Pet(petType, PET_DEFS[petType]);
    if (petType === 'monkey') {
        pet.x = player.x + player.w/2 - 16;
        pet.y = player.y - 20;
    } else if (petType === 'point618') {
        pet.x = player.x + player.w/2 - 16;
        pet.y = player.y - 60;
    } else if (petType === 'horror') {
        pet.x = player.x + player.w/2 - 16 - 50;
        pet.y = player.y - 40;
    } else if (petType === 'xiaoe') {
        let offsetX = player.facing === 1 ? 50 : -50;
        pet.x = player.x + player.w/2 - 16 + offsetX;
        pet.y = player.y + player.h/2 - 16;
    } else {
        pet.x = player.x + player.w/2 - 16;
        pet.y = player.y - 40;
    }
    activePets.push(pet);
    showInventoryMessage(`召唤 ${pet.name}`);
    return true;
}

function removePet(petType) {
    let idx = activePets.findIndex(p => p.type === petType);
    if (idx !== -1) {
        let pet = activePets[idx];
        if (pet.resetSkillFunc) pet.resetSkillFunc(pet);
        activePets.splice(idx, 1);
        showInventoryMessage(`收回 ${PET_DEFS[petType].name}`);
        return true;
    }
    return false;
}

function updateAllPets(now) {
    for (let pet of activePets) {
        let def = PET_DEFS[pet.type];
        if (def.update) def.update(pet, now);
        if (pet.type === 'monkey' && pet.skillActive && pet.updateSkillMonkey) {
            pet.updateSkillMonkey(pet, now);
        } else if (pet.type === 'point618' && def.updateSkill) {
            def.updateSkill(pet, now);
        } else if (pet.skillActive && def.updateSkill) {
            def.updateSkill(pet, now);
        }
        if (pet.type === 'monkey' && pet.updateBlackholes) {
            pet.updateBlackholes(pet, now);
        }
    }
}

function drawAllPets() {
    for (let pet of activePets) {
        let def = PET_DEFS[pet.type];
        if (def.draw) def.draw(pet);
    }
}

function onPetKill(petType, enemyX, enemyY, enemyMaxHp) {
    if (petType === 'monkey') {
        let pet = activePets.find(p => p.type === 'monkey');
        if (pet && pet.onKill) pet.onKill(pet, enemyX, enemyY, enemyMaxHp);
    }
}

window.addPet = addPet;
window.removePet = removePet;
window.updateAllPets = updateAllPets;
window.drawAllPets = drawAllPets;
window.updatePet = updateAllPets;
window.drawPet = drawAllPets;
window.onPetKill = onPetKill;
if (!window.ownedPets) window.ownedPets = [];

<script>
/* ================= 公用文件/js/console-hijack.js ================= */
// ---------- 控制台与游戏系统的集成 ----------
(function() {
    // 优化清单第 20 条：作弊控制台加显式开关，避免任何访客都能用 R·WS·C 改数值。
    // 默认开启（不改变现有体验）；?console=0 或 localStorage['ws_console_enabled']='0' 可关闭。
    var CONSOLE_FLAG_KEY = 'ws_console_enabled';
    function isConsoleEnabled() {
        var m = /[?&]console=(0|1)/i.exec(window.location.search);
        if (m) return m[1] === '1';
        try {
            if (localStorage.getItem(CONSOLE_FLAG_KEY) === '0') return false;
        } catch (e) {}
        return true;
    }
    if (!isConsoleEnabled()) {
        console.info('[console-hijack] 作弊控制台已关闭，?console=1 可临时启用');
        return;
    }

    // 拦截键盘事件（捕获阶段）：控制台打开时阻止所有非编辑器专用按键
    document.addEventListener('keydown', function(e) {
        if (window.codeEditorOpen) {
            const targetTag = e.target.tagName;
            const targetId = e.target.id;
            // 如果焦点在编辑器textarea内，则不拦截（让编辑器处理自己的快捷键）
            if (targetTag === 'TEXTAREA' && targetId === 'codeEditorTextarea') {
                return;
            }
            // 其他所有按键都阻止，包括游戏快捷键和浏览器默认行为
            e.preventDefault();
            e.stopPropagation();
        }
    }, true);

    // 鼠标事件拦截
    canvas.addEventListener('mousedown', function(e) {
        if (window.codeEditorOpen) { e.preventDefault(); e.stopPropagation(); return false; }
    }, true);
    canvas.addEventListener('mouseup', function(e) {
        if (window.codeEditorOpen) { e.preventDefault(); e.stopPropagation(); return false; }
    }, true);
    canvas.addEventListener('mousemove', function(e) {
        if (window.codeEditorOpen) { e.preventDefault(); e.stopPropagation(); return false; }
    }, true);
    window.addEventListener('contextmenu', function(e) {
        if (window.codeEditorOpen) e.preventDefault();
    });

    // 修改 executeCommand 使 "R·WS·C" 打开编辑器
    window.addEventListener('load', function() {
        if (typeof window.executeCommand === 'function') {
            const originalExecute = window.executeCommand;
            window.executeCommand = function(cmd) {
                if (cmd === 'R·WS·C') {
                    if (window.openCodeEditor) window.openCodeEditor();
                    return;
                }
                originalExecute(cmd);
            };
        }
    });
})();

</script>
