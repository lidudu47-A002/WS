            let existing = inventorySlots.some(slot => slot && slot.type === item.id);
            if (existing) {
                let compensation = (item.id === 'firewand') ? 200 : 100;
                gold += compensation;
                showInventoryMessage(`重复 ${item.name}，补偿 ${compensation} 金币`);
                addGachaResultMessage(`重复 ${item.name} → +${compensation}金币`);
            } else {
                addItem(item.id, 1);
                showInventoryMessage(`获得 ${item.name}！`);
                addGachaResultMessage(`获得 ${item.name}！`);
            }
        } else {
            addItem(item.id, 1);
            showInventoryMessage(`获得 ${item.name} x1`);
            addGachaResultMessage(`获得 ${item.name} x1`);
        }
    }
}

function singleGacha(poolType) {
    const cost = 30;
    if (gold < cost) {
        showInventoryMessage('金币不足，需要30金币');
        return false;
    }
    gold -= cost;
    let item = (poolType === 'pet') ? getRandomPetItem() : getRandomWeaponItem();
    processGachaResult(item, poolType);
    if (panelVisible) updatePanelUI();
    updateGachaUI();
    return true;
}

function tenGacha(poolType) {
    const cost = 270;
    if (gold < cost) {
        showInventoryMessage('金币不足，需要270金币');
        return false;
    }
    gold -= cost;
    for (let i = 0; i < 10; i++) {
        let item = (poolType === 'pet') ? getRandomPetItem() : getRandomWeaponItem();
        processGachaResult(item, poolType);
    }
    if (panelVisible) updatePanelUI();
    updateGachaUI();
    return true;
}

function addGachaResultMessage(msg) {
    gachaResultMessages.push(msg);
    if (gachaResultMessages.length > 10) gachaResultMessages.shift();
    updateGachaUI();
}

function clearGachaMessages() {
    gachaResultMessages = [];
    updateGachaUI();
}

function createGachaPanel() {
    if (gachaPanelDiv) return;
    gachaPanelDiv = document.createElement('div');
    gachaPanelDiv.id = 'gachaPanel';
    gachaPanelDiv.style.cssText = `
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 520px; background: rgba(18,18,28,0.95); border: 2px solid gold;
        border-radius: 24px; z-index: 10001; display: none; flex-direction: column;
        backdrop-filter: blur(18px); box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        color: white; font-family: monospace; padding: 20px;
    `;
    gachaPanelDiv.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="margin:0; color: gold;">🎰 抽卡</h3>
            <div id="closeGachaBtn" style="cursor:pointer; font-size:24px;">✖</div>
        </div>
        <div style="display: flex; gap: 12px; margin-bottom: 16px;">
            <button id="petTabBtn" class="gacha-tab active" style="flex:1; padding:8px; border:none; border-radius:12px; background:gold; color:#0a0a12; font-weight:bold; cursor:pointer;">🐾 宠物</button>
            <button id="weaponTabBtn" class="gacha-tab" style="flex:1; padding:8px; border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:#aaa; cursor:pointer;">⚔️ 武器</button>
        </div>
        <div style="margin-bottom: 12px;">
            <span>💰 金币: </span><span id="gachaGoldAmount">0</span>
        </div>
        <div style="display: flex; gap: 16px; justify-content: center; margin-bottom: 20px;">
            <button id="singleGachaBtn" style="padding:10px 24px; background:#2a6d4c; border:none; border-radius:20px; color:white; cursor:pointer;">单抽 (30)</button>
            <button id="tenGachaBtn" style="padding:10px 24px; background:#2a6d4c; border:none; border-radius:20px; color:white; cursor:pointer;">十连抽 (270)</button>
        </div>
        <div style="background:rgba(0,0,0,0.4); border-radius:12px; padding:12px; height:200px; overflow-y: auto;">
            <div id="gachaResultArea" style="font-size:14px;"></div>
        </div>
        <div style="text-align:center; margin-top:12px; font-size:12px; color:#aaa;">点击上方标签切换卡池 · 按 R 关闭</div>
    `;
    document.body.appendChild(gachaPanelDiv);

    document.getElementById('closeGachaBtn').onclick = closeGachaPanel;
    document.getElementById('singleGachaBtn').onclick = () => singleGacha(gachaCurrentTab);
    document.getElementById('tenGachaBtn').onclick = () => tenGacha(gachaCurrentTab);
    document.getElementById('petTabBtn').onclick = () => switchTab('pet');
    document.getElementById('weaponTabBtn').onclick = () => switchTab('weapon');
}

function switchTab(tab) {
    gachaCurrentTab = tab;
    document.querySelectorAll('.gacha-tab').forEach(btn => btn.classList.remove('active'));
    if (tab === 'pet') {
        document.getElementById('petTabBtn').classList.add('active');
        document.getElementById('petTabBtn').style.background = 'gold';
        document.getElementById('petTabBtn').style.color = '#0a0a12';
        document.getElementById('weaponTabBtn').style.background = 'rgba(255,255,255,0.1)';
        document.getElementById('weaponTabBtn').style.color = '#aaa';
    } else {
        document.getElementById('weaponTabBtn').classList.add('active');
        document.getElementById('weaponTabBtn').style.background = 'gold';
        document.getElementById('weaponTabBtn').style.color = '#0a0a12';
        document.getElementById('petTabBtn').style.background = 'rgba(255,255,255,0.1)';
        document.getElementById('petTabBtn').style.color = '#aaa';
    }
    clearGachaMessages();
    updateGachaUI();
}

function updateGachaUI() {
    if (!gachaPanelDiv) return;
    document.getElementById('gachaGoldAmount').innerText = gold;
    const area = document.getElementById('gachaResultArea');
    if (area) {
        area.innerHTML = gachaResultMessages.map(msg => `<p style="margin:4px 0;">${escapeHtml(msg)}</p>`).join('');
        area.scrollTop = area.scrollHeight;
    }
}

function openGachaPanel() {
    if (!gachaPanelDiv) createGachaPanel();
    if (!gachaCurrentTab) gachaCurrentTab = 'pet';
    switchTab(gachaCurrentTab);
    updateGachaUI();
    gachaPanelDiv.style.display = 'flex';
    gachaPanelOpen = true;
    window.gachaPanelOpen = true;
}

function closeGachaPanel() {
    if (gachaPanelDiv) gachaPanelDiv.style.display = 'none';
    gachaPanelOpen = false;
    window.gachaPanelOpen = false;
    canvas.focus();
}

function initGachaPanel() {
    createGachaPanel();
    document.addEventListener('click', (e) => {
        if (gachaPanelOpen && gachaPanelDiv && !gachaPanelDiv.contains(e.target)) {
            closeGachaPanel();
        }
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGachaPanel);
} else {
    initGachaPanel();
}

window.openGachaPanel = openGachaPanel;
window.closeGachaPanel = closeGachaPanel;
window.gachaPanelOpen = gachaPanelOpen;
</script>
<script>
/* ================= 公用文件/js/command-system.js ================= */
// ---------- 指令系统 ----------
(function() {
    'use strict';

    let commandInputActive = false;
    let commandOverlay = null;
    let commandInput = null;
    let tabCycleIndex = 0;
    let lastTabInput = '';

    const COMMANDS = ['st summon', 'bm', 'tune LV =', 'summon', 'kill', 'give', 'image', 'help'];
    const CREATURE_TYPES = ['block', 'black'];
    const ITEM_NAMES = [
        'hp', 'normalAtk', 'skill',
        'sword', 'fb', 'fs', 'sd', 'th', 'cb', 'bh', 'ts',
        'frostBlade', 'firewand', 'compoundBow', 'blackholeStaff', 'techSpear',
        'priestRobes', 'pr', 'cross', 'cm', 'clownMask',
        'iceWings', 'ic', 'iw', 'techShield', 'tshield', 'shield',
        'geometry', 'banana', 'eyeball',
        'monkey', '0.618', 'horror', 'en'
    ];
    const WEAPON_NAMES = [
        'sword', 'fb', 'fs', 'sd', 'th', 'cb', 'bh', 'ts',
        'frostBlade', 'firewand', 'compoundBow', 'blackholeStaff', 'techSpear'
    ];

    function getSuggestions(input) {
        const trimmed = input.trim();
        if (!trimmed) return [];

        if (/^image\s+/i.test(trimmed)) {
            const after = trimmed.replace(/^image\s+/i, '');
const names = Object.keys(ITEMS);
            const eqIdx = after.indexOf('=');
            if (eqIdx >= 0) {
                const head = 'image ' + after.slice(0, eqIdx + 1).replace(/\s+$/, '') + ' ';
                const tail = after.slice(eqIdx + 1).trim();
                return names.filter(n => n.startsWith(tail)).map(n => head + n);
            }
            const cur = after.trim();
            const out = names.filter(n => n.startsWith(cur)).map(n => 'image ' + n);
            if ('reset'.startsWith(cur)) out.unshift('image reset');
            return out;
        }

        if (/^give\s+/i.test(trimmed)) {
            const after = trimmed.replace(/^give\s+/i, '');
            return ITEM_NAMES.filter(n => n.startsWith(after)).map(n => 'give ' + n);
        }

        if (/^summon\s+/i.test(trimmed)) {
            const after = trimmed.replace(/^summon\s+/i, '');
            if (after.includes('~~~')) {
                const idx = after.indexOf('~~~');
                const head = after.slice(0, idx + 3);
                const lastPart = after.slice(idx + 3).trim();
                return WEAPON_NAMES.filter(n => n.startsWith(lastPart)).map(n => head + ' ' + n);
            }
            const parts = after.split(/\s+/);
            const numPrefix = (/^\d+$/.test(parts[0])) ? ('summon ' + parts[0] + ' ') : 'summon ';
            if (/^\d+$/.test(parts[0]) && parts.length >= 2) {
                return CREATURE_TYPES.filter(t => t.startsWith(parts[1] || '')).map(t => numPrefix + t);
            }
            if (/^\d+$/.test(parts[0]) && parts.length === 1) return CREATURE_TYPES.map(t => numPrefix + t);
            if (/^\d/.test(parts[0])) return [];
            return CREATURE_TYPES.map(t => numPrefix + t);
        }

        return COMMANDS.filter(c => c.startsWith(trimmed));
    }

    // 液体滚动：滚轮/触摸惯性 + 弹性回弹（适用于建议列表）
    function attachLiquidScroll(el) {
        if (!el || el._liquidScrollAttached) return;
        el._liquidScrollAttached = true;
        let velocity = 0;
        let rafId = null;
        const maxScroll = () => Math.max(0, el.scrollHeight - el.clientHeight);

        function step() {
            if (Math.abs(velocity) < 0.05) { velocity = 0; rafId = null; return; }
            const max = maxScroll();
            if (el.scrollTop < 0) {
                el.scrollTop = 0;
                velocity *= -0.35;
            } else if (el.scrollTop > max) {
                el.scrollTop = max;
                velocity *= -0.35;
            } else {
                velocity *= 0.9;
            }
            el.scrollTop += velocity;
            rafId = requestAnimationFrame(step);
        }
        function kick(v) {
            velocity = Math.max(-140, Math.min(140, velocity + v));
            if (!rafId) rafId = requestAnimationFrame(step);
        }

        el.addEventListener('wheel', (e) => {
            e.preventDefault();
            kick(e.deltaY * 0.6);
        }, { passive: false });

        let touchLastY = 0;
        let touchV = 0;
        el.addEventListener('touchstart', (e) => {
            velocity = 0;
            touchLastY = e.touches[0].clientY;
            touchV = 0;
        }, { passive: true });
        el.addEventListener('touchmove', (e) => {
            const y = e.touches[0].clientY;
            const dy = y - touchLastY;
            touchLastY = y;
            touchV = -dy;
            el.scrollTop -= dy;
        }, { passive: true });
        el.addEventListener('touchend', () => {
            if (Math.abs(touchV) > 1.5) kick(touchV * 5);
        }, { passive: true });
    }

    function createCommandUI() {
        if (commandOverlay) return;
        tabCycleIndex = 0;
        lastTabInput = '';

        commandOverlay = document.createElement('div');
        commandOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center, rgba(14,14,22,0.82) 0%, rgba(6,6,10,0.92) 100%);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:center;animation:cmdFadeIn 0.18s ease-out;';

        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'width:80%;max-width:620px;background:linear-gradient(160deg, rgba(24,24,36,0.94) 0%, rgba(16,16,26,0.92) 100%);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid rgba(255,215,0,0.35);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,0.7), 0 0 40px rgba(255,215,0,0.08);padding:22px 26px 18px 26px;position:relative;';

        // 标题
        const title = document.createElement('div');
        title.textContent = '指令台';
        title.style.cssText = 'color:#ffd966;font:bold 18px monospace;letter-spacing:4px;text-align:center;margin-bottom:14px;text-shadow:0 0 18px rgba(255,215,0,0.35);';

        const inputRow = document.createElement('div');
        inputRow.style.cssText = 'display:flex;align-items:center;background:rgba(0,0,0,0.45);border:1px solid rgba(255,215,0,0.28);border-radius:12px;padding:2px 6px;transition:border-color 0.2s, box-shadow 0.2s;';

        const prefix = document.createElement('span');
        prefix.textContent = '/';
        prefix.style.cssText = 'color:#ffd966;font-size:20px;font-family:monospace;padding:0 6px;';

        commandInput = document.createElement('input');
        commandInput.type = 'text';
        commandInput.style.cssText = 'flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:19px;font-family:monospace;padding:10px 8px;caret-color:#ffd966;';
        commandInput.placeholder = '输入指令，Tab 补全 · Enter 执行 · Esc 关闭';
        commandInput.autofocus = true;
        commandInput.spellcheck = false;

        inputRow.appendChild(prefix);
        inputRow.appendChild(commandInput);
        wrapper.appendChild(title);
        wrapper.appendChild(inputRow);

        const suggestBox = document.createElement('div');
        suggestBox.id = 'suggestBox';
        suggestBox.style.cssText = 'position:absolute;top:calc(100% + 10px);left:26px;right:26px;max-height:220px;overflow-y:auto;overscroll-behavior:none;background:linear-gradient(170deg, rgba(28,28,40,0.96) 0%, rgba(18,18,30,0.96) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,215,0,0.22);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,0.6);display:none;z-index:1001;padding:4px;';

        wrapper.appendChild(suggestBox);
        commandOverlay.appendChild(wrapper);

        const errorToast = document.createElement('div');
        errorToast.id = 'cmdError';
        errorToast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:linear-gradient(160deg, rgba(140,40,40,0.94), rgba(90,24,24,0.94));backdrop-filter:blur(10px);color:#ffd9d9;padding:12px 24px;border-radius:14px;font-size:15px;font-weight:bold;z-index:2000;display:none;border:1px solid rgba(255,100,100,0.3);box-shadow:0 10px 40px rgba(0,0,0,0.5);';
        document.body.appendChild(errorToast);

        attachLiquidScroll(suggestBox);

        function updateSuggestions() {
            const matches = getSuggestions(commandInput.value);
            if (matches.length === 0) { suggestBox.style.display = 'none'; suggestBox.innerHTML = ''; return; }
            suggestBox.innerHTML = '';
            matches.forEach(m => {
                const el = document.createElement('div');
                el.textContent = m;
                el.style.cssText = 'padding:9px 16px;color:#e8e8f0;cursor:pointer;font-family:monospace;font-size:15px;border-radius:8px;border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.15s, color 0.15s;';
                el.onmouseenter = () => { el.style.background = 'rgba(255,215,0,0.16)'; el.style.color = '#ffd966'; };
                el.onmouseleave = () => { el.style.background = 'transparent'; el.style.color = '#e8e8f0'; };
                el.onclick = () => {
                    commandInput.value = m;
                    suggestBox.style.display = 'none';
                    commandInput.focus();
                    commandInput.setSelectionRange(m.length, m.length);
                };
                suggestBox.appendChild(el);
            });
            suggestBox.style.display = 'block';
            attachLiquidScroll(suggestBox);
        }

        commandInput.addEventListener('input', () => { tabCycleIndex = 0; lastTabInput = ''; updateSuggestions(); });
        commandInput.addEventListener('blur', () => setTimeout(() => suggestBox.style.display = 'none', 200));
        commandInput.addEventListener('focus', updateSuggestions);

        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const cmd = commandInput.value.trim();
                if (cmd) {
                    if (typeof window.executeCommand === 'function') {
                        try {
                            const result = window.executeCommand(cmd);
                            if (result === false) showCommandError('指令错误');
                        } catch (err) {
                            showCommandError('错误: ' + (err.message || '未知'));
                        }
                    } else {
                        showCommandError('命令系统未初始化');
                    }
                    closeCommandUI();
                } else {
                    closeCommandUI();
                }
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeCommandUI();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const matches = getSuggestions(commandInput.value);
                if (matches.length === 0) return;
                const current = commandInput.value.trim();
                if (current !== lastTabInput) {
                    tabCycleIndex = 0;
                    lastTabInput = current;
                }
                const pick = matches[tabCycleIndex % matches.length];
                tabCycleIndex++;
                commandInput.value = pick;
                commandInput.setSelectionRange(pick.length, pick.length);
                updateSuggestions();
                // 高亮当前补全项
                const items = suggestBox.querySelectorAll('div');
                const hl = (tabCycleIndex - 1) % matches.length;
                items.forEach((el, i) => {
                    if (i === hl) { el.style.background = 'rgba(255,215,0,0.28)'; el.style.color = '#ffd966'; }
                    else { el.style.background = 'transparent'; el.style.color = '#e8e8f0'; }
                });
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                const matches = getSuggestions(commandInput.value);
                if (matches.length > 0 && suggestBox.style.display === 'block') {
                    e.preventDefault();
                    if (e.key === 'ArrowDown') { tabCycleIndex++; } else { tabCycleIndex--; }
                    if (tabCycleIndex < 0) tabCycleIndex = matches.length - 1;
                    const pick = matches[tabCycleIndex % matches.length];
                    commandInput.value = pick;
                    commandInput.setSelectionRange(pick.length, pick.length);
                    const items = suggestBox.querySelectorAll('div');
                    items.forEach((el, i) => {
                        if (i === tabCycleIndex % matches.length) { el.style.background = 'rgba(255,215,0,0.28)'; el.style.color = '#ffd966'; }
                        else { el.style.background = 'transparent'; el.style.color = '#e8e8f0'; }
                    });
                }
            }
        });

        document.body.appendChild(commandOverlay);
        commandOverlay.addEventListener('click', (e) => {
            if (e.target === commandOverlay) closeCommandUI();
        });

        window.showCommandError = function(msg) {
            errorToast.textContent = msg;
            errorToast.style.display = 'block';
            clearTimeout(errorToast._hideTimer);
            errorToast._hideTimer = setTimeout(() => errorToast.style.display = 'none', 6000);
        };

        // 注入全局样式（动画 + 滚动条）
        if (!document.getElementById('cmdGlassStyle')) {
            const st = document.createElement('style');
            st.id = 'cmdGlassStyle';
            st.textContent = '@keyframes cmdFadeIn{0%{opacity:0}100%{opacity:1}} #suggestBox::-webkit-scrollbar{width:8px} #suggestBox::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.3);border-radius:8px} #suggestBox::-webkit-scrollbar-track{background:transparent}';
            document.head.appendChild(st);
        }

        setTimeout(() => commandInput.focus(), 100);
    }

    function closeCommandUI() {
        if (commandOverlay) {
            document.body.removeChild(commandOverlay);
            commandOverlay = null;
            commandInput = null;
            commandInputActive = false;
            window.commandInputActive = false;
            if (typeof canvas !== 'undefined' && canvas) canvas.focus();
        }
    }

    function openCommandUI() {
        if (commandInputActive) return;
        commandInputActive = true;
        window.commandInputActive = true;
        createCommandUI();
    }

    function isCommandActive() { return commandInputActive; }

    window.openCommandUI = openCommandUI;
    window.closeCommandUI = closeCommandUI;
    window.isCommandActive = isCommandActive;
    window.commandInputActive = false;

    console.log('[指令系统] 已加载，按 T 打开，Tab 循环补全，毛玻璃 + 液体滚动');
})();

</script>
<script>
/* ================= 公用文件/js/render-scene.js ================= */
// ========== 场景渲染（不含 UI） ==========
const statusImages = { slow: null, frozen: null, fire: null, permSlow: null, blackhole: null, lightning: null };
const weaponIconCache = {};

// 优化清单第 13 条：武器图标改为进入场景时预加载，避免首次渲染在每帧路径里 new Image() 造成卡顿与闪烁。
function preloadWeaponIcons() {
    if (typeof WEAPONS === 'undefined' || !WEAPONS) return;
    for (const id in WEAPONS) {
        const icon = WEAPONS[id] && WEAPONS[id].icon;
        if (!icon || weaponIconCache[icon]) continue;
        const img = new Image();
        img.src = icon;
        weaponIconCache[icon] = img;
    }
}
window.preloadWeaponIcons = preloadWeaponIcons;
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', preloadWeaponIcons);
} else {
    preloadWeaponIcons();
}

function loadStatusIcons() {
    const icons = {
        slow: '../公用文件/图片/元素和状态/减速.png',
        frozen: '../公用文件/图片/元素和状态/冰冻.png',
        fire: '../公用文件/图片/元素和状态/火焰.png',
        permSlow: '../公用文件/图片/元素和状态/减速-无限.png',
        blackhole: '../公用文件/图片/元素和状态/黑洞.png',
        lightning: '../公用文件/图片/元素和状态/电离子.png'
    };
    for (const [key, src] of Object.entries(icons)) {
        const img = getCachedImage(src);
        statusImages[key] = img;
    }
}
loadStatusIcons();

function drawStatusBadge(img, x, y, size, bg, glyph, opts) {
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, size, size);
        return;
    }
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    if (opts && opts.centered) {
        const prevAlign = ctx.textAlign;
        ctx.textAlign = 'center';
        ctx.fillText(glyph, x + size / 2, y + size / 2 + 4);
        ctx.textAlign = prevAlign;
    } else {
        ctx.fillText(glyph, x + size / 2 - 5, y + size / 2 + 4);
    }
}

// 状态图标表：test 判定是否绘制，level 取叠加层数（>0 才画 xN），img 为空则用纯色块 + 字形兜底
const STATUS_TABLE = [
    { key: 'frozen',    img: 'frozen',    bg: '#88ccff', glyph: '❄',   test: e => e.frozenUntil && e.frozenUntil > performance.now() },
    { key: 'fire',      img: 'fire',      bg: '#ff6600', glyph: '🔥',  color: '#ffaa00', test: e => e.fireLevel > 0,       level: e => e.fireLevel },
    { key: 'permSlow',  img: 'permSlow',  bg: '#b3b3b3', glyph: '∞',   test: e => !!e.hasPermanentSlow },
    { key: 'blackhole', img: 'blackhole', bg: '#4400aa', glyph: '🕳️', color: '#ffffff', test: e => e.blackholeLevel > 0,  level: e => e.blackholeLevel },
    { key: 'slow',      img: 'slow',      bg: '#cccc99', glyph: '🐢',  color: '#ffff00', test: e => e.slowLevel > 0,       level: e => e.slowLevel },
    { key: 'weak',      img: null,        bg: '#8866aa', glyph: '💀',  color: '#cc99ff', test: e => e.weakLevel > 0,       level: e => e.weakLevel, centered: true }
];

function drawStatusStack(e, sx, iconSize, startOffsetY) {
    let offsetY = startOffsetY || 0;
    const baseY = e.y - iconSize - 2;
    for (const st of STATUS_TABLE) {
        if (!st.test(e)) continue;
        const iconX = sx + e.w / 2 - iconSize / 2;
        const iconY = baseY - offsetY;
        drawStatusBadge(st.img ? statusImages[st.img] : null, iconX, iconY, iconSize, st.bg, st.glyph, { centered: st.centered });
        const lv = st.level ? st.level(e) : 0;
        if (lv > 0) {
            ctx.fillStyle = st.color;
            ctx.font = 'bold 12px monospace';
            ctx.fillText('x' + lv, iconX + iconSize - 8, iconY + iconSize - 4);
        }
        offsetY += 26;
    }
    return offsetY;
}

function updateCam() {
    let target = cameraX;
    let psx = player.x - cameraX;
    if (psx < DEAD_ZONE_LEFT) target = player.x - DEAD_ZONE_LEFT;
    else if (psx > DEAD_ZONE_RIGHT) target = player.x - DEAD_ZONE_RIGHT;
    target = Math.min(Math.max(0, target), WORLD_W - VIEW_W);
    cameraX += (target - cameraX) * 0.1;
    cameraX = Math.min(Math.max(0, cameraX), WORLD_W - VIEW_W);
}

function drawScene() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // 牢房背景（监狱专用）
    if (typeof prisonCells !== 'undefined' && prisonCells.length > 0) {
        prisonCells.forEach(c => {
            let sx = c.x - cameraX;
            if (sx + c.width < 0 || sx > VIEW_W) return;
            ctx.fillStyle = 'rgba(40,45,55,0.25)';
            ctx.fillRect(sx, c.y, c.width, c.height);
            ctx.fillStyle = 'rgba(180,190,200,0.15)';
            const barCount = Math.floor(c.width / 22);
            for (let i = 0; i < barCount; i++) {
                ctx.fillRect(sx + i * 22 + 4, c.y, 3, c.height);
            }
            ctx.fillStyle = 'rgba(180,190,200,0.2)';
            ctx.fillRect(sx, c.y, c.width, 3);
            ctx.fillRect(sx, c.y + c.height - 3, c.width, 3);
            ctx.strokeStyle = 'rgba(180,190,200,0.12)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(sx, c.y, c.width, c.height);
        });
    }

    // 黑屋装饰
    if (typeof DECOS !== 'undefined' && DECOS.length > 0) {
        DECOS.forEach(d => {
            let sx = d.x - cameraX;
            if (sx + d.w < 0 || sx > VIEW_W) return;
            ctx.fillStyle = d.color;
            ctx.fillRect(sx, d.y, d.w, d.h);
        });
    }

    // 存档点
    savePoints.forEach(sp => {
        let sx = sp.starX - cameraX;
        if (sx + 25 < 0 || sx - 25 > VIEW_W) return;
        let sy = WORLD_H - 70, sz = ANIMATION_SIZE / 2;
        if (saveStarImage && saveStarImage.complete) {
            ctx.drawImage(saveStarImage, sx - sz, sy - sz, ANIMATION_SIZE, ANIMATION_SIZE);
            ctx.save();
            ctx.shadowColor = 'rgba(255,215,0,0.6)';
            ctx.shadowBlur = 10;
            ctx.drawImage(saveStarImage, sx - sz, sy - sz, ANIMATION_SIZE, ANIMATION_SIZE);
            ctx.restore();
        } else {
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(sx, sy, 16, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#ffaa33';
            for (let i = 0; i < 6; i++) {
                let a = i * Math.PI * 2 / 6;
                ctx.beginPath();
                ctx.arc(sx + Math.cos(a) * 24, sy + Math.sin(a) * 24, 6, 0, 2 * Math.PI);
                ctx.fill();
            }
        }
    });

    // 敌人
    enemies.forEach(e => {
        let sx = e.x - cameraX;
        if (sx + e.w < 0 || sx > VIEW_W) return;
        // 受击形变（Squash & Stretch）：命中瞬间挤压后回弹
        let dw = e.w, dh = e.h, dx = sx, dy = e.y;
        if (e.squash > 0) {
            const sq = e.squash;
            const sqx = 1 + sq * 0.55 * Math.sin(e.squashPhase);
            const sqy = 1 - sq * 0.4 * Math.sin(e.squashPhase);
            dw *= sqx; dh *= sqy;
            dx = sx + (e.w - dw) / 2;
            dy = e.y + (e.h - dh);
        }
        // 惯性抖动（Wobble）：受击后短时左右晃动
        if (e.wobble > 0) {
            dx += Math.sin(e.wobblePhase) * e.wobble;
        }
        ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
        ctx.fillRect(dx, dy, dw, dh);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.fillText(e.hp, sx + 6, e.y - 5);

        const iconSize = 24;
        // 优化清单第 10 条：状态图标改为表驱动（新增状态只需在 STATUS_TABLE 追加一行），
        // 统一用 offsetY 堆叠，避免每个状态各写一份坐标计算。
        let offsetY = drawStatusStack(e, sx, iconSize, 0);


        if (e.lightningLevel > 0) {
            const lightningSize = 28;
            let lx = sx + e.w / 2 - lightningSize / 2;
            let ly = e.y - lightningSize - 2 - offsetY;
            const pulse = Math.sin(performance.now() / 200 + e.x) * 0.3 + 0.7;
            if (statusImages.lightning && statusImages.lightning.complete && statusImages.lightning.naturalWidth > 0) {
                ctx.save();
                ctx.shadowColor = '#aa66ff';
                ctx.shadowBlur = 15 * pulse;
                ctx.drawImage(statusImages.lightning, lx, ly, lightningSize, lightningSize);
                ctx.restore();
            } else {
                ctx.save();
                ctx.shadowColor = '#aa66ff';
                ctx.shadowBlur = 20 * pulse;
                ctx.fillStyle = 'rgba(170,102,255,' + (0.3 * pulse) + ')';
                ctx.fillRect(lx - 4, ly - 4, lightningSize + 8, lightningSize + 8);
                ctx.fillStyle = '#aa88ff';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('⚡', sx + e.w / 2, ly + lightningSize - 2);
                ctx.restore();
            }
            ctx.fillStyle = '#cc99ff';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('x' + e.lightningLevel, sx + e.w / 2, ly + lightningSize + 12);
            ctx.textAlign = 'start';
        }

        if (e.weaponId && typeof WEAPONS !== 'undefined' && WEAPONS[e.weaponId]) {
            const weapon = WEAPONS[e.weaponId];
            const wSize = 20;
            const wx = sx + e.w - wSize - 2;
            const wy = e.y - wSize - 2;
            let img = weaponIconCache[weapon.icon];
            if (!img) {
                img = new Image();
                img.src = weapon.icon;
                weaponIconCache[weapon.icon] = img;
            }
            if (img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, wx, wy, wSize, wSize);
            } else {
                ctx.fillStyle = '#333';
                ctx.fillRect(wx, wy, wSize, wSize);
                ctx.fillStyle = '#fff';
                ctx.font = '12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(weapon.name[0], wx + wSize / 2, wy + wSize / 2 + 4);
                ctx.textAlign = 'start';
            }
        }

        if (e.controlledByPet) {
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.strokeStyle = '#aa88ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(sx + e.w / 2, e.y + e.h / 2, e.w / 2 + 5, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.restore();
        }
    });

    // 合成标记：当前合成组红色连线 + 头顶预警红点
    if (typeof smallMergeGroup !== 'undefined' && smallMergeGroup.length === 3) {
        let pts = smallMergeGroup.map(e => ({ x: e.x + e.w / 2 - cameraX, y: e.y - 6 }));
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[(i + 1) % pts.length].x, pts[(i + 1) % pts.length].y);
        }
        ctx.stroke();
        ctx.lineWidth = 1;
        for (let e of smallMergeGroup) {
            let sx2 = e.x - cameraX;
            let pulse = Math.sin(performance.now() / 100) * 0.5 + 0.5;
            ctx.fillStyle = 'rgba(255,0,0,' + (0.4 + 0.6 * pulse).toFixed(2) + ')';
            ctx.beginPath();
            ctx.arc(sx2 + e.w / 2, e.y - 8, 5, 0, 2 * Math.PI);
            ctx.fill();
        }
    }

    // 投射物
    projectiles.forEach(b => {
        let sx = b.x - cameraX;
        if (sx + b.w < 0 || sx > VIEW_W) return;
        if (b.isEnemy) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(sx, b.y, b.w, b.h);
        } else if (b.isTechSpear) {
            const cx = sx + b.w / 2;
            const cy = b.y + b.h / 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(b.facing, 1);
            ctx.rotate(-Math.PI / 2);
            let spearImg = getCachedImage('../公用文件/图片/装备/武器/科技长矛.png');
            if (spearImg.complete && spearImg.naturalWidth > 0) {
                ctx.drawImage(spearImg, -b.w / 2, -b.h / 2, b.w, b.h);
            } else {
                ctx.fillStyle = '#00ccff';
                ctx.shadowColor = '#00ccff';
                ctx.shadowBlur = 25;
                const len = 30;
                ctx.fillRect(-3, -len / 2, 6, len);
                ctx.beginPath();
                ctx.moveTo(0, -len / 2 - 12);
                ctx.lineTo(-9, -len / 2 + 2);
                ctx.lineTo(9, -len / 2 + 2);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        } else if (b.isBlackhole) {
            const cx = sx + b.w / 2, cy = b.y + b.h / 2;
            const radius = b.w / 2;
            b.angle = (b.angle || 0) + 0.08;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(b.angle);
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
            gradient.addColorStop(0, '#000000');
            gradient.addColorStop(0.5, '#4400aa');
            gradient.addColorStop(1, '#ff6600');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,100,50,0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        } else if (b.isArrow) {
            if (b.img && b.img.complete && b.img.naturalWidth > 0) {
                ctx.drawImage(b.img, sx, b.y, b.w, b.h);
            } else {
                ctx.fillStyle = '#ffaa44';
                ctx.fillRect(sx, b.y, b.w, b.h);
                ctx.strokeStyle = '#ffffff';
                ctx.strokeRect(sx, b.y, b.w, b.h);
            }
        } else if (b.isFireball) {
            ctx.fillStyle = b.color || '#ff6600';
            ctx.beginPath();
            ctx.arc(sx + b.w / 2, b.y + b.h / 2, b.w / 2, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'orange';
            ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            ctx.save();
            ctx.translate(sx + b.w / 2, b.y + b.h / 2);
            ctx.rotate(b.angle);
            ctx.fillStyle = '#b8860b';
            ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
            ctx.restore();
        }
    });

    // 黑洞权杖：黑洞区域渲染
    if (window.blackholeZones && window.blackholeZones.length > 0) {
        for (let z of window.blackholeZones) {
            let sx = z.x - cameraX;
            if (sx + z.r < 0 || sx - z.r > VIEW_W) continue;
            let alpha = Math.max(0.25, Math.min(1, z.ttl / 3000));
            ctx.save();
            const gradient = ctx.createRadialGradient(sx, z.y, 0, sx, z.y, z.r);
            gradient.addColorStop(0, 'rgba(30,0,60,' + (0.55 * alpha) + ')');
            gradient.addColorStop(0.7, 'rgba(80,0,160,' + (0.35 * alpha) + ')');
            gradient.addColorStop(1, 'rgba(255,120,40,' + (0.25 * alpha) + ')');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(sx, z.y, z.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,100,50,' + (0.5 * alpha) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, z.y, z.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    if (boss) {
        lasers.forEach(l => {
            let sy = 0, ey = WORLD_H, sx, ex;
            if (l.angle === 0) { sx = l.x; ex = l.x; }
            else { let e = getSlantLaserEndpoints(l.x, l.angle); sx = e.startX; ex = e.endX; }
            let ssx = sx - cameraX, sex = ex - cameraX;
            ctx.beginPath();
            ctx.moveTo(ssx, sy);
            if (l.state === 'warn') {
                ctx.lineTo(sex, ey);
                ctx.strokeStyle = 'rgba(255,0,0,' + (0.3 + Math.sin(l.blink * 2 * Math.PI) * 0.2) + ')';
                ctx.lineWidth = 20;
                ctx.stroke();
            } else if (l.state === 'act') {
                let cy = sy + (ey - sy) * l.factor, cx = sx + (ex - sx) * l.factor;
                ctx.lineTo(cx - cameraX, cy);
                ctx.strokeStyle = 'rgba(255,50,50,0.9)';
                ctx.lineWidth = 22;
                ctx.stroke();
            }
        });
    }

    // 砖头预览
    if (charging && previewBrick.active) {
        let sx = previewBrick.worldX - cameraX, sy = previewBrick.worldY;
        ctx.save();
        ctx.translate(sx + BRICK_W / 2, sy + BRICK_H / 2);
        ctx.rotate(previewBrick.angle);
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#cd853f';
        ctx.fillRect(-BRICK_W / 2, -BRICK_H / 2, BRICK_W, BRICK_H);
        ctx.restore();
        let pcx = player.x, pcy = player.y + player.h / 2,
            tx = mouseScreenX + cameraX, ty = mouseScreenY,
            dx = tx - pcx, dy = ty - pcy, len = Math.hypot(dx, dy);
        if (len > 0.001) {
            let nx = dx / len, ny = dy / len,
                sx2 = previewBrick.worldX + BRICK_W / 2, sy2 = previewBrick.worldY + BRICK_H / 2,
                vx = nx * BRICK_SPD, vy = ny * BRICK_SPD;
            ctx.beginPath();
            ctx.strokeStyle = '#aaa';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            let x = sx2, y = sy2, vxs = vx, vys = vy;
            ctx.moveTo(x - cameraX, y);
            for (let t = 0.1; t <= 2.0; t += 0.1) {
                vys += BRICK_GRAV * 0.1;
                x += vxs * 0.1;
                y += vys * 0.1;
                ctx.lineTo(x - cameraX, y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x - cameraX, y, 3, 0, 2 * Math.PI);
            ctx.fill();
        }
    }

    // BOSS
    if (boss) {
        let sx = boss.x - cameraX;
        if (sx + boss.w > 0 && sx < VIEW_W) {
            // 受击形变/抖动
            let dw = boss.w, dh = boss.h, dx0 = sx, dy0 = boss.y;
            if (boss.squash > 0) {
                const sq = boss.squash;
                const sqx = 1 + sq * 0.55 * Math.sin(boss.squashPhase);
                const sqy = 1 - sq * 0.4 * Math.sin(boss.squashPhase);
                dw *= sqx; dh *= sqy;
                dx0 = sx + (boss.w - dw) / 2;
                dy0 = boss.y + (boss.h - dh);
            }
            if (boss.wobble > 0) dx0 += Math.sin(boss.wobblePhase) * boss.wobble;
            let cw = dw / 4, ch = dh / 4;
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    ctx.fillStyle = boss.colors[i * 4 + j];
                    ctx.fillRect(dx0 + j * cw, dy0 + i * ch, cw, ch);
                }
            }
            ctx.fillStyle = '#f00';
            ctx.fillRect(dx0, boss.y - 12, dw, 6);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(dx0, boss.y - 12, dw * (boss.hp / boss.maxHp), 6);
        }
    }

    // 近战命中粒子（世界坐标 -> 屏幕坐标，必须减去相机偏移才能贴住被击中的敌人）
    if (typeof HIT_PARTICLES !== 'undefined' && HIT_PARTICLES.length) {
        for (let i = 0; i < HIT_PARTICLES.length; i++) {
            const p = HIT_PARTICLES[i];
            const alpha = Math.max(0, p.life);
            if (alpha <= 0) continue;
            const psx = p.x - cameraX;
            const psy = p.y - (typeof cameraY !== 'undefined' ? cameraY : 0);
            if (psx < -20 || psx > VIEW_W + 20) continue;
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(psx, psy, Math.max(0.6, p.size * alpha), 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 玩家
    let px = player.x - cameraX + player.visualOffX;
    // 冰霜之翼滑翔拖尾（推进+绘制）
    if (window.iceTrail) {
        for (let i = window.iceTrail.length - 1; i >= 0; i--) {
            const p = window.iceTrail[i];
            p.life -= 0.045;
            p.y += (p.vy || 0.4);
            if (p.life <= 0) window.iceTrail.splice(i, 1);
        }
        for (const p of window.iceTrail) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life) * 0.6;
            ctx.fillStyle = '#aaf4ff';
            ctx.beginPath();
            ctx.arc(p.x - cameraX, p.y - cameraY, 1.5 + p.life * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
    // 科技护盾（激活时角色前方半透明能量六边形）
    if (window.shieldActive) {
        const scx = px + player.w / 2, scy = player.y + player.h / 2;
        ctx.save();
        ctx.globalAlpha = 0.75 + 0.25 * Math.sin(performance.now() / 90);
        ctx.strokeStyle = '#33eeff';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#33eeff';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
            const a = Math.PI / 6 + k * Math.PI / 3;
            const rx = scx + 26 * Math.cos(a), ry = scy + 26 * Math.sin(a);
            if (k === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.globalAlpha *= 0.2;
        ctx.fillStyle = '#33eeff';
        ctx.fill();
        ctx.restore();
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(px, player.y, player.w, player.h);
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(px + player.w / 2 - 14, player.y - 20, 28, 20, 6);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(player.facing === 1 ? '→' : '←', px + player.w / 2, player.y - 10);
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('⤴' + player.jumpsLeft, px + player.w / 2, player.y - 23);

    // 宠物
    if (typeof drawAllPets === 'function') drawAllPets();

    // 角色面板
    if (characterPanelOpen) {
        const W = VIEW_W, H = VIEW_H;
        const panelW = 400, panelH = 260;
        const px2 = (W - panelW) / 2, py2 = (H - panelH) / 2;
        ctx.fillStyle = 'rgba(20,20,30,0.92)';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.roundRect(px2, py2, panelW, panelH, 16);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'gold';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(px2, py2, panelW, panelH, 16);
        ctx.stroke();
        ctx.fillStyle = '#ffd966';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('角色信息', W / 2, py2 + 32);
        // 当前角色详情（原神风格：头像/名称/等级/经验条/金币/经验物品/装备）
        const ch = CHARACTERS[window.currentCharacter] || CHARACTERS.ava;
        const detX = px2 + 18, detY = py2 + 46;
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.roundRect(detX, detY, 52, 52, 10);
        ctx.fill();
        ctx.strokeStyle = '#c8b58c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(detX, detY, 52, 52, 10);
        ctx.stroke();
        ctx.fillStyle = (window.currentCharacter === 'ava') ? '#7ec8ff' : '#ff9d5c';
        ctx.font = 'bold 26px monospace';
        ctx.textAlign = 'center';
        ctx.fillText((window.currentCharacter === 'ava') ? 'A' : 'B', detX + 26, detY + 36);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fff';

        ctx.textAlign = 'center';
        ctx.fillText('按 1/2 切换  按 P 关闭', W / 2, py2 + panelH - 15);
        ctx.textAlign = 'start';
    }

    // 复合弓瞄准
    if (compoundBowCharging && currentWeapon && currentWeapon.isCompound) {
        let sx = compoundBowPreviewX - cameraX;
        let sy = compoundBowPreviewY;
        if (sx > -20 && sx < VIEW_W + 20 && sy > -20 && sy < VIEW_H + 20) {

                ctx.strokeStyle = '#ff4444';

                ctx.strokeStyle = '#ffaa44';
                ctx.fillStyle = 'rgba(255,170,68,0.3)';
            }
            ctx.setLineDash([]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, sy, 8, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(sx - 12, sy);
            ctx.lineTo(sx + 12, sy);
            ctx.moveTo(sx, sy - 12);
            ctx.lineTo(sx, sy + 12);
            ctx.stroke();
            ctx.restore();
        }
    }
}

<script>
/* ================= 公用文件/js/scene-core/game-loop.js ================= */
// ---------- 主游戏循环及事件 ----------
let mouseLeftClicked = false;
let mouseRightClicked = false;

// 垂直镜头偏移
let cameraY = 0;

// 自然生成开关
window.stopNaturalSpawn = false;

// ---------- 角色系统变量（黑屋空实现） ----------
let characterPanelOpen = false;
let characterSelectOption = 0;
const CHARACTER_KEYS = { '1': 'ava', '2': 'bl' };
let pKeyPressed = false;
let jumpHeld = false;

// ---------- 复合弓蓄力状态 ----------
let compoundBowCharging = false;
let compoundBowPreviewX = 0;
let compoundBowPreviewY = 0;
let compoundBowHitEnemy = null;
let compoundBowStartX = 0;
let compoundBowStartY = 0;
let compoundBowTargetX = 0;
let compoundBowTargetY = 0;

// ---------- 命令UI（已迁移至 command-system.js：openCommandUI/closeCommandUI/isCommandActive） ----------

// ---------- give 指令物品解析（统一由 ITEMS 驱动，避免漏项） ----------
const GIVE_ALIASES = {
    fb: 'frostBlade', fs: 'firewand', cb: 'compoundBow', bh: 'blackholeStaff',
    ts: 'techSpear', pr: 'priestRobes', cm: 'clownMask', sd: 'shadowDagger',
    th: 'thunderHammer', en: 'xiaoe', '0.618': 'point618',
    ic: 'iceWings', iw: 'iceWings', ice: 'iceWings', wings: 'iceWings',
    '冰翼': 'iceWings', '冰霜翼': 'iceWings',
    shield: 'techShield', tshield: 'techShield', techshield: 'techShield',
    '盾牌': 'techShield', '科技盾': 'techShield'
};
const GIVE_PET_IDS = { monkey: 1, point618: 1, horror: 1, xiaoe: 1 };

// 去掉 emoji / 空白 / 分隔符，便于用中文名或大小写变体匹配
function stripItemLabel(s) {
    return String(s || '').replace(/[\uD800-\uDFFF\u2600-\u27BF\uFE0F\u200D\s\-_·.]/g, '').toLowerCase();
}

function resolveGiveItemId(raw) {
    const key = String(raw || '').trim();
    if (!key || typeof ITEMS === 'undefined') return null;
    const lower = key.toLowerCase();
    if (GIVE_ALIASES[lower] && ITEMS[GIVE_ALIASES[lower]]) return GIVE_ALIASES[lower];
    if (ITEMS[lower]) return lower;
    for (const id in ITEMS) {
        if (id.toLowerCase() === lower) return id;
    }
    const target = stripItemLabel(key);
    if (!target) return null;
    for (const id in ITEMS) {
        const label = stripItemLabel(ITEMS[id].name);
        if (label === target || label.indexOf(target) >= 0) return id;
    }
    return null;
}

function giveItemByCommand(raw) {
    const id = resolveGiveItemId(raw);
    if (!id) return false;
    const name = (ITEMS[id] && ITEMS[id].name) || id;
    if (GIVE_PET_IDS[id]) {
        if (typeof addPet !== 'function') { showToast('宠物系统未加载'); return true; }
        addPet(id);
        showToast('获得 ' + name + ' 宠物');
        return true;
    }
    if (typeof addItem !== 'function') { showToast('物品系统未加载'); return true; }
    if (!addItem(id, 1)) { showToast('物品栏已满，无法获得 ' + name); return true; }
    showToast('获得 ' + name + ' x1');
    return true;
}

// ---------- 执行命令 ----------
function executeCommand(cmd) {
    // give：按 ITEMS 全量直通（含科技盾牌 / 冰霜之翼 / 药水 / 材料），命中即返回
    if (/^give\s+\S+/i.test(cmd) && giveItemByCommand(cmd.replace(/^give\s+/i, '').trim())) return;
    if (cmd.toLowerCase() === 'st summon') {
        window.stopNaturalSpawn = !window.stopNaturalSpawn;
        showToast(window.stopNaturalSpawn ? '✅ 已停止敌人自然生成' : '✅ 已恢复敌人自然生成');
        return;
    }

    if (/^image\s+(reset|clear|还原)$/i.test(cmd.trim())) {
        if (typeof window.resetImageOverrides === 'function') window.resetImageOverrides();
        else showToast('贴图系统未加载');
        return;
    }

    const imageMatch = cmd.match(/^image\s+(.+?)\s*=\s*(.+)$/i);
    if (imageMatch) {
        if (typeof window.applyImageOverride === 'function') {
            window.applyImageOverride(imageMatch[1].trim(), imageMatch[2].trim());
        } else {
            showToast('贴图系统未加载');
        }
        return;
    }

    const coinMatch = cmd.match(/^give\s+(\d+)\s+coin$/i);
    if (coinMatch) {
        let amount = parseInt(coinMatch[1], 10);
        if (isNaN(amount) || amount <= 0) {
            showToast('金币数量必须为正整数');
            return;
        }
        if (amount > 2000) {
            amount = 2000;
            showToast('单次最多获得2000金币，已自动调整为2000');
        }
        gold += amount;
        showToast(`获得 ${amount} 金币`);
        return;
    }

    const giveMatch = cmd.match(/^give\s+(\S+)$/i);
    if (giveMatch) {
        let item = giveMatch[1].toLowerCase();
        if (item === 'fb') {
            addItem('frostBlade', 1);
            showToast('获得 F·B 冰霜之刃 x1');
        } else if (item === 'fs') {
            addItem('firewand', 1);
            showToast('获得火焰法杖 x1');
        } else if (item === 'sword') {
            addItem('sword', 1);
            showToast('获得铁剑 x1');
        } else if (item === 'compoundbow' || item === 'cb') {
            addItem('compoundBow', 1);
            showToast('获得复合弓 x1');
        } else if (item === 'blackholestaff' || item === 'bh') {
            addItem('blackholeStaff', 1);
            showToast('获得黑洞权杖 x1');
        } else if (item === 'techspear' || item === 'ts') {
            addItem('techSpear', 1);
            showToast('获得科技长矛 x1');
        } else if (item === 'priestrobes' || item === 'pr') {
            addItem('priestRobes', 1);
            showToast('获得神父服 x1');
        } else if (item === 'monkey') {
            if (typeof addPet === 'function') {
                addPet('monkey');
                showToast('获得 Monkey 宠物');
            } else {
                showToast('宠物系统未加载');
            }
        } else if (item === '0.618') {
            if (typeof addPet === 'function') {
                addPet('point618');
                showToast('获得 0.618 宠物');
            } else {
                showToast('宠物系统未加载');
            }
        } else if (item === 'horror') {
            if (typeof addPet === 'function') {
                addPet('horror');
                showToast('获得 Horror 宠物');
            } else {
                showToast('宠物系统未加载');
            }
        } else if (item === 'en') {
            if (typeof addPet === 'function') {
                addPet('xiaoe');
                showToast('获得 小e 宠物');
            } else {
                showToast('宠物系统未加载');
            }
        } else if (item === 'cross') {
            addItem('cross', 1);
            showToast('获得 ✝️ 十字架 x1');
        } else if (item === 'cm' || item === 'clownmask') {
            addItem('clownMask', 1);
            showToast('获得 🤡 小丑面具 x1');
        } else if (item === 'sd') {
            addItem('shadowDagger', 1);
            showToast('获得 🗡️ 暗影匕首 x1');
        } else if (item === 'th' || item === 'thunderhammer') {
            addItem('thunderHammer', 1);
            showToast('获得 ⚡ 雷霆锤 x1');
        } else {
            showToast('未知物品，可用: sword, fb, fs, compoundbow/cb, blackholestaff/bh, techspear/ts, priestrobes/pr, monkey, 0.618, horror, en, cross, cm, sd, th');
        }
        return;
    }

    if (cmd.toLowerCase() === 'kill') {
        let killed = 0;
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (e.type === 'red' || e.type === 'black') {
                if (typeof addKillReward === 'function') addKillReward(e.type, e.isSmall);
                killCount++;
                enemies.splice(i, 1);
                killed++;
            }
        }
        showToast(`已杀死 ${killed} 个敌人`);
        return;
    }

    const summonMatch = cmd.match(/^summon\s+(\d+)\s+(\w+)(?:\s+(\d+))?(?:\s*~~~\s*(.*))?$/i);
    if (summonMatch) {
        const count = parseInt(summonMatch[1], 10);
        const type = summonMatch[2].toLowerCase();
        const chunkArg = summonMatch[3];
        const extraStr = summonMatch[4] || '';

        let targetChunk = null;
        if (chunkArg !== undefined && chunkArg !== '') {
            targetChunk = parseInt(chunkArg, 10);
        }

        let customHP = null;
        let customWeapon = null;

        const weaponAliases = {
            'sword': 'sword',
            'fb': 'frostBlade',
            'fs': 'firewand',
            'sd': 'shadowDagger',
            'th': 'thunderHammer',
            'cb': 'compoundBow',
            'bh': 'blackholeStaff',
            'ts': 'techSpear'
        };

        if (extraStr) {
            const parts = extraStr.split('~').filter(s => s.trim() !== '');
            for (const part of parts) {
                const trimmed = part.trim();
                const hpMatch = trimmed.match(/^HP\s*=\s*(\d+)$/i);
                if (hpMatch) {
                    customHP = parseInt(hpMatch[1], 10);
                    if (customHP <= 0) customHP = 1;
                    continue;
                }
                const aliasKey = trimmed.toLowerCase();
                const weaponId = weaponAliases[aliasKey];
                if (weaponId && WEAPONS[weaponId]) {
                    customWeapon = weaponId;
                } else if (WEAPONS[trimmed]) {
                    customWeapon = trimmed;
                } else {
                    showToast(`未知武器: ${trimmed}，可用: sword, fb, fs, sd, th, cb, bh, ts`);
                    return;
                }
            }
        }

        summonEnemies(count, type, targetChunk, customHP, customWeapon);
        return;
    }

    const bmMatch = cmd.match(/^bm\s+(\d+)$/i);
    if (bmMatch) {
        const block = parseInt(bmMatch[1], 10);
        if (block < 0) { showToast('区块不可小于0'); return; }
        if (block >= MAP_CHUNKS) { showToast('区块不可大于最大区块数(' + (MAP_CHUNKS - 1) + ')'); return; }
        const targetX = block * CHUNK_SIZE + CHUNK_SIZE / 2 - player.w / 2;
        player.x = Math.min(Math.max(0, targetX), WORLD_W - player.w);
        player.y = getGroundY();
        player.vy = 0;
        player.jumpsLeft = talentTripleJump ? 3 : 2;
        cameraX = Math.max(0, Math.min(player.x - VIEW_W/2, WORLD_W - VIEW_W));
        return;
    }

    const tuneMatch = cmd.match(/^tune\s+LV\s*=\s*(\d+)$/i);
    if (tuneMatch) {
        const newLevel = parseInt(tuneMatch[1], 10);
        if (isNaN(newLevel) || newLevel < 1) { showToast('等级不能小于1'); return; }
        if (newLevel > EXP_CAP_LEVEL) { showToast(`等级不能大于${EXP_CAP_LEVEL}`); return; }
        const ch = getCurrentChar();
        ch.level = newLevel;
        ch.exp = 0;
        showToast(`已设置 ${ch.name} 等级为 ${ch.level}，经验值已重置。`);
        return;
    }

    showToast('指令格式错误！\n可用指令：\nST summon（切换自然生成）\n/bm 区块号\n/tune LV = 等级\n/summon 数量 生物名 [区块号] [~~~HP=数字~武器名]\n/kill\n/give ...\n/image 物品名(或ID) = 物品名(或ID)（替换贴图）');
}

function summonEnemies(count, type, targetChunk, customHP, customWeapon) {
    if (count <= 0 || count > 100) {
        showToast('数量应为 1 到 100 之间');
        return;
    }
    if (type !== 'block' && type !== 'black') {
        showToast('生物名只能是 block（红色敌人）或 black（黑色敌人）');
        return;
    }
    const enemyType = type === 'block' ? 'red' : 'black';
    let minX, maxX;
    if (targetChunk !== undefined) {
        if (targetChunk < 0 || targetChunk >= MAP_CHUNKS) {
            showToast('区块号超出范围 (0-' + (MAP_CHUNKS-1) + ')');
            return;
        }
        minX = targetChunk * CHUNK_SIZE;
        maxX = (targetChunk + 1) * CHUNK_SIZE - ENEMY_W;
    } else {
        minX = player.x - 200;
        maxX = player.x + player.w + 200;
        if (minX < 0) minX = 0;
        if (maxX > WORLD_W - ENEMY_W) maxX = WORLD_W - ENEMY_W;
        if (maxX <= minX) maxX = minX + 100;
    }
    const groundY = WORLD_H - ENEMY_H - GROUND_Y_OFFSET;
    let spawned = 0;
    for (let i = 0; i < count; i++) {
        let x = minX + Math.random() * (maxX - minX);
        x = Math.min(maxX, Math.max(minX, x));
        let overlap = true;
        let attempts = 0;
        while (overlap && attempts < 10) {
            overlap = false;
            if (Math.abs(x - player.x) < 40) {
                overlap = true;
                x = minX + Math.random() * (maxX - minX);
                attempts++;
            }
        }
        const enemy = {
            x: x, y: groundY, w: ENEMY_W, h: ENEMY_H,
            hp: customHP || ENEMY_HP,
            maxHp: customHP || ENEMY_HP,
            stun: 0, type: enemyType,
            lastAttack: 0, hitFlash: 0, facing: 1,
            summoned: true,
            weaponId: customWeapon || null,
            weaponDamageBonus: 0,
            weaponRange: 0,
            aiState: 'idle',
            moveTargetX: x,
            moveTargetY: groundY,
            _meleeLastAttack: 0,
            // 状态系统（GPU 计算用）
            stateFlags: STATE_FLAGS.NONE,
            stateParams: new Float32Array(8),
            stateTimers: new Float32Array(8),
            camp: CAMP.ENEMY,
            targetEnemy: null,
            attackSpeedMult: 1.0,
            baseSpeed: ENEMY_SPD,
            charmedUntil: 0,
            frozenUntil: 0,
            slowLevel: 0,
            slowLastDecay: performance.now(),
            fireLevel: 0,
            fireLastDamage: performance.now(),
            fireLastDecay: performance.now(),
            lightningLevel: 0,
            lightningTimer: 0,
            lightningDuration: LIGHTNING_DECAY_INTERVAL,
            lightningLastDamage: performance.now(),
            lightningLastDecay: performance.now(),
            blackholeLevel: 0,
            blackholeLastDamage: performance.now(),
            weakLevel: 0,
            weakLastDecay: performance.now(),
            controlledByPet: false,
            suspended: false,
            suspendStartTime: 0,
            suspendTargetY: 0,
            suspendOriginalY: 0,
            canBeDamaged: true,
            hasPermanentSlow: false,
            _speedMult: 1,
            _moveDir: 0,
            _rawSpeed: 0,
            _lastLightningUpdate: performance.now(),
            _lastLightningDurationUpdate: performance.now(),
            // 魅惑相关
            isCharmed: false,
            charmTarget: null,
            charmLastAttack: 0
        };
        if (enemy.weaponId && WEAPONS[enemy.weaponId]) {
            const weapon = WEAPONS[enemy.weaponId];
            enemy.weaponDamageBonus = weapon.damageBonus || 0;
            if (weapon.type === 'ranged') {
                const rangeMap = { firewand: 450, compoundBow: 500, blackholeStaff: 500 };
                enemy.weaponRange = rangeMap[enemy.weaponId] || 400;
            } else {
                enemy.weaponRange = 40;
            }
        } else {
            enemy.weaponRange = 40;
        }
        enemy.color = enemyType === 'red' ? '#ff0000' : BLACK_ENEMY_COLOR;
        enemies.push(enemy);
        spawned++;
    }
    showToast(`成功召唤 ${spawned} 个 ${type === 'block' ? '红色敌人' : '黑色敌人'}${targetChunk !== undefined ? ' 在区块 ' + targetChunk : ' 在玩家附近'}${customHP ? `，血量 ${customHP}` : ''}${customWeapon ? `，武器 ${customWeapon}` : ''}`);
    if (typeof checkAchievements === 'function') checkAchievements();
}

// ---------- 复合弓预测辅助函数 ----------
function getCompoundBowPrediction(startX, startY, targetX, targetY, gravity, groundY) {
    let dx = targetX - startX;
    let dy = targetY - startY;
    let len = Math.hypot(dx, dy);
    if (len < 0.001) return null;
    let speed = 8;
    let vx = (dx / len) * speed;
    let vy = (dy / len) * speed;
    let simX = startX, simY = startY;
    let simVx = vx, simVy = vy;
    const dt = 0.05;
    const maxSteps = 400;
    let landX = simX, landY = simY;
    let hitEnemy = null;
    for (let i = 0; i < maxSteps; i++) {
        simX += simVx * dt;
        simVy += gravity * dt;
        simY += simVy * dt;
        let arrowRect = { x: simX - 6, y: simY - 6, w: 12, h: 12 };
        for (let e of enemies) {
            if (e.hp <= 0) continue;
            if (rectCollide(arrowRect, e)) {
                hitEnemy = e;
                return { x: e.x + e.w/2, y: e.y + e.h/2, hitEnemy: e };
            }
        }
        if (simY >= groundY) {
            landX = simX;
            landY = groundY;
            break;
        }
        if (simX < 0 || simX > WORLD_W) break;
    }
    return { x: landX, y: landY, hitEnemy: null };
}

// ---------- 更新复合弓瞄准 ----------
function updateCompoundBowAim() {
    if (!compoundBowCharging) return;
    let startX = player.x + player.w/2;
    let startY = player.y + player.h/2;
    let mouseWorldX = mouseScreenX + cameraX;
    let mouseWorldY = mouseScreenY;
    let dx = mouseWorldX - startX;
    let dy = mouseWorldY - startY;
    let facing = player.facing;
    if (dx * facing < 0) {
        dx = -dx;
        mouseWorldX = startX + dx;
    }
    compoundBowTargetX = mouseWorldX;
    compoundBowTargetY = mouseWorldY;
    let result = getCompoundBowPrediction(startX, startY, mouseWorldX, mouseWorldY, BRICK_GRAV, WORLD_H - GROUND_Y_OFFSET);
    if (result) {
        compoundBowPreviewX = result.x;
        compoundBowPreviewY = result.y;
        compoundBowHitEnemy = result.hitEnemy;
    }
}

// ---------- 复合弓发射 ----------
function fireCompoundBow() {
    if (!currentWeapon || !currentWeapon.isCompound) return;
    let startX = player.x + player.w/2;
    let startY = player.y + player.h/2;
    let targetX = compoundBowTargetX;
    let targetY = compoundBowTargetY;
    let dx = targetX - startX;
    let dy = targetY - startY;
    let len = Math.hypot(dx, dy);
    if (len < 0.001) {
        dx = player.facing * 100;
        dy = 0;
        len = 100;
    }
    let speed = 8;
    let vx = (dx / len) * speed;
    let vy = (dy / len) * speed;
    let baseDamage = getAttackDamage() + currentWeapon.damageBonus;
    if (boss) {
        baseDamage = Math.floor(baseDamage * (currentWeapon.bossMultiplier || 1));
    }
    let arrowImg = new Image();
    arrowImg.src = '../公用文件/图片/装备/武器/弓箭.png';
    projectiles.push({
        x: startX - 6, y: startY - 6,
        vx: vx, vy: vy,
        w: 12, h: 12,
        damage: baseDamage,
        isEnemy: false,
        isArrow: true,
        img: arrowImg,
        life: 120,
        hasHit: false,
        gravity: BRICK_GRAV
    });
    player.attacking = true;
    player.attackStart = performance.now();
    compoundBowCharging = false;
    compoundBowHitEnemy = null;
}

// ========== 神父服被动效果触发函数 ==========
function triggerPriestEffects(target, damageDealt) {
    if (!window.hasPriestRobes) return;
    if (!target || target.hp <= 0) return;
    const hasMask = window.hasClownMask;
    const now = performance.now();

    // 1. 说教（全场僵直）- 攻击非Boss敌人时触发
    if (target !== boss) {
        let preachChance = hasMask ? PRIEST_PREACH_MASKED : PRIEST_PREACH_CHANCE;
        if (Math.random() < preachChance) {
            for (let e of enemies) {
                if (e.hp > 0) {
                    e.stateFlags |= STATE_FLAGS.STUNNED;
                    e.stateTimers[7] = PRIEST_PREACH_DURATION;
                    e.stun = 60; // 兼容旧系统
                }
            }
            showInventoryMessage('📖 说教！全场敌人僵直4秒');
            if (typeof damageNumbers !== 'undefined') {
                damageNumbers.push({
                    x: target.x + target.w/2,
                    y: target.y - 30,
                    damage: '📖 说教！',
                    timer: 60,
                    color: '#ffdd44'
                });
            }
        }
    }

    // 2. 弥撒（单体魅惑）- 攻击非Boss敌人时触发
    if (target !== boss) {
        let massChance = hasMask ? PRIEST_MASS_MASKED : PRIEST_MASS_CHANCE;
        if (Math.random() < massChance) {
            target.stateFlags |= STATE_FLAGS.CHARMED;
            target.stateTimers[0] = PRIEST_MASS_DURATION;
            target.camp = CAMP.ALLY;
            target.isCharmed = true;
            target.charmedUntil = now + PRIEST_MASS_DURATION;
            target.attackSpeedMult = PRIEST_CHARM_SPEED_MIN + Math.random() * (PRIEST_CHARM_SPEED_MAX - PRIEST_CHARM_SPEED_MIN);
            // 清除旧目标，让AI重新选择
            target.charmTarget = null;
            showInventoryMessage('⛪ 弥撒！敌人被魅惑10秒');
            if (typeof damageNumbers !== 'undefined') {
                damageNumbers.push({
                    x: target.x + target.w/2,
                    y: target.y - 30,
                    damage: '⛪ 魅惑！',
                    timer: 60,
                    color: '#ff66ff'
                });
            }
        }
    }

    // 3. Boss 战专属：跳过回合
    if (target === boss) {
        if (Math.random() < PRIEST_BOSS_SKIP_CHANCE) {
            boss.skipTurn = true;
            showInventoryMessage('👑 Boss 被神父震慑，跳过一回合！');
            if (typeof damageNumbers !== 'undefined') {
                damageNumbers.push({
                    x: boss.x + boss.w/2,
                    y: boss.y - 30,
                    damage: '👑 跳过！',
                    timer: 60,
                    color: '#ff8844'
                });
            }
        }
    }
}

// ========== 魅惑敌人AI（更新敌人时调用） ==========
function updateCharmedEnemy(enemy, now) {
    if (!enemy.isCharmed || enemy.camp !== CAMP.ALLY) {
        // 检查是否应该结束魅惑
        if (enemy.stateTimers[0] <= 0 && enemy.isCharmed) {
            enemy.isCharmed = false;
            enemy.camp = CAMP.ENEMY;
            enemy.attackSpeedMult = 1.0;
            enemy.charmTarget = null;
            enemy.stateFlags &= ~STATE_FLAGS.CHARMED;
        }
        return;
    }

    // 检查魅惑是否到期
    if (enemy.stateTimers[0] <= 0) {
        enemy.isCharmed = false;
        enemy.camp = CAMP.ENEMY;
        enemy.attackSpeedMult = 1.0;
        enemy.charmTarget = null;
        enemy.stateFlags &= ~STATE_FLAGS.CHARMED;
        return;
    }

    // 寻找目标（其他敌人）
    if (!enemy.charmTarget || enemy.charmTarget.hp <= 0) {
        let nearest = null;
        let minDist = Infinity;
        for (let e of enemies) {
            if (e === enemy || e.camp === CAMP.ALLY || e.hp <= 0) continue;
            let dx = (e.x + e.w/2) - (enemy.x + enemy.w/2);
            let dy = (e.y + e.h/2) - (enemy.y + enemy.h/2);
            let dist = Math.hypot(dx, dy);
            if (dist < minDist) {
                minDist = dist;
                nearest = e;
            }
        }
        enemy.charmTarget = nearest;
    }

    if (!enemy.charmTarget) return;

    let target = enemy.charmTarget;
    let dx = (target.x + target.w/2) - (enemy.x + enemy.w/2);
    let dy = (target.y + target.h/2) - (enemy.y + enemy.h/2);
    let dist = Math.hypot(dx, dy);

    // 检测目标是否被其他敌人保护（其他敌人不攻击魅惑单位）
    // 这个逻辑在 updateEnemies 中处理

    if (dist < 50) {
        // 攻击目标（使用冷却）
        let cooldown = enemy.type === 'black' ? BLACK_ENEMY_ATTACK_COOLDOWN : ENEMY_RANGED_ATTACK_COOLDOWN;
        cooldown *= enemy.attackSpeedMult;
        if (now - enemy.charmLastAttack > cooldown) {
            // 造成伤害
            let damage = 10 + (enemy.weaponDamageBonus || 0);
            Dot.deal(target, damage);
            target.hitFlash = 5;
            enemy.charmLastAttack = now;
            if (typeof damageNumbers !== 'undefined') {
                damageNumbers.push({
                    x: target.x + target.w/2,
                    y: target.y - 15,
                    damage: damage,
                    timer: 30,
                    color: '#ff66ff'
                });
            }
        }
    } else {
        // 向目标移动
        let speed = ENEMY_SPD * enemy.attackSpeedMult * 1.2;
        if (dx > 0) enemy.facing = 1;
        else if (dx < 0) enemy.facing = -1;
        enemy.x += (dx / dist) * speed;
        enemy.y += (dy / dist) * speed;
        enemy.x = Math.min(Math.max(0, enemy.x), WORLD_W - enemy.w);
        enemy.y = Math.min(Math.max(0, enemy.y), WORLD_H - enemy.h);
    }
}

// 优化清单第 18 条：补触屏输入。左半屏为虚拟方向键（按下后左右滑动），
// 右半屏轻点=攻击、上滑=跳跃；一律通过派发 KeyboardEvent 复用既有键盘输入路径，
// 避免再写一套移动/跳跃逻辑造成双份维护。
(function initTouchControls() {
    if (!('ontouchstart' in window)) return;
    const TOUCH_DEAD_ZONE = 18;
    const SWIPE_JUMP_PX = 40;
    let moveTouch = null;
    let moveOriginX = 0;
    let dir = 0;
    let actTouch = null;
    let actOriginY = 0;
    let actSwiped = false;

    function panelBlocked() {
        return !!(window.gachaPanelOpen || window.petPanelOpen || window.gamePanelOpen ||
            window.shopPanelOpen || window.codeEditorOpen || characterPanelOpen ||
            talentOpen || achievementOpen || victory || gameOver);
    }

    function pressKey(code, type) {
        window.dispatchEvent(new KeyboardEvent(type, { code: code, bubbles: true }));
    }

    function applyDir(next) {
        if (next === dir) return;
        if (dir === -1) pressKey('KeyA', 'keyup');
        if (dir === 1) pressKey('KeyD', 'keyup');
        dir = next;
        if (dir === -1) pressKey('KeyA', 'keydown');
        if (dir === 1) pressKey('KeyD', 'keydown');
    }

    document.addEventListener('touchstart', function (ev) {
        if (panelBlocked()) return;
        ev.preventDefault();
        for (const t of ev.changedTouches) {
            if (moveTouch === null && t.clientX < window.innerWidth * 0.5) {
                moveTouch = t.identifier;
                moveOriginX = t.clientX;
                applyDir(0);
            } else if (actTouch === null) {
                actTouch = t.identifier;
                actOriginY = t.clientY;
                actSwiped = false;
            }
        }
    }, { passive: false });

    document.addEventListener('touchmove', function (ev) {
        for (const t of ev.changedTouches) {
            if (t.identifier === moveTouch) {
                const dx = t.clientX - moveOriginX;
                applyDir(Math.abs(dx) < TOUCH_DEAD_ZONE ? 0 : (dx < 0 ? -1 : 1));
            } else if (t.identifier === actTouch) {
                if (actOriginY - t.clientY > SWIPE_JUMP_PX) actSwiped = true;
            }
        }
    }, { passive: true });

    document.addEventListener('touchend', function (ev) {
        for (const t of ev.changedTouches) {
            if (t.identifier === moveTouch) {
                applyDir(0);
                moveTouch = null;
            } else if (t.identifier === actTouch) {
                if (actSwiped) {
                    pressKey('Space', 'keydown');
                    setTimeout(function () { pressKey('Space', 'keyup'); }, 60);
                } else if (typeof performWeaponAttack === 'function') {
                    performWeaponAttack();
                }
                actTouch = null;
            }
        }
    }, { passive: true });

    document.addEventListener('touchcancel', function () {
        applyDir(0);
        moveTouch = null;
        actTouch = null;
    }, { passive: true });
})();

function updateCollision() {
    let allEntities = [player, ...enemies.filter(e => !e.inMergeGroup)];
    if (boss) allEntities.push(boss);
    const ITER = 12;
    for (let iter = 0; iter < ITER; iter++) {
        for (let i = 0; i < allEntities.length; i++) {
            for (let j = i+1; j < allEntities.length; j++) {
                let a = allEntities[i], b = allEntities[j];
                let overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
                let overlapY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
                if (overlapX > 0 && overlapY > 0) {
                    let dx = overlapX / 2;
                    if (a.x < b.x) { a.x -= dx; b.x += dx; } else { a.x += dx; b.x -= dx; }
                }
            }
        }
        for (let e of allEntities) e.x = Math.min(Math.max(0, e.x), WORLD_W - e.w);
    }
}

// ---------- 玩家移动 ----------
function updatePlayerMovement() {
    if (player.lockMovement) return;

    if (left && !right) player.facing = -1;
    else if (right && !left) player.facing = 1;
    let baseSpeed = 2.8;
    let speed = baseSpeed * (talentSpeedMult || 1);
    if (window.hasClownMask) {
        speed *= CLOWN_MASK_MULTIPLIER;
    }
    let dx = 0;
    if (left) dx -= speed;
    if (right) dx += speed;
    player.x = Math.min(Math.max(0, player.x + dx), WORLD_W - player.w);
    // ===== 近战突进：逐帧插值推进到目标点，到达即止，不穿墙不穿怪 =====
    if (player.dashRemaining > 0) {
        let step = Math.min(player.dashRemaining, 5);
        let nx = player.x + player.dashDir * step;
        if (player.dashDir > 0) nx = Math.min(nx, player.dashTargetX);
        else nx = Math.max(nx, player.dashTargetX);
        nx = Math.min(Math.max(0, nx), WORLD_W - player.w);
        let blocked = false;
        for (let e of enemies) {
            if (e.hp <= 0) continue;
            if (rectCollide({x: nx, y: player.y, w: player.w, h: player.h}, e)) { blocked = true; break; }
        }
        if (!blocked && boss && rectCollide({x: nx, y: player.y, w: player.w, h: player.h}, boss)) blocked = true;
        if (!blocked) player.x = nx;
        player.dashRemaining -= step;
        if (player.dashRemaining < 0) player.dashRemaining = 0;
        if (blocked) player.dashRemaining = 0;
    }
    player.vy += GRAVITY;
    // 冰霜之翼滑翔：装备且按住跳跃键、处于下落状态时缓降 + 水平微调 + 拖尾
    if (window.hasIceWings && jumpHeld && player.vy > 0 && player.y < getGroundY() - 0.001) {
        window.gliding = true;
        player.vy = player.vy * 0.3;
        if (Math.random() < 0.6) {
            if (!window.iceTrail) window.iceTrail = [];
            window.iceTrail.push({x: player.x + player.w/2 + (Math.random()*8-4), y: player.y + player.h, vy: 0.4 + Math.random()*0.5, life: 1});
        }
    } else {
        window.gliding = false;
    }
    player.y += player.vy;
    let grounded = false;
    if (player.y > getGroundY()) { player.y = getGroundY(); player.vy = 0; grounded = true; }
    if (player.y < 0) { player.y = 0; player.vy = 0; }
    if (grounded || player.y >= getGroundY()-0.001) {
        jumpUsed = false;
        player.jumpsLeft = talentTripleJump ? 3 : 2;
    }
    let duck = shiftDown || arrowDown;
    let targetH = (grounded && duck) ? DUCK_H : STAND_H;
    if (targetH !== player.h) {
        let oldBottom = player.y + player.h;
        player.h = targetH;
        if (grounded) player.y = getGroundY();
        else player.y = oldBottom - player.h;
    }
}

// ---------- 攻击函数（含跳跃限制） ----------
function performWeaponAttack() {
    let groundY = getGroundY();
    let isGrounded = player.y >= groundY - 0.5;
    if (!isGrounded) {
        if (!currentWeapon || currentWeapon.type === 'melee') {
            showInventoryMessage('跳跃中无法使用近战攻击');
            return;
        }
    }
    let hitTarget = null;
    let dealtDamage = 0;

    if (currentWeapon && currentWeapon.attack && !currentWeapon.isCompound) {
        // 这里需要捕获攻击目标用于神父服效果
        // 由于各个武器的攻击函数不同，我们通过修改攻击函数来记录目标
        // 或者直接在武器攻击后调用 triggerPriestEffects
        currentWeapon.attack();
        // 获取最后一个被攻击的敌人（简化处理）
        for (let e of enemies) {
            if (e.hitFlash > 0) {
                hitTarget = e;
                break;
            }
        }
        if (hitTarget) {
            dealtDamage = getAttackDamage() + (currentWeapon.damageBonus || 0);
            triggerPriestEffects(hitTarget, dealtDamage);
            triggerIceWingsFreeze(hitTarget);
        }
    } else if (currentWeapon && currentWeapon.isCompound) {
        showInventoryMessage('左键蓄力发射复合弓箭矢');
    } else {
        // ===== 预备动作：攻击前短暂蓄力前摇（windup） =====
        const _wNow = performance.now();
        if (!player._windup) {
            player._windup = { start: _wNow, dur: WINDUP_MS, facing: player.facing };
            player.attacking = true;
            player.attackStart = _wNow;
            playSfx('windup', 0.16);
            return;
        }
        // 前摇推进由 updateMeleeWindup 处理，到期后执行 performMeleeSwing
        return;
    }
}

// ---------- 近战打击感：时间缩放 / 残影 / 突进 / 震动 / 冲击波 / 音效 / 前摇 ----------
// 统一节奏系数：新增特效时长统一乘以该系数（0.65 更利落，0.45 更绵长，二选一）
const EFFECT_RHYTHM = 0.65;
window._gameTimeScale = 1.0;
window._gameTimeScaleTimer = 0;
window._slashTrailTimer = 0;
window._slashTrailX = 0;
window._slashTrailY = 0;
