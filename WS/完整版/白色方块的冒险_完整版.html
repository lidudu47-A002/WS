<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>白色方块的冒险 · 完整版</title>
<style>
/* ===== 公用文件/css/style.css ===== */
/* ============================================
   全局设计系统 — 黑屋/监狱
   原则：简洁 · 清晰 · 有温度
   ============================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

:root {
    --bg-primary: #0a0a0f;
    --bg-panel: rgba(16, 18, 26, 0.92);
    --bg-card: rgba(255, 255, 255, 0.04);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(255, 215, 0, 0.25);
    --text-primary: #f0f0f0;
    --text-secondary: rgba(255, 255, 255, 0.6);
    --text-muted: rgba(255, 255, 255, 0.3);
    --gold: #ffd700;
    --gold-dim: rgba(255, 215, 0, 0.15);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-panel: 0 16px 60px rgba(0, 0, 0, 0.8);
    --transition: 0.2s ease;
}

body {
    background: var(--bg-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
    color: var(--text-primary);
}

.game-wrapper {
    position: relative;
}

canvas {
    display: block;
    width: min(95vw, 800px);
    height: auto;
    aspect-ratio: 800 / 400;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    cursor: crosshair;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
}

/* ===== 游戏内消息浮层 ===== */
.save-message,
.respawn-message,
.load-message {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 1rem;
    font-weight: 500;
    padding: 10px 24px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
    z-index: 25;
    pointer-events: none;
    display: none;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
}
.save-message { color: #ffd700; border-color: rgba(255, 215, 0, 0.2); }
.respawn-message { color: #ff9f43; border-color: rgba(255, 159, 67, 0.2); }
.load-message { color: #2ecc71; border-color: rgba(46, 204, 113, 0.2); }

/* ===== 胜利消息 ===== */
.victory-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-size: 4.5rem;
    font-weight: 700;
    text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
    z-index: 20;
    pointer-events: none;
    display: none;
    letter-spacing: 4px;
}

/* ===== 下一页按钮（黑屋通关后显示） ===== */
#nextMapBtn {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #2a6d4c, #1e8b5a);
    color: #fff;
    padding: 12px 32px;
    border-radius: 30px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 20px rgba(46, 204, 113, 0.3);
    transition: all var(--transition);
    display: none;
    z-index: 30;
    letter-spacing: 0.5px;
}
#nextMapBtn:hover {
    transform: translateX(-50%) scale(1.03);
    box-shadow: 0 6px 30px rgba(46, 204, 113, 0.4);
}
#nextMapBtn:active {
    transform: translateX(-50%) scale(0.97);
}

/* ===== 自定义滚动条 ===== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 215, 0, 0.5); }
/* ===== 公用文件/css/status-panel.css ===== */
/* ============================================
   状态面板 (按 F 打开)
   原则：清晰 · 易读 · 不打扰
   ============================================ */

.status-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-panel);
    color: var(--text-primary);
    padding: 0;
    z-index: 30;
    display: none;
    overflow: hidden;
    animation: panelSlideIn 0.25s ease-out;
}

@keyframes panelSlideIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.status-panel-header {
    padding: 20px 24px 12px 24px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.status-panel-header h2 {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.5px;
    margin: 0;
}

.status-panel-close {
    color: var(--text-muted);
    font-size: 1.2rem;
    cursor: pointer;
    transition: color var(--transition);
    line-height: 1;
}
.status-panel-close:hover {
    color: #fff;
}

.status-panel-body {
    padding: 16px 24px 24px 24px;
}

.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

.status-row:last-child {
    border-bottom: none;
}

.status-label {
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 400;
}

.status-value {
    color: var(--text-primary);
    font-weight: 600;
    font-size: 0.95rem;
}

.status-value.gold {
    color: var(--gold);
}
.status-value.highlight {
    color: #5dade2;
}
.status-value.damage {
    color: #f1948a;
}

.status-panel-footer {
    padding: 12px 24px 18px 24px;
    border-top: 1px solid var(--border-subtle);
    text-align: center;
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.3px;
}
/* ===== 公用文件/css/shop.css ===== */
/* ============================================
   商店面板 (按 H 打开) + 确认弹窗
   原则：专注 · 优雅 · 反馈清晰
   ============================================ */

.shop-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(12px);
    z-index: 200;
    display: none;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.25s ease-out;
}

@keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
}

.shop-content {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    padding: 32px 36px 28px 36px;
    width: 90%;
    max-width: 640px;
    border: 1px solid rgba(255, 215, 0, 0.15);
    box-shadow: var(--shadow-panel);
    position: relative;
    animation: shopSlide 0.3s ease-out;
}

@keyframes shopSlide {
    0% { opacity: 0; transform: translateY(20px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.shop-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.shop-header h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.5px;
    margin: 0;
}

.shop-header .close-shop-btn {
    color: var(--text-muted);
    font-size: 1.4rem;
    cursor: pointer;
    transition: color var(--transition);
    background: none;
    border: none;
    padding: 4px 8px;
}
.shop-header .close-shop-btn:hover {
    color: #fff;
}

.shop-subtitle {
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
}

/* 老板装饰 - 缩小一点更精致 */
.boss-image {
    position: absolute;
    bottom: 16px;
    right: 20px;
    width: 80px;
    height: 80px;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDY0IDY0Ij48dGV4dCB4PSIzMi4wIiB5PSIzMi4wIiBmb250LXNpemU9IjYwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0iY2VudHJhbCIgZm9udC1mYW1pbHk9IlNlZ29lIFVJIEVtb2ppLEFwcGxlIENvbG9yIEVtb2ppLE5vdG8gQ29sb3IgRW1vamksc2Fucy1zZXJpZiI+4p2TPC90ZXh0Pjwvc3ZnPg==");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    pointer-events: none;
    opacity: 0.6;
    filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.15));
}

/* 商品卡片 */
.items-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    margin: 4px 0 20px 0;
}

.shop-item-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 20px 16px 16px 16px;
    width: 150px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    border: 1px solid var(--border-subtle);
    position: relative;
}

.shop-item-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 215, 0, 0.3);
    background: rgba(255, 255, 255, 0.07);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
}

.shop-item-card:active {
    transform: scale(0.97);
}

.shop-item-icon img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
}

.shop-item-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
}

.shop-item-price {
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 500;
}

.shop-item-card .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #2a6d4c;
    color: #fff;
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
}

/* 确认弹窗 */
.confirm-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 300;
    animation: fadeIn 0.2s ease-out;
}

.confirm-content {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    padding: 32px 36px 28px 36px;
    text-align: center;
    width: 320px;
    border: 1px solid rgba(255, 215, 0, 0.12);
    box-shadow: var(--shadow-panel);
    animation: shopSlide 0.25s ease-out;
}

.confirm-icon img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    margin-bottom: 12px;
    filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.3));
}

.confirm-text {
    font-size: 1.1rem;
    font-weight: 500;
    margin: 4px 0 20px 0;
    color: var(--text-primary);
}

.confirm-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.confirm-buy,
.confirm-cancel {
    padding: 10px 28px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    border: none;
    transition: all var(--transition);
}

.confirm-buy {
    background: linear-gradient(135deg, #ffd700, #f0c000);
    color: #1a1a1a;
    box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25);
}
.confirm-buy:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 30px rgba(255, 215, 0, 0.35);
}
.confirm-buy:active {
    transform: scale(0.97);
}

.confirm-cancel {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
}
.confirm-cancel:hover {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
}

/* ===== 单文件附加样式 ===== */
html, body { overscroll-behavior: none; }
#gameCanvas { touch-action: none; }
#wsBadge {
    position: fixed; left: 12px; bottom: 12px; z-index: 9998;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px;
    background: rgba(16, 18, 26, .86); border: 1px solid rgba(255, 215, 0, .35);
    color: #ffd700; font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 12px;
    letter-spacing: .5px; user-select: none; backdrop-filter: blur(6px);
}
#wsBadge a { color: #9aa4b2; text-decoration: none; padding: 2px 8px; border-radius: 999px; }
#wsBadge a:hover { color: #ffd700; background: rgba(255, 215, 0, .1); }
#wsBadge a.on { color: #0a0a0f; background: #ffd700; }

</style>
</head>

<script>
/* =====================================================================
 * 单文件兼容层（完整版专用）
 *  1) 图片：全部换成内联 SVG(矢量+emoji) 的 data URI，任何 <img src>/new Image()
 *     的赋值都会被重写；未命中映射的资源回退占位图标，杜绝裂图与 404。
 *  2) 音乐：不打包，所有音频地址被替换为静音 data URI。
 *  3) 跳转：终局“进森林”、BOSS 战入口改为页内处理，不再离开本文件。
 * ===================================================================== */

<script>
/* ================= 公用文件/js/storage-keys.js ================= */
// ========== storage-keys.js ==========
// 全项目存储键名的唯一来源。任何模块禁止再手写 'ws_users' / 'ws_token' 等字符串。
// 加载顺序：必须在 auth.js / admin.js / game-state.js / config.js 之前。
// 修复要点（对照优化清单第 1、2 条）：
//   旧版 game-state.js 读 'ws_current_user' / 'ws_accounts'，而 auth.js 写 'ws_token' / 'ws_users'，
//   两个键名都不存在，导致 canUserSave() 永远返回 true（管理员"禁止存档"权限失效）。

(function (global) {
    'use strict';

    var KEYS = Object.freeze({
        USERS: 'ws_users',                    // localStorage：用户表
        TOKEN: 'ws_token',                    // sessionStorage：登录令牌
        PENDING_SAVE: 'ws_pending_save',      // localStorage：待导入存档
        SAVE: 'black_room_prison_save'        // localStorage：游戏主存档
    });

    // 已废弃的旧键名，仅用于启动期迁移
    var LEGACY = Object.freeze({
        ACCOUNTS: 'ws_accounts',
        CURRENT_USER: 'ws_current_user'
    });

    function utf8ToB64(str) {
        return btoa(unescape(encodeURIComponent(str)));
    }

    function b64ToUtf8(str) {
        return decodeURIComponent(escape(atob(str)));
    }

    // 读取当前登录会话（统一入口，替代各处手写 ws_token 解码）
    function readSession() {
        var raw = null;
        try { raw = sessionStorage.getItem(KEYS.TOKEN); } catch (e) { return null; }
        if (!raw) return null;
        try {
            var data = JSON.parse(b64ToUtf8(raw));
            if (!data || typeof data !== 'object') return null;
            if (data.exp && data.exp < Date.now()) return null;
            return data;
        } catch (e) {
            return null;
        }
    }

    // 是否允许存档：未登录视为单机/游客，不限制；已登录以 token 内 canSave 为准
    function canSave() {
        var session = readSession();
        if (!session) return true;
        return session.canSave !== false;
    }

    function writeSession(data) {
        try {
            sessionStorage.setItem(KEYS.TOKEN, utf8ToB64(JSON.stringify(data)));
            return true;
        } catch (e) {
            return false;
        }
    }

    function readUsers() {
        try {
            return JSON.parse(localStorage.getItem(KEYS.USERS) || '{}') || {};
        } catch (e) {
            return {};
        }
    }

    function writeUsers(users) {
        try {
            localStorage.setItem(KEYS.USERS, JSON.stringify(users));
            return true;
        } catch (e) {
            return false;
        }
    }

    // 启动期自检：发现旧键名时自动迁移到当前键名（不删除旧数据，便于回滚）
    function migrateLegacy() {
        var report = [];
        try {
            var legacyUsers = localStorage.getItem(LEGACY.ACCOUNTS);
            if (legacyUsers && !localStorage.getItem(KEYS.USERS)) {
                localStorage.setItem(KEYS.USERS, legacyUsers);
                report.push('已迁移用户表：' + LEGACY.ACCOUNTS + ' → ' + KEYS.USERS);
            }
            var legacySession = sessionStorage.getItem(LEGACY.CURRENT_USER);
            if (legacySession && !sessionStorage.getItem(KEYS.TOKEN)) {
                var users = readUsers();
                var user = users[legacySession];
                if (user) {
                    writeSession({
                        username: legacySession,
                        role: user.role || 'user',
                        canSave: user.canSave !== false,
                        exp: Date.now() + 24 * 3600000
                    });
                    report.push('已迁移登录态：' + LEGACY.CURRENT_USER + ' → ' + KEYS.TOKEN);
                }
            }
        } catch (e) {
            report.push('存储自检失败：' + (e && e.message ? e.message : e));
        }
        if (report.length && typeof console !== 'undefined' && console.warn) {
            console.warn('[storage-keys] ' + report.join(' / '));
        }
        return report;
    }

    global.WS_KEYS = KEYS;
    global.WS_STORAGE = {
        KEYS: KEYS,
        LEGACY: LEGACY,
        readSession: readSession,
        canSave: canSave,
        writeSession: writeSession,
        readUsers: readUsers,
        writeUsers: writeUsers,
        migrateLegacy: migrateLegacy,
        utf8ToB64: utf8ToB64,
        b64ToUtf8: b64ToUtf8
    };

    migrateLegacy();
})(window);

</script>

(function () {
    if (typeof window.showToast === 'function') return;

    var COLORS = {
        error: 'rgba(178,44,44,0.94)',
        warn: 'rgba(170,120,20,0.94)',
        info: 'rgba(32,32,40,0.94)',
        ok: 'rgba(28,110,60,0.94)'
    };

    function ensureHost() {
        var host = document.getElementById('wsToastHost');
        if (host) return host;
        host = document.createElement('div');
        host.id = 'wsToastHost';
        host.style.cssText = 'position:fixed;left:50%;bottom:14%;transform:translateX(-50%);' +
            'z-index:99999;display:flex;flex-direction:column;align-items:center;gap:6px;' +
            'pointer-events:none;font:14px/1.6 "Microsoft YaHei",Arial,sans-serif;';
        (document.body || document.documentElement).appendChild(host);
        return host;
    }

    function showToast(msg, type) {
        var text = (msg === null || msg === undefined) ? '' : String(msg);
        try {
            var host = ensureHost();
            var el = document.createElement('div');
            el.style.cssText = 'max-width:72vw;padding:8px 14px;border-radius:8px;color:#fff;' +
                'background:' + (COLORS[type] || COLORS.info) +
                ';box-shadow:0 4px 14px rgba(0,0,0,0.35);white-space:pre-wrap;' +
                'text-align:center;opacity:0;transition:opacity .18s ease;';
            el.textContent = text;
            host.appendChild(el);
            requestAnimationFrame(function () { el.style.opacity = '1'; });
            var life = Math.min(6000, 1600 + text.length * 40);
            setTimeout(function () {
                el.style.opacity = '0';
                setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
            }, life);
        } catch (err) {
            // 极端情况下（headless / 无 body）退回控制台，绝不阻塞主循环
            console.log('[toast] ' + text);
        }
    }

    window.showToast = showToast;
})();

// ========== 图片加载失败自动回退到占位符 ==========
(function() {
    const PLACEHOLDER = '../公用文件/图片/其他/占位符.png';
    // 优化清单第 24 条：回退到占位符时必须留痕，否则资源缺失会被静默吞掉；?debug=1 时升级为 error 便于排查。
    const WS_DEBUG = /[?&](debug|dev)=1/i.test(window.location.search);
    function reportMissing(src) {
        console.warn('[image-helper] 图片加载失败，已回退占位符：', src);
        if (WS_DEBUG) console.error('[image-helper][dev] 资源缺失：', src);
    }
    const _Image = window.Image;
    const srcDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');

    function PatchedImage(w, h) {
        const img = new _Image(w, h);
        let _src = '';
        let _tried = false;

        Object.defineProperty(img, 'src', {
            get: function() { return _src; },
            set: function(val) {
                _src = val;
                _tried = false;
                srcDesc.set.call(img, val);
            },
            configurable: true
        });

        img.addEventListener('error', function() {
            if (_tried) return;
            _tried = true;
            reportMissing(_src);
            _src = PLACEHOLDER;
            srcDesc.set.call(img, PLACEHOLDER);
        });

        return img;
    }
    // 图片缓存：同一 src 只创建一个 Image，避免渲染循环里每帧新建
    const _imageCache = new Map();
    window.getCachedImage = function(src) {
        let img = _imageCache.get(src);
        if (!img) {
            img = new _Image();
            img.src = src;
            _imageCache.set(src, img);
        }
        return img;
    };

    PatchedImage.prototype = _Image.prototype;
    window.Image = PatchedImage;

    // DOM 中已有的 <img> 标签（商店、宠物面板等）
    document.addEventListener('error', function(e) {
        const t = e.target;
        if (t && t.tagName === 'IMG' && !t._placeholderTried) {
            t._placeholderTried = true;
            reportMissing(t.getAttribute('src'));
            t.src = PLACEHOLDER;
        }
    }, true);
})();
</script>

}

    };
    enemy.color = type === 'red' ? '#ff0000' : BLACK_ENEMY_COLOR;
    if (opts) {
        if (opts.hp !== undefined) { enemy.hp = opts.hp; enemy.maxHp = opts.hp; }
        if (opts.w !== undefined) { enemy.w = opts.w; enemy.h = opts.h; }
        if (opts.baseSpeed !== undefined) enemy.baseSpeed = opts.baseSpeed;
        if (opts.isSmall) {
            enemy.isSmall = true;
            enemy.inMergeGroup = false;
            enemy.spawnTime = performance.now();
        }
    }
    return enemy;
}

function spawnEnemyInChunk(chunkIdx, type) {
    let pts = chunkSpawnPoints[chunkIdx];
    if (!pts.length) return false;
    let sx = pts[Math.floor(Math.random()*pts.length)];
    let sy = WORLD_H - ENEMY_H - GROUND_Y_OFFSET;
    let enemy = buildEnemyObject(sx, sy, type);
    enemies.push(enemy);
    return true;
}

// ---------- small block 分裂与排队合成 ----------
let smallMergeGroup = [];
let smallMergeStart = 0;

function spawnSmallBlocksAt(ex, ey) {
    for (let i = 0; i < 2; i++) {
        let sb = buildEnemyObject(
            ex - SMALL_BLOCK_W / 2 + (i === 0 ? -9 : 9),
            ey - SMALL_BLOCK_H / 2,
            'red',
            { hp: SMALL_BLOCK_HP, w: SMALL_BLOCK_W, h: SMALL_BLOCK_H, baseSpeed: SMALL_BLOCK_SPD, isSmall: true }
        );
        sb.y = WORLD_H - SMALL_BLOCK_H - GROUND_Y_OFFSET;
        enemies.push(sb);
    }
}

function updateSmallMerge(now) {
    // 组员死亡/离场 → 打断合成，剩余散开重新排队
    if (smallMergeGroup.length > 0) {
        let alive = smallMergeGroup.filter(e => e && e.hp > 0 && enemies.indexOf(e) >= 0 && e.camp === CAMP.ENEMY);
        if (alive.length !== smallMergeGroup.length) {
            for (let e of smallMergeGroup) if (e) e.inMergeGroup = false;
            smallMergeGroup = [];
            smallMergeStart = 0;
            return;
        }
    }
    // 无合成组时，取最早生成的 3 个游离 small 开新组（同时仅 1 组）
    if (smallMergeGroup.length === 0) {
        let free = enemies.filter(e => e.isSmall && e.hp > 0 && e.camp === CAMP.ENEMY && !e.inMergeGroup);
        if (free.length >= SMALL_MERGE_TEAM) {
            free.sort((a, b) => (a.spawnTime || 0) - (b.spawnTime || 0));
            smallMergeGroup = free.slice(0, SMALL_MERGE_TEAM);
            for (let e of smallMergeGroup) e.inMergeGroup = true;
            smallMergeStart = now;
        }
        return;
    }
    // 向彼此中心点靠拢（途中跳过碰撞：碰撞系统已排除 inMergeGroup）
    let cx = 0, cy = 0;
    for (let e of smallMergeGroup) { cx += e.x + e.w / 2; cy += e.y + e.h / 2; }
    cx /= smallMergeGroup.length; cy /= smallMergeGroup.length;
    for (let e of smallMergeGroup) {
        let ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
        let dx = cx - ecx, dy = cy - ecy, len = Math.hypot(dx, dy);
        if (len > 0.01) {
            let step = Math.min(SMALL_MERGE_APPROACH_SPEED, len);
            e.x += (dx / len) * step;
            e.y += (dy / len) * step;
        }
    }
    // 前摇 1.5s 结束且组员全部存活 → 合成为 1 个满血普通 block
    if (now - smallMergeStart >= SMALL_MERGE_WINDUP_MS) {
        let bx = 0, by = 0;
        for (let e of smallMergeGroup) { bx += e.x + e.w / 2; by += e.y + e.h / 2; }
        bx /= smallMergeGroup.length; by /= smallMergeGroup.length;
        for (let e of smallMergeGroup) e.inMergeGroup = false;
        for (let e of smallMergeGroup) {
            let idx = enemies.indexOf(e);
            if (idx >= 0) enemies.splice(idx, 1);
        }
        smallMergeGroup = [];
        smallMergeStart = 0;
        let nb = buildEnemyObject(bx - ENEMY_W / 2, by - ENEMY_H / 2, 'red');
        nb.x = Math.min(Math.max(0, nb.x), WORLD_W - nb.w);
        nb.y = WORLD_H - ENEMY_H - GROUND_Y_OFFSET;
        enemies.push(nb);
    }
}

// 自然生成规则：red 两场景通用；black 由 scene-config.js 的 blackNaturalSpawn 决定
// （黑屋 false：黑屋禁止黑色敌人自然生成；监狱 true：允许 black 自然生成）
const NATURAL_SPAWN_RULES = [
    { type: 'red', last: redChunkLastSpawn, max: RED_ENEMY_MAX, intervals: [4000, 8000, 10000], countable: e => !e.isSmall && !e.summoned }
];
if ((window.WS_SCENE_CONFIG || {}).blackNaturalSpawn === true) {
    NATURAL_SPAWN_RULES.push({
        type: 'black', last: blackChunkLastSpawn, max: BLACK_ENEMY_MAX,
        intervals: [8000, 16000, 20000], countable: e => !e.summoned
    });
}

function capSpeedToLeader(list) {
    for (let i = 1; i < list.length; i++) {
        const prevSpeed = Math.abs(list[i - 1]._rawSpeed);
        if (prevSpeed < 0.01) continue;
        const curr = list[i];
        if (Math.abs(curr._rawSpeed) > prevSpeed) curr._rawSpeed = curr._rawSpeed > 0 ? prevSpeed : -prevSpeed;
    }
}

// 优化清单第 8 条：分离检测改为均匀网格，把每敌全表扫描 O(N²) 降为 O(N + N·k)。
// 网格每帧在移动阶段前重建一次；单帧位移远小于格子尺寸，沿用构建时的桶不会漏判。
const SEP_CELL = 64;
let _sepGrid = null;

function buildSeparationGrid() {
    const grid = new Map();
    for (const o of enemies) {
        if (o.inMergeGroup || !o.canBeDamaged) continue;
        const cx0 = Math.floor(o.x / SEP_CELL), cx1 = Math.floor((o.x + o.w) / SEP_CELL);
        const cy0 = Math.floor(o.y / SEP_CELL), cy1 = Math.floor((o.y + o.h) / SEP_CELL);
        for (let cx = cx0; cx <= cx1; cx++) {
            for (let cy = cy0; cy <= cy1; cy++) {
                const key = cx + ',' + cy;
                let bucket = grid.get(key);
                if (!bucket) { bucket = []; grid.set(key, bucket); }
                bucket.push(o);
            }
        }
    }
    return grid;
}

function separateFromEnemies(e, grid) {
    const g = grid || _sepGrid;
    if (!g) {
        for (let o of enemies) {
            if (o === e || o.inMergeGroup || !o.canBeDamaged) continue;
            if (rectCollide(e, o)) {
                if (e.x + e.w > o.x + o.w) e.x = o.x + o.w + 0.01;
                else if (e.x < o.x) e.x = o.x - e.w - 0.01;
            }
        }
        return;
    }
    const cx0 = Math.floor(e.x / SEP_CELL), cx1 = Math.floor((e.x + e.w) / SEP_CELL);
    const cy0 = Math.floor(e.y / SEP_CELL), cy1 = Math.floor((e.y + e.h) / SEP_CELL);
    for (let cx = cx0; cx <= cx1; cx++) {
        for (let cy = cy0; cy <= cy1; cy++) {
            const bucket = g.get(cx + ',' + cy);
            if (!bucket) continue;
            for (const o of bucket) {
                if (o === e || o.inMergeGroup || !o.canBeDamaged) continue;
                if (rectCollide(e, o)) {
                    if (e.x + e.w > o.x + o.w) e.x = o.x + o.w + 0.01;
                    else if (e.x < o.x) e.x = o.x - e.w - 0.01;
                }
            }
        }
    }
}


function updateEnemies(now) {
    let curChunk = Math.floor((player.x + player.w/2) / CHUNK_SIZE);
    // 优化清单第 7 条：原实现把同一个 count 放在 MAP_CHUNKS 内层循环里重复统计（每规则 20 次/帧），
    // 现改为每帧每类型只统计一次；生成成功后本地计数 +1，保持"总数不超过 rule.max"的语义不变。
    if (!window.stopNaturalSpawn) {
        const ruleMap = {};
        for (const rule of NATURAL_SPAWN_RULES) ruleMap[rule.type] = rule;
        const typeCounts = {};
        for (const e of enemies) {
            if (e.camp !== CAMP.ENEMY) continue;
            const rule = ruleMap[e.type];
            if (!rule || !rule.countable(e)) continue;
            typeCounts[e.type] = (typeCounts[e.type] || 0) + 1;
        }
        for (const rule of NATURAL_SPAWN_RULES) {
            let count = typeCounts[rule.type] || 0;
            if (count >= rule.max) continue;
            for (let ch = 0; ch < MAP_CHUNKS; ch++) {
                const interval = rule.intervals[Math.abs(ch - curChunk)] || 0;
                if (!interval || now - rule.last[ch] < interval) continue;
                if (spawnEnemyInChunk(ch, rule.type)) {
                    rule.last[ch] = now;
                    count++;
                }
            }
        }
    }
    // 黑屋禁止黑色敌人(black)自然生成：black 仅允许通过指令 summonEnemies 生成

    // 状态伤害和衰减
    for (let e of enemies) {
        if (e.controlledByPet) continue;
        if (e.isCharmed || e.camp === CAMP.ALLY) continue; // 魅惑敌人不受状态伤害（由AI控制）

        // 敌人每秒回复 1 HP（战斗中也持续生效）
        if (e.hp > 0 && e.hp < e.maxHp && now - (e.lastRegenAt || 0) >= 1000) {
            e.hp = Math.min(e.maxHp, e.hp + 1);
            e.lastRegenAt = now;
        }

        // 火焰
        if (e.fireLevel > 0) {
            let damagePerTick = FIRE_DAMAGE_BASE + (e.fireLevel - 1) * FIRE_DAMAGE_PER_LEVEL;
            if (now - e.fireLastDamage >= 1000) {
                if (e.canBeDamaged) e.hp -= damagePerTick;
                e.hitFlash = 5;
                e.fireLastDamage = now;
            }
            if (now - e.fireLastDecay >= FIRE_DECAY_INTERVAL) {
                e.fireLevel--;
                e.fireLastDecay = now;
            }
        }

        // 电离子
        if (e.lightningLevel > 0) {
            let interval = LIGHTNING_INTERVAL_BASE - (e.lightningLevel - 1) * LIGHTNING_INTERVAL_PER_LEVEL;
            interval = Math.max(500, interval);
            let damage = LIGHTNING_DAMAGE_BASE + (e.lightningLevel - 1) * LIGHTNING_DAMAGE_PER_LEVEL;
            let hasSlowOrFrozen = (e.slowLevel > 0 || e.frozenUntil > now);
            if (hasSlowOrFrozen) damage *= LIGHTNING_BONUS_MULTIPLIER;
            e.lightningTimer = (e.lightningTimer || 0) + (now - (e._lastLightningUpdate || now));
            e._lastLightningUpdate = now;
            if (e.lightningTimer >= interval) {
                e.lightningTimer = 0;
                if (e.canBeDamaged) {
                    e.hp -= Math.floor(damage);
                    e.hitFlash = 5;
                    if (typeof damageNumbers !== 'undefined') {
                        damageNumbers.push({
                            x: e.x + e.w/2,
                            y: e.y - 20,
                            damage: Math.floor(damage),
                            timer: 30,
                            color: '#aa88ff'
                        });
                    }
                }
            }
            if (e.lightningDuration === undefined) e.lightningDuration = LIGHTNING_DECAY_INTERVAL;
            e.lightningDuration -= (now - (e._lastLightningDurationUpdate || now));
            e._lastLightningDurationUpdate = now;
            if (e.lightningDuration <= 0) {
                e.lightningLevel--;
                e.lightningDuration = LIGHTNING_DECAY_INTERVAL;
                if (e.lightningLevel <= 0) {
                    e.lightningLevel = 0;
                    e.lightningTimer = 0;
                }
            }
        }

        // 黑洞
        if (e.blackholeLevel > 0) {
            let damage = 1 + (level - 1) + (e.blackholeLevel - 1);
            if (now - e.blackholeLastDamage >= BLACKHOLE_DAMAGE_INTERVAL) {
                if (e.canBeDamaged) e.hp -= damage;
                e.hitFlash = 5;
                e.blackholeLastDamage = now;
            }
        }

        // 减速衰减
        if (e.slowLevel > 0 && now - e.slowLastDecay >= SLOW_DECAY_INTERVAL) {
            e.slowLevel--;
            e.slowLastDecay = now;
        }

        // 虚弱衰减
        if (e.weakLevel > 0 && now - e.weakLastDecay >= WEAK_DECAY_INTERVAL) {
            e.weakLevel--;
            e.weakLastDecay = now;
        }

        // 速度计算
        let speedMult = 1;
        if (e.frozenUntil > now) speedMult = 0;
        else if (e.slowLevel > 0) {
            let slowPercent = SLOW_BASE + (e.slowLevel - 1) * SLOW_PER_LEVEL;
            speedMult = 1 - Math.min(slowPercent, 0.45);
        }
        if (e.hasPermanentSlow) speedMult *= 0.85;
        if (e.weakLevel > 0) {
            speedMult *= (1 - e.weakLevel * WEAK_SPEED_REDUCTION_PER_LEVEL);
        }
        e._speedMult = speedMult;
    }

    // 普通敌人AI
    for (let e of enemies) {
        if (e.inMergeGroup) continue;
        if (e.controlledByPet || e.suspended || e.stun > 0) continue;
        if (e.isCharmed || e.camp === CAMP.ALLY) continue;
        if (e.stateFlags & STATE_FLAGS.STUNNED) {
            e.stun = 60;
            continue;
        }

        let pc = player.x + player.w/2, ec = e.x + e.w/2;
        if (pc > ec) e._moveDir = 1;
        else if (pc < ec) e._moveDir = -1;
        else e._moveDir = 0;
        if (e._moveDir !== 0) e.facing = e._moveDir;
        e._rawSpeed = e._moveDir === 0 ? 0 : e.baseSpeed * e._speedMult * e._moveDir;
    }

    // 速度限制
    const leftEnemies = enemies.filter(e => e._moveDir === -1 && e.stun === 0 && !e.controlledByPet && !e.suspended && !e.isCharmed && e.camp === CAMP.ENEMY);
    const rightEnemies = enemies.filter(e => e._moveDir === 1 && e.stun === 0 && !e.controlledByPet && !e.suspended && !e.isCharmed && e.camp === CAMP.ENEMY);
    leftEnemies.sort((a, b) => a.x - b.x);
    rightEnemies.sort((a, b) => b.x - a.x);
    capSpeedToLeader(leftEnemies);
    capSpeedToLeader(rightEnemies);

    // 优化清单第 8 条：移动阶段前重建分离网格
    _sepGrid = buildSeparationGrid();

    // 移动
    for (let e of enemies) {
        if (e.inMergeGroup) {
            if (e.hitFlash > 0) e.hitFlash--;
            continue;
        }
        if (e.controlledByPet || e.suspended) {
            if (e.hitFlash > 0) e.hitFlash--;
            continue;
        }
        if (e.isCharmed || e.camp === CAMP.ALLY) continue;
        if (e.stun > 0) {
            e.stun--;
            if (e.hitFlash > 0) e.hitFlash--;
            // 击退（Knockback）：受击沿攻击方向位移，衰减后恢复
            if (e.knockback > 0) {
                e.x += e.knockbackDir * e.knockback * 0.35;
                e.knockback *= 0.82;
                if (e.knockback < 0.5) e.knockback = 0;
                e.x = Math.min(Math.max(0, e.x), WORLD_W - e.w);
                separateFromEnemies(e);
            }
            continue;
        }
        if (e._speedMult === 0) {
            if (e.hitFlash > 0) e.hitFlash--;
            continue;
        }
        // 击退：优先于 AI 移动
        if (e.knockback > 0) {
            e.x += e.knockbackDir * e.knockback * 0.35;
            e.knockback *= 0.82;
            if (e.knockback < 0.5) e.knockback = 0;
        } else {
            e.x += e._rawSpeed;
        }
        // 击退/移动后边界钳制（防止穿过墙壁）
        e.x = Math.min(Math.max(0, e.x), WORLD_W - e.w);
        // 与其它敌人相互阻挡：击退位移不可穿过其它敌人
        separateFromEnemies(e);
        // 受击形变/抖动衰减
        if (e.squash > 0) { e.squashPhase += 0.18; e.squash *= 0.88; if (e.squash < 0.01) e.squash = 0; }
        if (e.wobble > 0) { e.wobblePhase += 0.22; e.wobble *= 0.86; if (e.wobble < 0.01) e.wobble = 0; }
        if (!e.suspended) e.y = WORLD_H - e.h - GROUND_Y_OFFSET;
        if (e.hitFlash > 0) e.hitFlash--;
    }

    _sepGrid = null;

    updateSmallMerge(now);

    // 状态传染
    for (let i = 0; i < enemies.length; i++) {
        for (let j = i + 1; j < enemies.length; j++) {
            let a = enemies[i];
            let b = enemies[j];
            if (!rectCollide(a, b)) continue;
            if (a.inMergeGroup || b.inMergeGroup) continue;
            if (a.isCharmed || b.isCharmed) continue;
            if (a.camp === CAMP.ALLY || b.camp === CAMP.ALLY) continue;
            if (a.fireLevel > 0 || b.fireLevel > 0) {
                let newLevel = Math.max(a.fireLevel, b.fireLevel);
                if (a.fireLevel < newLevel && !a.controlledByPet) {
                    a.fireLevel = newLevel;
                    a.fireLastDecay = now;
                }
                if (b.fireLevel < newLevel && !b.controlledByPet) {
                    b.fireLevel = newLevel;
                    b.fireLastDecay = now;
                }
            }
            if (a.lightningLevel > 0 || b.lightningLevel > 0) {
                let newLevel = Math.max(a.lightningLevel, b.lightningLevel);
                if (a.lightningLevel < newLevel && !a.controlledByPet) {
                    a.lightningLevel = newLevel;
                    a.lightningDuration = LIGHTNING_DECAY_INTERVAL;
                    a._lastLightningDurationUpdate = now;
                }
                if (b.lightningLevel < newLevel && !b.controlledByPet) {
                    b.lightningLevel = newLevel;
                    b.lightningDuration = LIGHTNING_DECAY_INTERVAL;
                    b._lastLightningDurationUpdate = now;
                }
            }
            if (a.blackholeLevel > 0 || b.blackholeLevel > 0) {
                let newLevel = Math.max(a.blackholeLevel, b.blackholeLevel);
                if (a.blackholeLevel < newLevel && !a.controlledByPet) {
                    a.blackholeLevel = newLevel;
                }
                if (b.blackholeLevel < newLevel && !b.controlledByPet) {
                    b.blackholeLevel = newLevel;
                }
            }
        }
    }

    // 处理死亡
    let toDelete = [];
    for (let e of enemies) {
        if (e.hp <= 0) toDelete.push(e);
    }
    for (let e of toDelete) {
        if (typeof window.onPetKill === 'function') {
            window.onPetKill('monkey', e.x + e.w/2, e.y + e.h/2, ENEMY_HP);
        }
        // block 死亡分裂 2 个 small block（small 不再分裂）
        if (e.type === 'red' && !e.isSmall) {
            spawnSmallBlocksAt(e.x + e.w / 2, e.y + e.h / 2);
        }
    }
    let oldLen = enemies.length;
    enemies = enemies.filter(e => e.hp > 0);
    let killed = oldLen - enemies.length;
    if (killed > 0) {
        killCount += killed;
        // 按敌人类型掉落经验物品：block 2~3基础或1中等 / small 1~2基础 / black 3~4基础或1~2中等
        for (let e of toDelete) {
            addKillReward(e.type, e.isSmall);
        }
    }
}

// ---------- 黑色敌人子弹 ----------
function updateBlackEnemyBullets() {
    for (let enemy of enemies) {
        if (enemy.type !== 'black') continue;
        if (enemy.isCharmed || enemy.camp === CAMP.ALLY) continue;
        if (enemy.stun > 0) continue;
        let now = performance.now();
        if (now - enemy.lastAttack >= BLACK_ENEMY_ATTACK_COOLDOWN) {
            let ecx = enemy.x + enemy.w/2, ecy = enemy.y + enemy.h/2;
            let pcx = player.x + player.w/2, pcy = player.y + player.h/2;
            let dx = pcx - ecx, dy = pcy - ecy, len = Math.hypot(dx,dy);
            if (len > 0.001) {
                let nx = dx/len, ny = dy/len;
                projectiles.push({
                    x: ecx-2, y: ecy-2, vx: nx*BLACK_ENEMY_BULLET_SPEED, vy: ny*BLACK_ENEMY_BULLET_SPEED,
                    w:4, h:4, damage:BLACK_ENEMY_BULLET_DAMAGE, isEnemy:true, isBlackBullet:true,
                    startX:ecx, startY:ecy
                });
            }
            enemy.lastAttack = now;
        }
    }
    // 移动与命中判定统一由 combat.js 的 updateProjectiles 处理，这里只做超程回收，避免同一帧被移动两次
    for (let i=projectiles.length-1; i>=0; i--) {
        let b = projectiles[i];
        if (!b.isBlackBullet) continue;
        let dx = b.x - b.startX, dy = b.y - b.startY;
        if (dx*dx+dy*dy > BLACK_ENEMY_BULLET_MAX_DISTANCE*BLACK_ENEMY_BULLET_MAX_DISTANCE ||
            b.x<-50||b.x>WORLD_W+50||b.y<-50||b.y>WORLD_H+50) {
            projectiles.splice(i,1);
        }
    }
}

// ---------- BOSS ----------
function updateBoss(now) {
    if (!boss) return;
    if (boss.skipTurn) {
        boss.skipTurn = false;
        return;
    }
    const bossCenter = boss.x + boss.w/2, playerCenter = player.x + player.w/2;
    const distance = Math.abs(bossCenter - playerCenter);
    if (distance < CHUNK_SIZE) {
        if (playerCenter > bossCenter) boss.speed = BOSS_SPEED;
        else if (playerCenter < bossCenter) boss.speed = -BOSS_SPEED;
        else boss.speed = 0;
    } else boss.speed = 0;
    if (boss.knockback > 0) {
        boss.x += boss.knockbackDir * boss.knockback * 0.35;
        boss.knockback *= 0.82;
        if (boss.knockback < 0.5) boss.knockback = 0;
    } else {
        boss.x += boss.speed;
    }
    // 击退/移动后边界钳制（防止穿过墙壁）
    boss.x = Math.min(Math.max(0, boss.x), WORLD_W - boss.w);
    // 受击形变/抖动衰减
    if (boss.squash > 0) { boss.squashPhase += 0.18; boss.squash *= 0.88; if (boss.squash < 0.01) boss.squash = 0; }
    if (boss.wobble > 0) { boss.wobblePhase += 0.22; boss.wobble *= 0.86; if (boss.wobble < 0.01) boss.wobble = 0; }
    if (now >= (boss.nextTime || 0)) {
        boss.nextTime = now + boss.interval;
        let cols = ['#ff0000','#ff7f00','#ffff00','#00ff00','#0000ff','#4b0082','#8f00ff','#ffffff'];
        boss.colors[boss.colorIdx] = cols[Math.floor(Math.random()*cols.length)];
        boss.colorIdx = (boss.colorIdx+1) % 16;
    }
}

function createBoss() {
    boss = {
        x: WORLD_W - BOSS_SIZE, y: WORLD_H - BOSS_SIZE - GROUND_Y_OFFSET,

<script>
/* ================= 公用文件/js/dot.js ================= */
// ---------- 受击延迟结算（DoT）公用模块 ----------
// 规则：敌人受到伤害时不立即扣血，而是转为 DoT 在 1 秒内扣完
//   受到伤害 = TD，每秒扣血 DoT = TD
//   等价于：每 (1 / TD) 秒扣 1 HP，全部伤害在 1 秒内结算完毕
// 用法：Dot.deal(敌人对象, 伤害值)  替换原来的  e.hp -= 伤害
//       主循环每帧调用 Dot.update(距离上一帧的秒数)
(function () {
    'use strict';

    // 总结算时长（秒）：1 = 全部伤害在 1 秒内扣完
    const DOT_TOTAL_SEC = 1;
    // 单帧最大推进时间，防止切后台回来后一帧把血扣穿
    const MAX_STEP_SEC = 0.25;

    const list = [];

    const Dot = {
        // 每秒扣血量：DoT = TD / 结算时长
        rate: function (td) {
            return Math.max(1, td) / DOT_TOTAL_SEC;
        },
        // 该次伤害完全扣完所需秒数
        duration: function (td) {
            return DOT_TOTAL_SEC;
        },
        // 登记一次伤害（不立即扣血）
        deal: function (target, amount) {
            if (!target || !(amount > 0)) return 0;
            if (typeof target.hp === 'number' && target.hp <= 0) return 0;
            var td = Math.max(1, Math.round(amount));
            list.push({ t: target, left: td, rate: this.rate(td) });
            target._dotPending = (target._dotPending || 0) + td;
            return td;
        },
        // 待结算总量
        pending: function (target) {
            return target ? (target._dotPending || 0) : 0;
        },
        // 每帧结算（dt 单位为秒）
        update: function (dt) {
            if (!list.length || !(dt > 0)) return;
            if (dt > MAX_STEP_SEC) dt = MAX_STEP_SEC;
            for (var i = list.length - 1; i >= 0; i--) {
                var d = list[i];
                var tg = d.t;
                if (!tg || (typeof tg.hp === 'number' && tg.hp <= 0)) {
                    list.splice(i, 1);
                    continue;
                }
                // 小数进度先记在 acc 里，攒满 1 点才真正扣血
                // 保证 hp / _dotPending 全程为整数，不产生小数点误差
                d.acc = (d.acc || 0) + d.rate * dt;
                var steps = Math.floor(d.acc);
                if (steps > 0) {
                    d.acc -= steps;
                    var drain = Math.min(steps, d.left);
                    d.left -= drain;
                    tg.hp -= drain;
                    tg._dotPending = Math.max(0, (tg._dotPending || 0) - drain);
                    if (tg.hp < 0) tg.hp = 0;
                }
                if (d.left <= 0) list.splice(i, 1);
            }
        },
        // 清空（重开/切场景）
        clear: function () {
            list.length = 0;
        }
    };

    window.Dot = Dot;
})();

</script>
<script>
/* ================= 公用文件/js/combat.js ================= */
// ---------- 战斗系统：投射物、激光、碰撞 ----------
// ---------- 新装备：冰霜之翼 + 科技盾牌 ----------
window.shieldCharge = 0;
window.shieldActive = false;
window.shieldActiveUntil = 0;
window.hasTechShield = false;
window.hasIceWings = false;
window.iceTrail = [];
window.gliding = false;

function addShieldCharge(amount) {
    if (!window.hasTechShield) return;
    window.shieldCharge = Math.min(100, (window.shieldCharge || 0) + amount);
}

function triggerIceWingsFreeze(e) {
    if (!window.hasIceWings || !e || e.hp <= 0) return;
    if (Math.random() < 0.25) {
        e.frozenUntil = performance.now() + 1500;
    }
}

function blockDamage(damage, attackerX, attackerY) {
    if (!window.shieldActive) return false;
    // 格挡成功：反弹 50% 伤害给攻击者并击退
    const reflectDmg = Math.max(1, Math.floor((damage || 0) * 0.5));
    if (attackerX !== undefined && attackerX !== null && attackerY !== undefined && attackerY !== null) {
        let best = null, bestD = Infinity;
        for (let e of enemies) {
            if (e.hp <= 0) continue;
            const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
            const d = (ex - attackerX) * (ex - attackerX) + (ey - attackerY) * (ey - attackerY);
            if (d < bestD) { bestD = d; best = e; }
        }
        if (best) {
            if (best.canBeDamaged !== false) {
                Dot.deal(best, reflectDmg);
                best.hitFlash = 5;
                const kx = Math.sign(best.x - player.x) || player.facing || 1;
                best.x += kx * 8;
                if (typeof spawnHitParticles === 'function') spawnHitParticles(best, reflectDmg);
            }
        }
    }
    return true;
}

function updateProjectiles() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let b = projectiles[i];
        
        // ===== 处理敌人子弹 =====
        if (b.isEnemy) {
            b.x += b.vx;
            b.y += b.vy;
            if (b.x < -50 || b.x > WORLD_W + 50 || b.y < -50 || b.y > WORLD_H + 50) {
                projectiles.splice(i, 1);
                continue;
            }
            if (rectCollide({x: b.x, y: b.y, w: b.w, h: b.h}, player)) {
                let damage = b.damage || 5;
                if (b.sourceEnemy && b.sourceEnemy.weakLevel > 0) {
                    damage *= (1 - b.sourceEnemy.weakLevel * WEAK_DAMAGE_REDUCTION_PER_LEVEL);
                    damage = Math.max(1, Math.floor(damage));
                }
                // 神父服祈祷
                damage = applyPrayerProtection(damage);
                if (blockDamage(damage, b.startX, b.startY)) {
                    projectiles.splice(i, 1);
                    continue;
                }
                addShieldCharge(20);
                playerHP = Math.max(0, playerHP - damage);
                projectiles.splice(i, 1);
                continue;
            }
            continue;
        }
        
        // ===== 科技长矛 =====
        if (b.isTechSpear) {
            let elapsed = performance.now() - b.startTime;
            let t = Math.min(elapsed / b.duration, 1.0);
            let offset = 100 - 200 * Math.abs(t - 0.5);
            let worldX = b.startX + b.facing * offset;
            let worldY = b.startY;
            b.x = worldX - 20;
            b.y = worldY - 20;
            b.w = 40;
            b.h = 40;
            b.angle = t * Math.PI / 2;
            let canDamage = (t >= 0.3 && t <= 0.7);
            if (canDamage) {
                let startX = b.startX;
                let endX = b.startX + b.facing * offset;
                let minX = Math.min(startX, endX);
                let maxX = Math.max(startX, endX);
                let rect = {
                    x: minX - 20,
                    y: b.startY - 20,
                    w: (maxX - minX) + 40,
                    h: 40
                };
                for (let e of enemies) {
                    if (e.hp <= 0) continue;
                    if (b.hitEnemies.has(e)) continue;
                    if (rectCollide(rect, e)) {
                        if (e.canBeDamaged !== false) {
                            Dot.deal(e, b.damage);
                            e.stun = STUN_DUR;
                            e.hitFlash = 5;
                            b.hitEnemies.add(e);
                            triggerPriestEffects(e, b.damage);
                            triggerIceWingsFreeze(e);
                        }
                    }
                }
                if (boss && !b.hitEnemies.has(boss) && rectCollide(rect, boss)) {
                    Dot.deal(boss, b.damage);
                    b.hitEnemies.add(boss);
                    triggerPriestEffects(boss, b.damage);
                    triggerIceWingsFreeze(boss);
                }
            }
            if (t >= 1) {
                projectiles.splice(i, 1);
                player.lockMovement = false;
                continue;
            }
            continue;
        }
        
        // ===== 黑洞投射物 =====
        if (b.isBlackhole) {
            b.x += b.vx;
            b.y += b.vy;
            let dist = Math.hypot(b.x - b.startX, b.y - b.startY);
            if (dist > b.maxDist || b.x < -100 || b.x > WORLD_W + 100 || b.y < -100 || b.y > WORLD_H + 100) {
                projectiles.splice(i, 1);
                continue;
            }
            // 命中后生成持续 3 秒的黑洞区域（黑洞权杖实装：持续伤害 + 吸附）
            let hitPoint = null;
            for (let e of enemies) {
                if (e.hp <= 0) continue;
                if (b.hitEnemies.has(e)) continue;
                if (rectCollide({x: b.x, y: b.y, w: b.w, h: b.h}, e)) {
                    if (e.canBeDamaged !== false) {
                        Dot.deal(e, b.damage);
                        e.stun = STUN_DUR;
                        e.hitFlash = 5;
                        b.hitEnemies.add(e);
                        triggerPriestEffects(e, b.damage);
                        triggerIceWingsFreeze(e);
                        hitPoint = { x: e.x + e.w / 2, y: e.y + e.h / 2 };
                    }
                    break;
                }
            }
            if (!hitPoint && boss && !b.hitEnemies.has(boss) && rectCollide({x: b.x, y: b.y, w: b.w, h: b.h}, boss)) {
                Dot.deal(boss, b.damage);
                b.hitEnemies.add(boss);
                triggerPriestEffects(boss, b.damage);
                triggerIceWingsFreeze(boss);
                hitPoint = { x: boss.x + boss.w / 2, y: boss.y + boss.h / 2 };
            }
            if (hitPoint) {
                if (!window.blackholeZones) window.blackholeZones = [];
                window.blackholeZones.push({
                    x: hitPoint.x,
                    y: hitPoint.y,
                    r: 110,
                    ttl: 3000,
                    level: Math.max(1, Math.floor(((typeof level !== 'undefined' ? level : 1) - 1) / 5)),
                    affected: new Set(),
                    bornAt: performance.now()
                });
                projectiles.splice(i, 1);
            }
            continue;
        }
        
        // ===== 弓箭 =====
        if (b.isArrow) {
            b.vy += (b.gravity !== undefined ? b.gravity : ARROW_GRAV);
            b.x += b.vx;
            b.y += b.vy;
            b.life--;
            if (b.life <= 0 || b.x < -100 || b.x > WORLD_W + 100 || b.y < -100 || b.y > WORLD_H + 100) {
                projectiles.splice(i, 1);
                continue;
            }
            if (b.hasHit) continue;
            let hit = false;
            for (let e of enemies) {
                if (rectCollide({x: b.x, y: b.y, w: b.w, h: b.h}, e)) {
                    if (e.canBeDamaged !== false) {
                        Dot.deal(e, b.damage);
                        e.stun = STUN_DUR;
                        e.hitFlash = 5;
                        triggerPriestEffects(e, b.damage);
                        triggerIceWingsFreeze(e);
                    }
                    hit = true;
                    b.hasHit = true;
                    break;
                }
            }
            if (!hit && boss && rectCollide({x: b.x, y: b.y, w: b.w, h: b.h}, boss)) {
                Dot.deal(boss, b.damage);
                hit = true;
                b.hasHit = true;
                triggerPriestEffects(boss, b.damage);
                triggerIceWingsFreeze(boss);
            }
            if (hit) projectiles.splice(i, 1);
            continue;
        }
        
        // ===== 火焰法杖火球 =====
        if (b.isFireball) {
            b.x += b.vx;
            b.y += b.vy;
            b.life--;
            if (b.life <= 0 || b.x < -100 || b.x > WORLD_W + 100 || b.y < -100 || b.y > WORLD_H + 100) {
                projectiles.splice(i, 1);
                continue;
            }
            if (b.hasHit) continue;
            let hit = false;
            for (let e of enemies) {
                if (rectCollide({x: b.x, y: b.y, w: b.w, h: b.h}, e)) {
                    if (e.canBeDamaged !== false) {
                        e.fireLevel = Math.min(4, (e.fireLevel || 0) + 1);
                        e.fireLastDamage = performance.now();
                        e.fireLastDecay = performance.now();
                        Dot.deal(e, b.damage);
                        e.stun = STUN_DUR;
                        e.hitFlash = 5;
                        triggerPriestEffects(e, b.damage);
                        triggerIceWingsFreeze(e);
                    }
                    hit = true;
                    b.hasHit = true;
                    break;
                }
            }
            if (!hit && boss && rectCollide({x: b.x, y: b.y, w: b.w, h: b.h}, boss)) {
                Dot.deal(boss, b.damage);
                hit = true;
                b.hasHit = true;
                triggerPriestEffects(boss, b.damage);
                triggerIceWingsFreeze(boss);
            }
            if (hit) projectiles.splice(i, 1);
            continue;
        }
        
        // ===== 砖头投射物 =====
        b.vy += BRICK_GRAV;
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -50 || b.x > WORLD_W+50 || b.y < -50 || b.y > WORLD_H+50) {
            projectiles.splice(i,1);
            continue;
        }
        let hit = false, brickDamage = getBrickDamage();
        for (let e of enemies) {
            if (brickHitEnemy(b, e)) {
                if (e.canBeDamaged !== false) {
                    Dot.deal(e, brickDamage);
                    e.stun = STUN_DUR;
                    e.hitFlash = 5;
                    triggerPriestEffects(e, brickDamage);
                    triggerIceWingsFreeze(e);
                }
                hit = true;
                break;
            }
        }
        if (!hit && boss && brickHitEnemy(b, boss)) {
            Dot.deal(boss, brickDamage);

            triggerPriestEffects(boss, brickDamage);
            triggerIceWingsFreeze(boss);
        }
        if (hit) projectiles.splice(i,1);
    }

    // ===== 黑洞权杖：黑洞区域（持续伤害 + 吸附） =====
    if (window.blackholeZones && window.blackholeZones.length > 0) {
        let now = performance.now();
        for (let zi = window.blackholeZones.length - 1; zi >= 0; zi--) {
            let z = window.blackholeZones[zi];
            if (now - z.bornAt >= z.ttl) {
                // 区域结束：仅清理本区域设置的 blackholeLevel（不破坏宠物黑洞等高等级状态）
                for (let e of z.affected) {
                    if (e && e.blackholeLevel === z.level && !e.controlledByPet) e.blackholeLevel = 0;
                }
                window.blackholeZones.splice(zi, 1);
                continue;

            for (let e of enemies) {
                if (e.hp <= 0) continue;
                if (e.controlledByPet) continue;
                let ex = e.x + e.w / 2, ey = e.y + e.h / 2;
                let dx = z.x - ex, dy = z.y - ey;
                let d = Math.hypot(dx, dy);
                if (d > 20 && d < z.r) {
                    // 吸附向黑洞中心
                    let pull = BLACKHOLE_ATTRACT_STRENGTH;
                    e.x += (dx / d) * pull * 2;
                    e.y += (dy / d) * pull * 2;
                    // 挂上持续伤害等级（enemy.js 已有每秒黑洞伤害：1 + (level-1) + (blackholeLevel-1)）
                    if (!e.blackholeLevel || e.blackholeLevel < z.level) {
                        e.blackholeLevel = z.level;
                        if (!e.blackholeLastDamage) e.blackholeLastDamage = performance.now();
                    }
                    z.affected.add(e);
                }
            }
            if (boss && boss.hp > 0) {
                let bx = boss.x + boss.w / 2, by = boss.y + boss.h / 2;
                let dx = z.x - bx, dy = z.y - by;
                let d = Math.hypot(dx, dy);
                if (d > 20 && d < z.r) {
                    let pull = BLACKHOLE_ATTRACT_STRENGTH;
                    boss.x += (dx / d) * pull * 2;
                    boss.y += (dy / d) * pull * 2;
                    if (!boss.blackholeLevel || boss.blackholeLevel < z.level) {
                        boss.blackholeLevel = z.level;
                        if (!boss.blackholeLastDamage) boss.blackholeLastDamage = performance.now();
                    }
                    z.affected.add(boss);
                }
            }
        }
    }
}

// ---------- 激光辅助 ----------
function getSlantLaserEndpoints(centerX, angle) {
    const crossY = WORLD_H / 2;
    const k = Math.tan(angle);
    if (Math.abs(k) < 1e-6) return { startX: centerX, endX: centerX };
    const startX = centerX - crossY / k;
    const endX = centerX + (WORLD_H - crossY) / k;
    return { startX, endX };
}

function updateLaser(now) {
    if (!boss) return;
    const bossCenter = boss.x + boss.w/2, playerCenter = player.x + player.w/2;
    const distance = Math.abs(bossCenter - playerCenter);
    const isActive = (distance < CHUNK_SIZE);
    if (isActive && lasers.length === 0 && now - lastLaser >= LASER_CD) {
        const targetX = player.x + player.w/2;
        lasers = [
            { state: 'warn', startTime: now, x: targetX, angle: 0, factor: 0, lastDamage: 0, blink: 0 },
            { state: 'warn', startTime: now, x: targetX, angle: -Math.PI/6, factor: 0, lastDamage: 0, blink: 0 },
            { state: 'warn', startTime: now, x: targetX, angle: Math.PI/6, factor: 0, lastDamage: 0, blink: 0 }
        ];
        lastLaser = now;
    }
    for (let i = 0; i < lasers.length; i++) {
        const l = lasers[i];
        if (l.state === 'warn') {
            l.blink = (l.blink + 0.1) % 1;
            if (now - l.startTime >= LASER_WARN) {
                l.state = 'act';
                l.startTime = now;
                l.factor = 0;
            }
        } else if (l.state === 'act') {
            const elapsed = now - l.startTime;
            if (elapsed >= LASER_ACT) {
                lasers.splice(i,1);
                i--;
                continue;
            }
            l.factor = Math.min(1, elapsed / LASER_ACT);
            if (now - l.lastDamage >= LASER_INTERVAL) {
                let startX, endX;
                if (l.angle === 0) { startX = l.x; endX = l.x; }
                else { const eps = getSlantLaserEndpoints(l.x, l.angle); startX = eps.startX; endX = eps.endX; }
                const startY = 0, endY = WORLD_H;
                const px = player.x + player.w/2, py = player.y + player.h/2;
                const ax = px - startX, ay = py - startY, bx = endX - startX, by = endY - startY;
                const dot = ax * bx + ay * by, len2 = bx * bx + by * by;
                let t = (len2 > 0) ? dot / len2 : 0;
                t = Math.max(0, Math.min(1, t));
                const projX = startX + t * bx, projY = startY + t * by;
                if (Math.hypot(px - projX, py - projY) < 15) {
                    let damage = LASER_DMG;
                    damage = applyPrayerProtection(damage);
                    if (blockDamage(damage, bossCenter, boss.y)) {
                        lasers.splice(i,1);
                        i--;
                        continue;
                    }
                    addShieldCharge(20);
                    playerHP = Math.max(0, playerHP - damage);
                    lasers.splice(i,1);
                    i--;
                } else l.lastDamage = now;
            }
        }
    }
}

// ---------- 其余物品的通用使用逻辑 ----------
// 武器 → 手持；装备配件 → 对应装备格；宠物 → 召唤上场；材料 → 不可使用
const PET_ITEM_TYPES = ['monkey', 'point618', 'horror', 'xiaoe'];

function defaultUseItem(type) {
    const item = ITEMS[type];
    if (!item) return false;
    const weapons = window.WEAPONS;

    // 武器
    if (weapons && weapons[type]) {
        if (typeof window.equipWeapon === 'function') return window.equipWeapon(type) === true;
        currentWeapon = weapons[type];
        showInventoryMessage('装备了 ' + currentWeapon.name);
        return true;
    }

    // 装备配件
    if (item.slotType) {
        let idx = getEquipSlotIndex(item.slotType);
        if (item.slotType === 'accessory') {
            // 两个挂饰格：优先 0 号，空了才用 1 号
            if (equipSlots[0] && !equipSlots[1]) idx = 1;
        }
        for (let i = 0; i < EQUIP_SLOTS; i++) {
            if (equipSlots[i] && equipSlots[i].type === type) {
                showInventoryMessage('已装备 ' + item.name + '，无需重复装备');
                return false;
            }
        }
        const old = equipSlots[idx];
        if (old) {
            showInventoryMessage('装备栏已被占用，请先卸下 ' + ((ITEMS[old.type] && ITEMS[old.type].name) || old.type));
            return false;
        }
        equipSlots[idx] = { type: type, count: 1 };
        if (typeof refreshEquipEffects === 'function') refreshEquipEffects();
        showInventoryMessage('已装备 ' + item.name);
        return true;
    }

    // 宠物
    if (PET_ITEM_TYPES.indexOf(type) >= 0) {
        if (typeof window.addPet !== 'function') {
            showInventoryMessage('当前场景无法召唤宠物');
            return false;
        }
        return window.addPet(type) === true;
    }

    // 抽卡材料等不可使用的物品
    showInventoryMessage(item.name + ' 不是可使用的物品');
    return false;
}

for (const _itemType in ITEMS) {
    if (typeof ITEMS[_itemType].use !== 'function') {
        ITEMS[_itemType].use = (function (t) {
            return function () { return defaultUseItem(t); };
        })(_itemType);
    }
}

window.ITEMS = ITEMS;

// ---------- 添加物品 ----------
function addItem(type, amount = 1) {
    if (!ITEMS[type]) return false;
    const maxStack = ITEMS[type].maxStack;
    let remaining = amount;

    // 优先放入背包 27 格
    for (let i = 0; i < INVENTORY_SIZE && remaining > 0; i++) {
        const slot = inventorySlots[i];
        if (slot && slot.type === type && slot.count < maxStack) {
            const canAdd = Math.min(maxStack - slot.count, remaining);
            slot.count += canAdd;
            remaining -= canAdd;
        }
    }
    for (let i = 0; i < INVENTORY_SIZE && remaining > 0; i++) {
        if (inventorySlots[i] === null) {
            const add = Math.min(maxStack, remaining);
            inventorySlots[i] = { type: type, count: add };
            remaining -= add;
        }
    }

    // 再放入快捷栏 9 格
    for (let i = 0; i < HOTBAR_SIZE && remaining > 0; i++) {
        const slot = hotbarSlots[i];
        if (slot && slot.type === type && slot.count < maxStack) {
            const canAdd = Math.min(maxStack - slot.count, remaining);
            slot.count += canAdd;
            remaining -= canAdd;
        }
    }
    for (let i = 0; i < HOTBAR_SIZE && remaining > 0; i++) {
        if (hotbarSlots[i] === null) {
            const add = Math.min(maxStack, remaining);
            hotbarSlots[i] = { type: type, count: add };
            remaining -= add;
        }
    }

    if (remaining > 0) {
        showInventoryMessage(`物品栏已满，丢失 ${remaining} 个 ${ITEMS[type].name}`);
        return false;
    }
    return true;
}

// ---------- 使用物品 ----------
function useItemFromSlot(slotIndex, isHotbar) {
    const slots = isHotbar ? hotbarSlots : inventorySlots;
    const slot = slots[slotIndex];
    if (!slot) return false;

    const item = ITEMS[slot.type];
    if (!item) return false;

    if (item.maxStack === 1) {
        // 单件物品（武器、配件、宠物等）
        const isUsingWeapon = isWeaponType(slot.type);
        const oldWeaponId = (isUsingWeapon && currentWeapon && currentWeapon.id) ? currentWeapon.id : null;
        const oldSource = lastWeaponSource ? { ...lastWeaponSource } : null;
        // 只有换武器时记录来源槽位，供旧武器归位
        if (isUsingWeapon) lastWeaponSource = { isHotbar: !!isHotbar, index: slotIndex };

        if (item.use()) {
            slots[slotIndex] = null;
            // 换下的旧武器归位：优先回原来来源的槽位，其次同区域空位，再不行进背包
            if (oldWeaponId && oldWeaponId !== slot.type) {
                const srcZone = (oldSource && oldSource.isHotbar) ? hotbarSlots : inventorySlots;
                const srcIdx = oldSource ? oldSource.index : -1;
                let placed = false;
                if (srcIdx >= 0 && srcIdx < srcZone.length && srcZone[srcIdx] === null) {
                    srcZone[srcIdx] = { type: oldWeaponId, count: 1 };
                    placed = true;
                }
                if (!placed) {
                    for (let i = 0; i < srcZone.length; i++) {
                        if (srcZone[i] === null) {
                            srcZone[i] = { type: oldWeaponId, count: 1 };
                            placed = true;
                            break;
                        }
                    }
                }
                if (!placed) {
                    for (let i = 0; i < INVENTORY_SIZE; i++) {
                        if (inventorySlots[i] === null) {
                            inventorySlots[i] = { type: oldWeaponId, count: 1 };
                            placed = true;
                            break;
                        }
                    }
                }
                if (!placed) {
                    showInventoryMessage('物品栏已满，换下的 ' + ((ITEMS[oldWeaponId] && ITEMS[oldWeaponId].name) || oldWeaponId) + ' 已丢失');
                }
            }
            return true;
        }
        return false;
    } else {
        if (item.use()) {
            slot.count--;
            if (slot.count <= 0) slots[slotIndex] = null;
            return true;
        }
        return false;
    }
}

// ---------- 装备/卸装备 ----------

function getEquipSlotIndex(slotType) {
    switch (slotType) {
        case 'accessory': return 0; // 第一个挂饰格
        case 'robe': return 3; // 外衣
        case 'mask': return 2; // 面具
        case 'shield': return 4; // 盾牌
    }
    return 1; // accessory 也可能放第二个挂饰格
}

function unequipAccessory(type) {
    const item = ITEMS[type];
    if (!item || !item.slotType) return false;

    const slotIndex = getEquipSlotIndex(item.slotType);
    const equip = equipSlots[slotIndex];
    if (!equip || equip.type !== type) {
        showInventoryMessage(`未装备 ${item.name}`);
        return false;
    }

    // 移除特殊装备效果
    if (type === 'clownMask') { window.hasClownMask = false; updatePlayerMaxHp(); }
    if (type === 'cross') { window.hasCross = false; updatePlayerMaxHp(); }
    if (type === 'priestRobes') { window.hasPriestRobes = false; }
    if (type === 'iceWings') { window.hasIceWings = false; }
    if (type === 'techShield') { window.hasTechShield = false; if (window.shieldActive) { window.shieldActive = false; } }

    putBack(type);
    equipSlots[slotIndex] = null;
    showInventoryMessage(`已卸下 ${item.name}`);
    return true;
}

function putBack(type) {
    if (!addItem(type, 1)) {
        showInventoryMessage(`物品栏已满，无法卸下 ${ITEMS[type].name}`);
    }
}

// ---------- 背包面板开关 ----------
window.gamePanelOpen = false;
function openGamePanel() { window.gamePanelOpen = true; }
function closeGamePanel() { window.gamePanelOpen = false; }

// ---------- 鼠标拖拽系统 ----------
let dragState = null; // { item:{type,count}, fromZone, fromIndex }

function getInvLayout() {
    const cellW = 50, cellH = 50, equipCellW = 40, equipCellH = 40;
    const equipStartX = (VIEW_W - EQUIP_SLOTS * equipCellW) / 2;
    const equipStartY = 10;
    const weaponRect = { x: equipStartX + EQUIP_SLOTS * equipCellW + 10, y: equipStartY, w: equipCellW, h: equipCellH };
    const backStartX = (VIEW_W - INVENTORY_SIZE / 3 * cellW) / 2;
    const backStartY = equipStartY + equipCellH + 10;
    const hotStartX = (VIEW_W - HOTBAR_SIZE * cellW) / 2;
    const hotStartY = VIEW_H - cellH - 20;
    return { cellW: cellW, cellH: cellH, equipCellW: equipCellW, equipCellH: equipCellH,
             equipStartX: equipStartX, equipStartY: equipStartY, weaponRect: weaponRect,
             backStartX: backStartX, backStartY: backStartY, hotStartX: hotStartX, hotStartY: hotStartY };
}

function equipSlotNeed(index) {
    if (index === 2) return 'mask';
    if (index === 3) return 'robe';
    if (index === 4) return 'shield';
    return 'accessory';
}

function isWeaponType(type) {
    return typeof WEAPONS !== 'undefined' && !!WEAPONS[type];
}

function peekSlotItem(zone, index) {
    if (zone === 'back') return inventorySlots[index] || null;
    if (zone === 'hot') return hotbarSlots[index] || null;
    if (zone === 'equip') return equipSlots[index] || null;
    if (zone === 'weapon') return currentWeapon ? { type: currentWeapon.id, count: 1 } : null;
    return null;
}

function takeSlotItem(zone, index) {
    const it = peekSlotItem(zone, index);
    if (!it) return null;
    if (zone === 'back') inventorySlots[index] = null;
    else if (zone === 'hot') hotbarSlots[index] = null;
    else if (zone === 'equip') equipSlots[index] = null;
    else if (zone === 'weapon') { currentWeapon = null; if (typeof lastWeaponSource !== 'undefined') lastWeaponSource = null; }
    return { type: it.type, count: it.count };
}

function hitTestInv(sx, sy) {
    const L = getInvLayout();
    if (sy >= L.hotStartY && sy <= L.hotStartY + L.cellH && sx >= L.hotStartX) {
        const col = Math.floor((sx - L.hotStartX) / L.cellW);
        if (col >= 0 && col < HOTBAR_SIZE) return { zone: 'hot', index: col };
    }
    if (!window.gamePanelOpen) return null;
    if (sy >= L.equipStartY && sy <= L.equipStartY + L.equipCellH && sx >= L.equipStartX) {
        const i = Math.floor((sx - L.equipStartX) / L.equipCellW);
        if (i >= 0 && i < EQUIP_SLOTS) return { zone: 'equip', index: i };
    }
    const w = L.weaponRect;
    if (sx >= w.x && sx <= w.x + w.w && sy >= w.y && sy <= w.y + w.h) return { zone: 'weapon', index: 0 };
    if (sy >= L.backStartY && sx >= L.backStartX) {
        const col = Math.floor((sx - L.backStartX) / L.cellW);
        const row = Math.floor((sy - L.backStartY) / L.cellH);
        if (col >= 0 && col < 9 && row >= 0 && row < 3) return { zone: 'back', index: row * 9 + col };
    }
    return null;
}

function rectOfHit(hit) {
    const L = getInvLayout();
    if (hit.zone === 'equip') return { x: L.equipStartX + hit.index * L.equipCellW, y: L.equipStartY, w: L.equipCellW, h: L.equipCellH };
    if (hit.zone === 'weapon') return { x: L.weaponRect.x, y: L.weaponRect.y, w: L.weaponRect.w, h: L.weaponRect.h };
    if (hit.zone === 'hot') return { x: L.hotStartX + hit.index * L.cellW, y: L.hotStartY, w: L.cellW, h: L.cellH };
    const row = Math.floor(hit.index / 9), col = hit.index % 9;
    return { x: L.backStartX + col * L.cellW, y: L.backStartY + row * L.cellH, w: L.cellW, h: L.cellH };
}

function isDropAllowed(src, dst) {
    if (!src || !dst) return false;
    if (src.fromZone === dst.zone && src.fromIndex === dst.index) return false;
    if (dst.zone === 'weapon') return isWeaponType(src.item.type);
    if (dst.zone === 'equip') {
        const info = ITEMS[src.item.type] || {};
        return info.slotType === equipSlotNeed(dst.index);
    }
    return true;
}

function putItemInto(zone, index, item) {
    if (!item) return false;
    if (zone === 'back') {
        if (inventorySlots[index] === null) { inventorySlots[index] = item; return true; }
    } else if (zone === 'hot') {
        if (hotbarSlots[index] === null) { hotbarSlots[index] = item; return true; }
    } else if (zone === 'equip') {
        if (equipSlots[index] === null) { equipSlots[index] = item; return true; }
    } else if (zone === 'weapon') {
        if (typeof WEAPONS !== 'undefined' && WEAPONS[item.type]) { currentWeapon = WEAPONS[item.type]; return true; }
    }
    return addItem(item.type, item.count);
}

function refreshEquipEffects() {
    let mask = false, cross = false, robe = false, ice = false, shield = false;
    for (let i = 0; i < EQUIP_SLOTS; i++) {
        const sl = equipSlots[i];
        if (!sl) continue;
        if (sl.type === 'clownMask') mask = true;
        else if (sl.type === 'cross') cross = true;
        else if (sl.type === 'priestRobes') robe = true;
        else if (sl.type === 'iceWings') ice = true;
        else if (sl.type === 'techShield') shield = true;
    }
    window.hasClownMask = mask;
    window.hasCross = cross;
    window.hasPriestRobes = robe;
    window.hasIceWings = ice;
    window.hasTechShield = shield;
    if (typeof updatePlayerMaxHp === 'function') updatePlayerMaxHp();
}

function transferItem(src, dst) {
    const item = src.item;
    if (dst.zone === 'weapon') {
        if (!isWeaponType(item.type)) { showInventoryMessage('该物品不能装备到武器位'); return false; }
        if (currentWeapon && currentWeapon.id) {
            putItemInto(src.fromZone, src.fromIndex, { type: currentWeapon.id, count: 1 });
        }
        if (typeof equipWeapon === 'function') equipWeapon(item.type);
        else currentWeapon = (typeof WEAPONS !== 'undefined') ? WEAPONS[item.type] : null;
        showInventoryMessage('已装备 ' + (ITEMS[item.type] && ITEMS[item.type].name ? ITEMS[item.type].name : item.type));
        return true;
    }
    if (dst.zone === 'equip') {
        const need = equipSlotNeed(dst.index);
        const info = ITEMS[item.type] || {};
        if (info.slotType !== need) { showInventoryMessage('该物品不能装备到此处'); return false; }
        const old = equipSlots[dst.index];
        equipSlots[dst.index] = { type: item.type, count: 1 };
        if (old) putItemInto(src.fromZone, src.fromIndex, { type: old.type, count: 1 });
        if (typeof refreshEquipEffects === 'function') refreshEquipEffects();
        showInventoryMessage('已装备 ' + (info.name || item.type));
        return true;
    }
    const arr = (dst.zone === 'hot') ? hotbarSlots : inventorySlots;
    const t = arr[dst.index];
    if (t === null) { arr[dst.index] = item; return true; }
    const tInfo = ITEMS[item.type] || {};
    if (t.type === item.type && (tInfo.maxStack || 1) > 1) {
        const maxStack = tInfo.maxStack;
        const can = Math.min(maxStack - t.count, item.count);
        if (can > 0) {
            t.count += can;
            item.count -= can;
            if (item.count > 0) putItemInto(src.fromZone, src.fromIndex, item);
            return true;
        }
    }
    arr[dst.index] = item;
    putItemInto(src.fromZone, src.fromIndex, t);
    return true;
}

function invMouseDown(sx, sy) {
    if (dragState) return true;
    const hit = hitTestInv(sx, sy);
    if (!hit) return false;
    const it = takeSlotItem(hit.zone, hit.index);
    if (it) {
        dragState = { item: it, fromZone: hit.zone, fromIndex: hit.index };
        refreshEquipEffects();
    }
    return true;
}

function invMouseUp() {
    if (!dragState) return false;
    const src = dragState;
    const dst = hitTestInv(mouseScreenX, mouseScreenY);
    let ok = false;
    if (dst) ok = transferItem(src, dst);
    if (!ok) putItemInto(src.fromZone, src.fromIndex, src.item);
    dragState = null;
    refreshEquipEffects();
    return true;
}

function invCancelDrag() {
    if (!dragState) return false;
    putItemInto(dragState.fromZone, dragState.fromIndex, dragState.item);
    dragState = null;
    refreshEquipEffects();
    return true;
}

function drawDragLayer() {
    if (!dragState) return;
    const hit = hitTestInv(mouseScreenX, mouseScreenY);
    if (hit) {
        const r = rectOfHit(hit);
        ctx.save();
        ctx.strokeStyle = isDropAllowed(dragState, hit) ? '#44ff88' : '#ff4444';
        ctx.lineWidth = 2;
        ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
        ctx.restore();
    }
    const info = ITEMS[dragState.item.type];
    const size = 42;
    const dx = mouseScreenX - size / 2, dy = mouseScreenY - size / 2;
    ctx.save();
    ctx.globalAlpha = 0.85;
    if (info && info.icon) {
        const img = getCachedImage(info.icon);
        if (img.complete && img.naturalWidth > 0) ctx.drawImage(img, dx, dy, size, size);
        else {
            ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
            ctx.fillText((info.name || '?').charAt(0), mouseScreenX, mouseScreenY + 4); ctx.textAlign = 'left';
        }
    } else {
        ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
        ctx.fillText((info && info.name ? info.name : '?').charAt(0), mouseScreenX, mouseScreenY + 4); ctx.textAlign = 'left';
    }
    ctx.restore();
}

// ---------- 绘制界面 ----------
function drawHotbar() {
    const cellW = 50;
    const cellH = 50;
    const equipCellW = 40;
    const equipCellH = 40;

    if (window.gamePanelOpen) {
    // === 装备栏（顶部 4 格） ===
    const equipStartX = (VIEW_W - EQUIP_SLOTS * equipCellW) / 2;
    const equipStartY = 10;
    const equipSlotsDef = [
        { name: '挂饰', index: 0 }, { name: '挂饰', index: 1 },
        { name: '面具', index: 2 }, { name: '外衣', index: 3 },
        { name: '盾牌', index: 4 }
    ];

    for (let i = 0; i < EQUIP_SLOTS; i++) {
