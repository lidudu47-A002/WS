<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WS启动器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>white square</h1>
    <div class="subtitle">白色方块的冒险</div>

    <!-- 账户面板 -->
    <div class="account-panel" id="accountPanel">
        <!-- 优化清单第 3 条：纯前端"账号"不具备真实权限，文案明确为本地玩家档案 -->
        <div class="local-profile-note" style="font-size:12px;line-height:1.5;opacity:.7;margin-bottom:10px;">
            本页账号仅保存在本机浏览器（localStorage），用于区分本地玩家档案与存档开关，并非服务器账号，不具备真实安全权限。
        </div>
        <div id="loginForm">
            <div class="input-group">
                <label>👤 用户名</label>
                <input type="text" id="loginUsername" placeholder="输入用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🔒 密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码">
            </div>
            <div class="account-actions">
                <button class="account-btn primary" id="loginBtn">登录</button>
                <button class="account-btn" id="switchToRegisterBtn">去注册</button>
            </div>
        </div>
        <div id="registerForm" style="display:none;">
            <div class="input-group">
                <label>👤 用户名</label>
                <input type="text" id="regUsername" placeholder="输入用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🔒 密码</label>
                <input type="password" id="regPassword" placeholder="输入密码">
            </div>
            <div class="input-group">
                <label>🔒 确认密码</label>
                <input type="password" id="regPasswordConfirm" placeholder="再次输入密码">
            </div>
            <div class="account-actions">
                <button class="account-btn primary" id="registerBtn">注册</button>
                <button class="account-btn" id="switchToLoginBtn">返回登录</button>
            </div>
        </div>
        <div id="loggedInPanel" style="display:none;">
            <div class="welcome-text" id="welcomeMsg"></div>
        </div>
        <div id="accountMessage" class="info-message"></div>
    </div>

    <!-- 游戏按钮容器（默认隐藏） -->
    <div id="gameButtonsContainer" style="display: none;">
        <button class="btn btn-new" id="newGameBtn">🆕 开启新游戏</button>
        <button class="btn btn-load" id="loadGameBtn">📂 加载旧存档</button>
        <div id="permissionWarning" class="permission-hint" style="display: none;">⚠️ 管理员已禁止你使用存档功能</div>
    </div>

    <!-- 新手教程询问弹窗 -->
    <div class="tutorial-modal" id="tutorialModal" role="dialog" aria-modal="true" aria-labelledby="tutorialModalTitle">
        <div class="tutorial-modal-card">
            <div class="tutorial-modal-icon">📖</div>
            <h3 class="tutorial-modal-title" id="tutorialModalTitle">要先过一遍新手教程吗？</h3>
            <p class="tutorial-modal-text">一分钟看清操作，随后进入新手关实战：跳过障碍、击杀敌人。</p>
            <div class="tutorial-modal-actions">
                <button class="tm-btn tm-primary" id="tutorialYesBtn">进入教程</button>
                <button class="tm-btn tm-ghost" id="tutorialNoBtn">直接开始</button>
            </div>
            <div class="tutorial-modal-tip" id="tutorialModalTip"></div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json,application/json">
    <input type="file" id="accountFileInput" accept=".json,application/json">

    <div id="message" class="info-message"></div>
    <div class="footer">@ bean soil出品</div>
</div>

<script src="../公用文件/js/storage-keys.js"></script>
<script src="../公用文件/js/toast.js"></script>
    <script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
