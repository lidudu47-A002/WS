<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>黑屋 · 从左到右</title>
<!--
  优化清单第 10、19 条：Black room 与 prison 已合流为单入口 game.html?scene=
  本文件仅作为兼容入口保留（教程 / 主页 / 森林 / 旧书签仍指向这里），
  把查询参数与 hash 原样转发给 game.html，行为与旧入口一致。
-->
<script>
(function () {
    var q = (location.search || '').replace(/^\?/, '');
    var parts = q ? q.split('&') : [];
    var keep = [];
    for (var i = 0; i < parts.length; i++) {
        if (!parts[i]) continue;
        var k = parts[i].split('=')[0].toLowerCase();
        if (k === 'scene') continue;          // 丢弃旧 scene 参数，统一由新入口决定
        keep.push(parts[i]);
    }
    keep.unshift('scene=black');
    location.replace('../game.html?' + keep.join('&') + (location.hash || ''));
})();
</script>
</head>
<body>
正在进入黑屋……若未自动跳转，请点击 <a href="../game.html?scene=black">进入黑屋</a>。
</body>
</html>
