<style>
  *{box-sizing:border-box;}

  #app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;}

  /* 顶部标题区 */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:18px;
    padding:12px 22px;border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(12,12,20,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.6px;line-height:1.2;
    background:linear-gradient(90deg,#ffffff,#c9d1d9 60%,#8bd450);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .sub{margin:3px 0 0;font-size:11.5px;color:rgba(230,237,243,.52);letter-spacing:.3px;}
  .stats{display:flex;gap:8px;align-items:center;}
  .pill{
    font-size:11.5px;color:rgba(230,237,243,.72);padding:5px 11px;border-radius:999px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);white-space:nowrap;
  }
  .pill b{color:#fff;font-weight:600;}
  .tools{margin-left:auto;display:flex;gap:8px;align-items:center;}
  #search{
    width:214px;height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
    color:#e6edf3;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;
  }
  #search::placeholder{color:rgba(230,237,243,.38);}
  #search:focus{border-color:rgba(121,192,255,.65);box-shadow:0 0 0 3px rgba(121,192,255,.14);}
  .tools button{
    height:32px;padding:0 12px;border-radius:9px;font-size:12px;font-family:inherit;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:rgba(230,237,243,.86);
    transition:background .15s,border-color .15s,color .15s,transform .1s;white-space:nowrap;
  }
  .tools button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);color:#fff;}
  .tools button:active{transform:translateY(1px);}

  /* 画布 */
  #viewport{position:relative;flex:1 1 auto;overflow:hidden;cursor:grab;touch-action:none;}
  #viewport.grabbing{cursor:grabbing;}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
  #nodes{position:absolute;left:0;top:0;}

  /* 节点 */
  .node{
    position:absolute;display:flex;flex-direction:column;justify-content:center;
    padding:0 12px 0 11px;border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.032));
    border:1px solid rgba(255,255,255,.10);border-left:3px solid var(--c,#8b949e);
    box-shadow:0 6px 18px rgba(0,0,0,.34);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#e6edf3;font-size:12.5px;line-height:1.28;overflow:hidden;
    user-select:none;-webkit-user-select:none;
    transition:box-shadow .15s ease,border-color .15s ease,opacity .18s ease;

  .node .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .node .ds{margin-top:3px;font-size:10.5px;color:rgba(230,237,243,.60);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .node.d0{
    border-left-width:4px;border-color:rgba(255,255,255,.26);border-left-color:var(--c,#fff);
    background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.045));
  }
  .node.d0 .nm{font-size:16px;font-weight:700;letter-spacing:.5px;}
  .node.d1 .nm{font-size:13px;color:var(--c,#e6edf3);}
  .node.d2 .nm{font-size:12.5px;}
  .node.d3 .nm{font-size:12px;color:rgba(230,237,243,.9);}
  .node.has-children{cursor:pointer;}
  .node.has-children:hover{box-shadow:0 0 0 1px var(--c,#fff),0 10px 26px rgba(0,0,0,.46);}
  .node.dim{opacity:.20;}
  .node.match{border-color:#ffd166;box-shadow:0 0 0 2px rgba(255,209,102,.9),0 0 26px rgba(255,209,102,.45);}
  .node.match .nm{color:#ffd166;}
  .node .cnt{

    font-size:9px;line-height:1.3;color:rgba(230,237,243,.55);background:rgba(255,255,255,.08);

  }

    .topbar{background:#0a0a12 !important;backdrop-filter:none;}
    .tools,.hint{display:none !important;}
    #viewport{overflow:visible !important;height:auto;}

  var ctx = document.createElement('canvas').getContext('2d');
  var F0 = '700 16px "Microsoft YaHei", sans-serif';
  var F1 = '600 13px "Microsoft YaHei", sans-serif';
  var F2 = '600 12.5px "Microsoft YaHei", sans-serif';
  var FD = '10.5px "Microsoft YaHei", sans-serif';

  var all = [], map = {}, root = null, uid = 0;
  var vis = [], stageW = 0, stageH = 0;
  var k = 1, tx = 0, ty = 0;
  var matchSet = new Set();

  function prep(n, depth, parent, accent){
    n.id = 'n' + (uid++);
    n.depth = depth;
    n.parent = parent || null;
    n.accent = n.color || accent || '#8b949e';
    n.hasChildren = !!(n.children && n.children.length);
    n.expanded = false;
    if(depth === 0 && DATA.sub && !n.desc){ n.desc = DATA.sub; }

    ctx.font = depth === 0 ? F0 : (depth === 1 ? F1 : F2);
    var tw = ctx.measureText(n.name).width;
    ctx.font = FD;
    var dw = n.desc ? ctx.measureText(n.desc).width : 0;
    var w = Math.ceil(Math.max(tw, dw)) + 27 + (n.hasChildren ? 18 : 0);
    n.w = Math.max(114, Math.min(368, w));
    n.h = n.desc ? 50 : 32;
    if(depth === 0){ n.w = Math.max(n.w, 200); n.h = 64; }

    all.push(n);
    map[n.id] = n;
    (n.children || []).forEach(function(c){ prep(c, depth + 1, n, n.accent); });
  }

  /* ---------- 布局 ---------- */
  function layout(){
    vis = [];
    var cursor = 0;
    (function walk(n, x){
      var kids = (n.expanded && n.hasChildren) ? n.children : [];
      n.vis = kids;
      n.x = x;
      if(!kids.length){
        n.y = cursor + n.h / 2;
        cursor += n.h + GAP_Y;
      }else{
        kids.forEach(function(c){ walk(c, x + n.w + GAP_X); });
        n.y = (kids[0].y + kids[kids.length - 1].y) / 2;
      }
      vis.push(n);
    })(root, 0);

    stageW = 0; stageH = 0;
    vis.forEach(function(n){
      if(n.x + n.w > stageW) stageW = n.x + n.w;
      if(n.y + n.h / 2 > stageH) stageH = n.y + n.h / 2;
    });
    stageW += 24; stageH = Math.max(stageH, cursor);
    stage.style.width  = stageW + 'px';
    stage.style.height = stageH + 'px';
    svg.setAttribute('width', stageW);
    svg.setAttribute('height', stageH);
  }

  /* ---------- 渲染 ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  function curve(p, c){
    var x1 = p.x + p.w, y1 = p.y, x2 = c.x, y2 = c.y;
    var mx = (x1 + x2) / 2;
    return 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2;
  }

  function render(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    vis.forEach(function(n){
      (n.vis || []).forEach(function(c){
        var p = document.createElementNS(NS, 'path');
        p.setAttribute('d', curve(n, c));
        p.setAttribute('fill', 'none');
        p.setAttribute('stroke', c.accent);
        p.setAttribute('stroke-opacity', c.depth === 1 ? 0.55 : (c.depth === 2 ? 0.38 : 0.26));
        p.setAttribute('stroke-width', c.depth === 1 ? 1.7 : 1.1);
        p.setAttribute('stroke-linecap', 'round');
        svg.appendChild(p);
      });
    });

    var frag = document.createDocumentFragment();
    vis.forEach(function(n){
      var el = document.createElement('div');
      var cls = 'node d' + Math.min(n.depth, 3);
      if(n.hasChildren) cls += ' has-children';
      if(matchSet.size) cls += matchSet.has(n.id) ? ' match' : ' dim';
      el.className = cls;
      el.style.left   = n.x + 'px';
      el.style.top    = (n.y - n.h / 2) + 'px';
      el.style.width  = n.w + 'px';
      el.style.height = n.h + 'px';
      el.style.setProperty('--c', n.accent);
      el.setAttribute('data-id', n.id);
      el.setAttribute('title', n.name + (n.desc ? '\n' + n.desc : ''));

      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = n.name;
      el.appendChild(nm);

      if(n.desc){
        var ds = document.createElement('div');
        ds.className = 'ds';
        ds.textContent = n.desc;
        el.appendChild(ds);
      }
      if(n.hasChildren){
        var cnt = document.createElement('span');
        cnt.className = 'cnt';
        cnt.textContent = n.expanded ? '–' : String(n.children.length);
        el.appendChild(cnt);
      }
      frag.appendChild(el);
    });
    nodesEl.textContent = '';
    nodesEl.appendChild(frag);
    updateStats();
  }

  function updateStats(){
    statTotal.innerHTML = '节点 <b>' + all.length + '</b>';
    var t = '可见 <b>' + vis.length + '</b>';
    if(matchSet.size) t = '匹配 <b>' + matchSet.size + '</b> · 可见 <b>' + vis.length + '</b>';
    else if(searchEl.value.trim()) t = '匹配 <b>0</b> · 可见 <b>' + vis.length + '</b>';
    statVisible.innerHTML = t;
  }

  /* ---------- 视图变换 ---------- */
  function apply(){
    stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
  }

  function bounds(){
    var b = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
    vis.forEach(function(n){
      if(n.x < b.x1) b.x1 = n.x;
      if(n.x + n.w > b.x2) b.x2 = n.x + n.w;
      if(n.y - n.h / 2 < b.y1) b.y1 = n.y - n.h / 2;
      if(n.y + n.h / 2 > b.y2) b.y2 = n.y + n.h / 2;
    });
    return b;
  }

  function fit(){
    if(!vis.length) return;
    var b = bounds();
    var vw = viewport.clientWidth || window.innerWidth;
    var vh = viewport.clientHeight || window.innerHeight;
    var pad = 44;
    var kk = Math.min((vw - pad * 2) / (b.x2 - b.x1), (vh - pad * 2) / (b.y2 - b.y1));
    k = Math.max(0.1, Math.min(3.2, kk));
    tx = (vw - (b.x2 - b.x1) * k) / 2 - b.x1 * k;
    ty = (vh - (b.y2 - b.y1) * k) / 2 - b.y1 * k;
    apply();
  }

  function centerOn(n){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    if(k < 0.55) k = 0.55;
    tx = vw / 2 - (n.x + n.w / 2) * k;
    ty = vh / 2 - n.y * k;
    apply();
  }

  /* ---------- 交互 ---------- */
  function toggle(n){
    var oldY = n.y;
    n.expanded = !n.expanded;
    layout(); render();
    ty += (oldY - n.y) * k;
    apply();
  }

  var drag = null;
  viewport.addEventListener('pointerdown', function(e){
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    var t = e.target;
    drag = {
      x: e.clientX, y: e.clientY, tx: tx, ty: ty, moved: false,
      node: (t && t.closest) ? t.closest('.node') : null
    };
    viewport.classList.add('grabbing');
  });
  window.addEventListener('pointermove', function(e){
    if(!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    tx = drag.tx + dx;
    ty = drag.ty + dy;
    apply();
  });
  window.addEventListener('pointerup', function(){
    if(!drag) return;
    var d = drag; drag = null;
    viewport.classList.remove('grabbing');
    if(!d.moved && d.node){
      var n = map[d.node.getAttribute('data-id')];
      if(n && n.hasChildren) toggle(n);
    }
  });
  window.addEventListener('pointercancel', function(){ drag = null; viewport.classList.remove('grabbing'); });

  viewport.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = viewport.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var nk = Math.max(0.1, Math.min(3.2, k * Math.exp(-e.deltaY * 0.0015)));
    if(Math.abs(nk - k) < 1e-6) return;
    tx = mx - (mx - tx) * (nk / k);
    ty = my - (my - ty) * (nk / k);
    k = nk;
    apply();
  }, { passive: false });

  /* ---------- 搜索 ---------- */
  function runSearch(){
    var kw = searchEl.value.trim().toLowerCase();
    matchSet = new Set();
    if(kw){
      all.forEach(function(n){
        var text = (n.name + ' ' + (n.desc || '')).toLowerCase();
        if(text.indexOf(kw) >= 0) matchSet.add(n.id);
      });
      matchSet.forEach(function(id){
        var p = map[id].parent;
        while(p){ p.expanded = true; p = p.parent; }
      });
    }
    layout(); render();
    if(matchSet.size) centerOn(map[matchSet.values().next().value]);
  }
  searchEl.addEventListener('input', runSearch);
  searchEl.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ searchEl.value = ''; runSearch(); searchEl.blur(); }
  });

  /* ---------- 工具栏 ---------- */
  function expandAll(){
    all.forEach(function(n){ if(n.hasChildren) n.expanded = true; });
    layout(); render(); fit();
  }
  function collapseAll(){
    all.forEach(function(n){ n.expanded = false; });
    layout(); render(); fit();
  }
  function reset(){
    all.forEach(function(n){ n.expanded = false; });
    root.expanded = true;
    root.children.forEach(function(c){ c.expanded = c.hasChildren; });
    searchEl.value = '';
    matchSet = new Set();
    layout(); render(); fit();
  }
  document.querySelectorAll('.tools button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var a = btn.getAttribute('data-act');
      if(a === 'expand') expandAll();
      else if(a === 'collapse') collapseAll();
      else if(a === 'reset') reset();
      else if(a === 'fit') fit();
    });
  });

  /* ---------- 打印 ---------- */
  var preView = null;
  window.addEventListener('beforeprint', function(){
    preView = { k: k, tx: tx, ty: ty };
    fit();
  });
  window.addEventListener('afterprint', function(){
    if(preView){ k = preView.k; tx = preView.tx; ty = preView.ty; apply(); preView = null; }
  });

  /* ---------- 初始化 ---------- */
  prep(DATA, 0, null, null);
  root = all[0];
  root.expanded = true;
  root.children.forEach(function(c){ c.expanded = !!c.hasChildren; });
  layout();
  render();
  fit();
  document.documentElement.setAttribute('data-ready', '1');

  window.addEventListener('resize', function(){ apply(); });
})();
</script>
</body>
</html>
